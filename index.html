<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes"/>
<meta name="referrer" content="no-referrer"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh https://cdn.jsdelivr.net https://unpkg.com https://cdn.skypack.dev; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' https: http: blob:; connect-src 'self' https: http:;">
<title>bxfans ~~~ 幻想的な星明かり ~~~~</title>
<link rel="icon" href="favicon.png"/>
<style>
@font-face{
  font-family:'悠哉字体 Light';
  src:url('Yozai-Light.woff2') format('woff2');
  font-display:swap;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'悠哉字体 Light','Hiragino Kaku Gothic ProN','Hiragino Sans','Microsoft JhengHei',sans-serif;
  background:#0b0e1a;color:#fff;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --glass-mult:1;
  --glass-shadow-mult:1;
  --glass-backdrop:blur(40px) saturate(200%) brightness(1.05);
}
#pc-app,#mobile-app{
  position:fixed;inset:0;width:100%;height:100%;
  overflow:hidden;transition:opacity .4s ease;
}
#pc-app{z-index:10;opacity:1;display:block}
#mobile-app{z-index:20;opacity:0;display:none}
.mode-mobile #pc-app{opacity:0;pointer-events:none;display:none}
.mode-mobile #mobile-app{opacity:1;display:flex}

#pc-app{
  --accent:#66ccff;
  --progress-height:2px;
  --glass-bg1:rgba(255,255,255,calc(.095 * var(--glass-mult)));
  --glass-bg2:rgba(255,255,255,calc(.042 * var(--glass-mult)));
  --glass-bg3:rgba(255,255,255,calc(.063 * var(--glass-mult)));
  --glass-border:rgba(255,255,255,calc(.45 * var(--glass-mult)));
  --glass-shadow:
    0 calc(16px * var(--glass-shadow-mult)) calc(48px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.30 * var(--glass-shadow-mult))),
    0 calc(4px * var(--glass-shadow-mult)) calc(12px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.18 * var(--glass-shadow-mult)));
  --text-color:#fff;
  --nav-link-color:#66ccff;
  --play-btn-bg:#66ccff;
}
#pc-app[data-theme="dark"]{
  --glass-bg1:rgba(0,0,0,calc(.45 * var(--glass-mult)));
  --glass-bg2:rgba(0,0,0,calc(.25 * var(--glass-mult)));
  --glass-bg3:rgba(0,0,0,calc(.35 * var(--glass-mult)));
  --glass-border:rgba(255,255,255,calc(.15 * var(--glass-mult)));
  --glass-shadow:
    0 calc(16px * var(--glass-shadow-mult)) calc(48px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.65 * var(--glass-shadow-mult))),
    0 calc(4px * var(--glass-shadow-mult)) calc(12px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.40 * var(--glass-shadow-mult)));
  --text-color:#e0e0e0;
}
#pc-app{
  background:url('722264.jpg') center/cover no-repeat;
  transition:filter 1.2s ease;position:relative;
}
#pc-app::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
  background:rgba(0,0,0,.30);
  backdrop-filter:brightness(.86) saturate(.92);
  -webkit-backdrop-filter:brightness(.86) saturate(.92);
  transition:background 1.2s ease,backdrop-filter 1.2s ease;
}
#pc-app[data-theme="dark"]::before{
  background:rgba(0,0,0,.55);
  backdrop-filter:brightness(.65) saturate(.78);
  -webkit-backdrop-filter:brightness(.65) saturate(.78);
}
#pc-app #header-overlay{
  position:absolute;top:0;left:0;width:100%;height:110px;
  background:#fdeeef;opacity:.30;pointer-events:none;z-index:1;
  transition:opacity .8s ease;
}
#pc-app[data-theme="dark"] #header-overlay{opacity:.10;background:#1a1a2e}
#pc-app #title-text{
  position:absolute;top:20px;width:100%;text-align:center;
  font-weight:bold;pointer-events:none;line-height:1.2;z-index:1;
  transition:color .6s ease;
}
#pc-app #title-text .line1{font-size:1.8em}
#pc-app #title-text .line2{font-size:2.6em}

#pc-app .liquid-glass,
#pc-app #top-right-info,
#pc-app #lyrics-island,
#pc-app #pc-search-container,
#pc-app #gear-island,
#pc-app #modal,
#pc-app #github-island,
#mobile-app #mobile-search-container,
#mobile-app #mobile-github-island{
  backdrop-filter:var(--glass-backdrop);
  -webkit-backdrop-filter:var(--glass-backdrop);
  box-shadow:var(--glass-shadow);
}
#pc-app #top-right-info{
  position:fixed;top:16px;right:16px;z-index:1200;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  padding:12px 18px;border-radius:20px;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);min-width:110px;pointer-events:none;
}
#pc-app #top-right-info .time{font-size:1.2rem;letter-spacing:1px;font-weight:500;color:#fff!important}
#pc-app #top-right-info .weather{display:flex;align-items:center;gap:8px;font-size:.95rem;color:#fff!important}
#pc-app #top-right-info .weather-icon{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#pc-app #top-right-info .weather-icon img{width:100%;height:100%;display:block;object-fit:contain}
#pc-app #top-right-info .weather-icon svg{width:100%;height:100%;display:block}
#pc-app #top-right-info .weather-temp{font-size:1.1rem;font-weight:500}
#pc-app #top-right-info .weather-desc{font-size:.75rem;opacity:.85;margin-left:2px}

#pc-app #lyrics-island{
  position:fixed;top:16px;right:146px;z-index:1150;
  padding:10px 16px;min-width:180px;max-width:280px;border-radius:20px;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.6;text-align:center;opacity:.95;
}
#pc-app #lyrics-island .lyrics-line{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
  transition:font-size .2s ease,opacity .2s ease,color .6s ease;
}
#pc-app #lyrics-island .lyrics-line.current{font-size:1.3rem;font-weight:500}
#pc-app #lyrics-island .lyrics-line.prev,
#pc-app #lyrics-island .lyrics-line.next{font-size:.9rem;opacity:.75}
#pc-app #lyrics-island .lyrics-line.placeholder{font-size:.9rem;opacity:.65;font-style:italic}

#pc-app .liquid-glass{
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);
}
#pc-app #player{
  position:fixed;top:130px;left:20px;width:350px;border-radius:24px;
  padding:14px 16px;z-index:1000;display:flex;align-items:center;gap:14px;
  cursor:grab;touch-action:none;
}
#pc-app #player.dragging{cursor:grabbing;z-index:1002!important}
#pc-app #art-box{
  position:relative;width:56px;height:56px;border-radius:12px;
  overflow:hidden;flex-shrink:0;background:#222;
}
#pc-app #art-box img{width:100%;height:100%;object-fit:cover;display:block}
#pc-app .control-area{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;justify-content:center}
#pc-app .song-info{
  font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.4;padding:0 2px;letter-spacing:.3px;
}
#pc-app #progress-container{
  position:relative;width:100%;height:var(--progress-height);
  border-radius:calc(var(--progress-height)/2);
  background:rgba(255,255,255,.22);cursor:pointer;touch-action:none;
}
#pc-app #progress-fill{
  position:absolute;top:0;left:0;height:100%;width:0%;
  border-radius:calc(var(--progress-height)/2);
  background:linear-gradient(90deg,var(--accent),#88ddff,var(--accent));
  background-size:200% 100%;will-change:width;
}
#pc-app #progress-fill.playing{
  animation:flowGradient 1.8s linear infinite,pulseGlow 1.2s ease-in-out infinite;
}
@keyframes flowGradient{0%{background-position:0% 0%}100%{background-position:200% 0%}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 6px rgba(102,204,255,.4)}
  50%{box-shadow:0 0 16px rgba(102,204,255,.8),0 0 30px rgba(102,204,255,.3)}
}
#pc-app #progress{
  position:absolute;top:0;left:0;width:100%;height:100%;
  opacity:0;cursor:pointer;z-index:2;margin:0;padding:0;touch-action:none;
}
#pc-app #time-display{
  font-size:10px;text-align:right;font-variant-numeric:tabular-nums;
  opacity:.9;padding:0 2px;letter-spacing:.2px;color:#fff!important;
}
#pc-app .controls{display:flex;justify-content:space-between;align-items:center;padding-top:2px}

#pc-app #song-list{
  position:fixed;width:380px;max-height:260px;border-radius:20px;
  overflow-y:auto;z-index:999;padding:8px 0;
  visibility:hidden;pointer-events:none;opacity:0;
  transform:scale(.92) translateY(-8px);transform-origin:top center;
  will-change:transform,opacity;
}
#pc-app #song-list.active{
  visibility:visible;pointer-events:auto;
  animation:listPopIn .35s cubic-bezier(.34,1.56,.64,1) forwards;
}
#pc-app #song-list.hiding{animation:listPopOut .25s ease-in forwards}
@keyframes listPopIn{
  0%{opacity:0;transform:scale(.85) translateY(-12px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes listPopOut{
  0%{opacity:1;transform:scale(1) translateY(0)}
  100%{opacity:0;transform:scale(.9) translateY(-8px)}
}
#pc-app .song-item{
  padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.08);
  cursor:pointer;font-size:14px;transition:background .2s,border-left .2s;
  border-left:3px solid transparent;display:flex;align-items:center;gap:10px;
}
#pc-app .song-item:hover{background:rgba(255,255,255,.08)}
#pc-app .song-item .song-index{font-size:11px;opacity:.55;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
#pc-app .song-item .song-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pc-app .song-item .song-artist{font-size:12px;opacity:.75;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}
#pc-app .song-item.active-song{background:rgba(102,204,255,.18);border-left-color:var(--accent)}
#pc-app .song-item.active-song .song-name{color:#fff}
#pc-app #song-list::-webkit-scrollbar{width:4px}
#pc-app #song-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}

#pc-app .nav-links{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  display:flex;gap:32px;padding:14px 36px;border-radius:50px;z-index:50;
  flex-wrap:wrap;justify-content:center;
}
#pc-app .nav-links a{
  text-decoration:none;font-weight:bold;white-space:nowrap;
  pointer-events:auto;color:var(--nav-link-color);
}
#pc-app .nav-links a:hover{opacity:.8}
#pc-app #github-island{
  position:fixed;left:32px;bottom:40px;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  z-index:50;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);transition:transform .25s ease;
  text-decoration:none;
}
#pc-app #github-island:hover{transform:scale(1.1) rotate(-6deg)}
#pc-app #github-island svg{width:28px;height:28px;fill:rgba(255,255,255,.92)}
#pc-app #icp-footer{
  position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:50;
  font-size:.75rem;letter-spacing:.5px;color:rgba(255,255,255,.7);
  pointer-events:auto;
}
#pc-app #icp-footer a{color:inherit;text-decoration:none}

#pc-app #pc-search-container{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:49;
  width:min(720px,90vw);max-width:760px;border-radius:28px;
  padding:4px 6px 4px 22px;display:flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1.5px solid var(--glass-border);min-height:52px;
}
#pc-app #pc-search-container .search-icon{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:22px;height:22px;color:rgba(255,255,255,.62);
}
#pc-app #pc-search-container .search-icon svg{
  width:100%;height:100%;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
#pc-app #pc-search-input{
  flex:1;background:transparent;border:none;outline:none;color:#fff;
  font-size:clamp(15px,2.2vw,20px);font-family:inherit;
  padding:12px 4px;min-width:0;letter-spacing:.4px;
}
#pc-app #pc-search-input::placeholder{color:rgba(255,255,255,.5);font-weight:300}
#pc-app .clear-btn{
  background:none;border:none;color:rgba(255,255,255,.6);
  font-size:22px;cursor:pointer;padding:0 6px;
  display:flex;align-items:center;justify-content:center;
  height:100%;flex-shrink:0;width:32px;
}
#pc-app .pc-search-btn{
  flex-shrink:0;border:none;border-radius:24px;padding:10px 24px;
  background:rgba(102,204,255,.20);color:#fff;
  font-size:clamp(14px,1.6vw,17px);font-family:inherit;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
#pc-app .pc-search-btn svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}

/* ============================================================
   齿轮图标 —— 增强点击动画
   ============================================================ */
#pc-app #gear-island{
  position:fixed;right:32px;bottom:120px;width:62px;height:62px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1100;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);
  transform-origin:center;
  will-change:transform;
  transition:
    transform .3s cubic-bezier(.34,1.56,.64,1),
    box-shadow .3s ease,
    background .6s ease,
    border-color .6s ease;
}
#pc-app #gear-island:hover{
  transform:scale(1.1) rotate(8deg);
  box-shadow:
    var(--glass-shadow),
    0 0 24px rgba(102,204,255,.35);
}
#pc-app #gear-island:active{
  transform:scale(0.82) rotate(-25deg);
  transition-duration:.08s;
  box-shadow:
    0 0 8px rgba(102,204,255,.6),
    0 0 24px rgba(102,204,255,.3),
    inset 0 2px 8px rgba(0,0,0,.25);
}
#pc-app #gear-island svg{
  width:32px;height:32px;
  color:rgba(255,255,255,.92);
  transition:transform .6s cubic-bezier(.34,1.56,.64,1);
  transform-origin:center;
}
#pc-app #gear-island:hover svg{
  transform:rotate(60deg);
}
#pc-app #gear-island.gear-spin{
  animation:gearClickSpin .72s cubic-bezier(.34,1.56,.64,1);
}
@keyframes gearClickSpin{
  0%   {transform:scale(1) rotate(0deg)}
  25%  {transform:scale(1.18) rotate(120deg)}
  50%  {transform:scale(0.88) rotate(240deg)}
  75%  {transform:scale(1.06) rotate(330deg)}
  100% {transform:scale(1) rotate(360deg)}
}
#pc-app #gear-island.gear-spin svg{
  animation:gearSvgSpin .72s cubic-bezier(.34,1.56,.64,1);
}
@keyframes gearSvgSpin{
  0%   {transform:rotate(0deg)}
  100% {transform:rotate(720deg)}
}
#pc-app #gear-island::after{
  content:'';
  position:absolute;inset:0;border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,
    color-mix(in srgb,var(--accent,#66ccff) 55%,transparent) 0%,
    transparent 70%);
  opacity:0;
  transform:scale(.6);
}
#pc-app #gear-island.gear-pulse::after{
  animation:gearPulse .75s ease-out;
}
@keyframes gearPulse{
  0%   {opacity:.9;transform:scale(.7)}
  100% {opacity:0;transform:scale(2.2)}
}

/* ============================================================
   弹窗
   ============================================================ */
#pc-app #modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .25s ease,visibility .25s ease;
}
#pc-app #modal-overlay.visible{pointer-events:auto;opacity:1;visibility:visible}
#pc-app #modal{
  position:relative;width:600px;max-width:94vw;
  height:min(640px,88vh);min-height:0;max-height:none;
  border-radius:28px;padding:22px 28px 24px 28px;
  display:flex;flex-direction:column;
  background:linear-gradient(145deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  transform:scale(.92) translateY(12px);opacity:0;
  transition:transform .38s cubic-bezier(.1,.9,.2,1),opacity .32s cubic-bezier(.1,.9,.2,1);
  pointer-events:auto;
}
#pc-app #modal-overlay.visible #modal{transform:scale(1) translateY(0);opacity:1}
#pc-app #modal.closing{transform:scale(.92) translateY(12px)!important;opacity:0!important}

#pc-app .modal-header{
  display:flex;align-items:center;justify-content:center;position:relative;
  flex-shrink:0;padding:4px 0 6px 0;min-height:44px;cursor:grab;
}
#pc-app .modal-header:active{cursor:grabbing}
#pc-app #window-controls{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  display:flex;gap:8px;align-items:center;
}
#pc-app .dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0}
#pc-app .dot.red{background:radial-gradient(circle at 35% 35%,#ff6b6b,#d32f2f);cursor:pointer}
#pc-app .dot.yellow{background:radial-gradient(circle at 35% 35%,#ffd93d,#f9a825)}
#pc-app .dot.green{background:radial-gradient(circle at 35% 35%,#6bcf7f,#2e7d32)}
#pc-app .modal-title{
  font-size:1.1rem;font-weight:500;color:var(--text-color);
  letter-spacing:2px;text-align:center;
}
#pc-app .modal-subtitle{
  text-align:center;font-size:.9rem;color:var(--text-color);opacity:.8;
  letter-spacing:3px;padding:4px 0 12px 0;min-height:28px;
}
#pc-app .modal-body{display:flex;flex:1;gap:18px;padding:4px 0 0 0;min-height:0}
#pc-app .modal-sidebar{
  position:relative;display:flex;flex-direction:column;gap:14px;
  padding:8px 6px;flex-shrink:0;
  background:rgba(255,255,255,calc(.04 * var(--glass-mult)));
  border-radius:16px;border:1px solid rgba(255,255,255,calc(.10 * var(--glass-mult)));
  overflow:visible;
}
#pc-app .sidebar-icon{
  position:relative;z-index:1;width:42px;height:42px;border-radius:12px;
  background:transparent;border:1px solid transparent;
  color:rgba(255,255,255,.68);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;outline:none;
}
#pc-app .sidebar-icon svg{width:24px;height:24px}
#pc-app .sidebar-icon:hover{
  color:#fff;
  background:rgba(255,255,255,calc(.10 * var(--glass-mult)));
}
#pc-app .sidebar-icon.active{color:#fff}

/* —— 悬浮提示气泡 —— */
#pc-app .sidebar-icon[data-tooltip]::after{
  content:attr(data-tooltip);
  position:absolute;
  left:calc(100% + 12px);
  top:50%;
  transform:translateY(-50%) translateX(-6px) scale(.94);
  transform-origin:left center;
  background:rgba(18,20,30,.90);
  color:#fff;
  font-size:.72rem;
  font-weight:400;
  letter-spacing:.6px;
  line-height:1;
  padding:7px 12px;
  border-radius:9px;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  z-index:30;
  box-shadow:0 6px 22px rgba(0,0,0,.38);
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.34,1.56,.64,1),
             visibility .18s ease;
}
#pc-app .sidebar-icon[data-tooltip]:hover::after,
#pc-app .sidebar-icon[data-tooltip]:focus-visible::after{
  opacity:1;
  visibility:visible;
  transform:translateY(-50%) translateX(0) scale(1);
}

#pc-app .sidebar-indicator{
  position:absolute;left:6px;top:8px;width:42px;height:42px;border-radius:12px;
  background:rgba(102,204,255,.22);border:1px solid var(--accent,#66ccff);
  box-shadow:0 4px 16px rgba(102,204,255,.30);
  pointer-events:none;z-index:0;
  transition:top .45s cubic-bezier(.34,1.56,.64,1),left .45s cubic-bezier(.34,1.56,.64,1),
             width .45s cubic-bezier(.34,1.56,.64,1),height .45s cubic-bezier(.34,1.56,.64,1);
}

#pc-app .color-swatches{

#mobile-app{opacity:0;animation:fadeInMobile 1.2s ease .2s forwards}
@keyframes fadeInMobile{
  0%{opacity:0;transform:translateY(12px) scale(.98)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes jellySettle{
  0%{scale:1 1;rotate:0deg}
  22%{scale:1.10 .90;rotate:var(--jelly-tilt,0deg)}
  48%{scale:.93 1.08;rotate:calc(var(--jelly-tilt,0deg) * -.55)}
  72%{scale:1.04 .97;rotate:calc(var(--jelly-tilt,0deg) * .25)}
  100%{scale:1 1;rotate:0deg}
}
.jelly-interactive{
  transform-origin:center;
  transition:translate .18s cubic-bezier(.2,.8,.2,1),rotate .18s ease;
  will-change:translate,rotate,scale;
}
.jelly-interactive.jelly-grabbed{
  transition:translate .06s linear,rotate .08s linear;
  filter:drop-shadow(0 7px 12px rgba(0,0,0,.18));
}

<div id="pc-app" data-theme="light" data-visual-style="glass">
  <div id="header-overlay"></div>
  <div id="title-text">
    <div class="line1">来了,</div>
    <div class="line2">バラモン！</div>
  </div>

  <div id="top-right-info" class="liquid-glass">
    <div class="time" id="clock">--:--:--</div>
    <div class="weather" id="weather-info">
      <span class="weather-icon" id="weather-icon"></span>
      <span class="weather-temp" id="weather-temp">--°C</span>
      <span class="weather-desc" id="weather-desc"></span>
    </div>
  </div>

  <div id="lyrics-island" class="liquid-glass">
    <div class="lyrics-line placeholder" id="lyrics-line-1">♪ 等待歌词...</div>
    <div class="lyrics-line current" id="lyrics-line-2">♪ 加载中...</div>
    <div class="lyrics-line placeholder" id="lyrics-line-3">♪ 请播放歌曲</div>
  </div>

  <div id="player" class="liquid-glass">
    <div id="art-box">
      <img src="CD.jpg" alt="cover" id="cover-img" onerror="this.src='CD.jpg'"/>
    </div>
    <div class="control-area">
      <div class="song-info" id="song-info">加载中...</div>
      <div id="progress-container">
        <div id="progress-fill"></div>
        <div class="wave-overlay"></div>
        <input type="range" id="progress" value="0" step="0.001" aria-label="播放进度"/>
      </div>
      <div id="time-display">00:00 / 00:00 / 00:00</div>
      <div class="controls">
        <button id="prev-btn" class="md3-icon-btn" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="main-play-btn" aria-label="播放/暂停" style="border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg id="play-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button id="next-btn" class="md3-icon-btn" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="mode-btn" class="md3-icon-btn" aria-label="切换播放模式">
          <span id="mode-icon" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%"></span>
        </button>
        <button id="list-btn" class="md3-icon-btn" style="font-size:18px;font-weight:300" aria-label="播放列表">☰</button>
      </div>
    </div>
  </div>

  <div id="song-list" class="liquid-glass"></div>

  <div id="pc-search-container">
    <span class="search-icon">

<script>
(function(){
'use strict';
if(window.__PC_APP_INITIALIZED__){console.warn('⚠️ 已初始化，跳过');return;}
window.__PC_APP_INITIALIZED__=true;

const YANDEX_SEARCH_URL='https://yandex.com/search/?text=';

/* ============ 安全存储 ============ */
const safeStore={
  get(key,fallback){
    try{
      const raw=localStorage.getItem(key);
      return raw===null?fallback:raw;
    }catch(e){return fallback;}
  },
  set(key,value){
    try{localStorage.setItem(key,String(value));}catch(e){}
  },
  getJSON(key,fallback){
    try{
      const raw=localStorage.getItem(key);
      if(!raw)return fallback;
      return JSON.parse(raw);
    }catch(e){return fallback;}
  },
  setJSON(key,obj){
    try{localStorage.setItem(key,JSON.stringify(obj));}catch(e){}
  }
};

/* ============ 网易云 API 通道（带成功记忆） ============ */
const API_INSTANCES=[
  'https://ncm.zhenxin.me',
  'https://zm.i9mr.com',
  'https://ncm.landdy.cn',
  'https://music.mcseekeri.com',
  'https://zm.wwoyun.cn',
  'https://ncme.zhenxin.me',
];
const CORS_PROXIES=[
  '',
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
];
const API_CHANNEL_KEY='api_channel_v2';
const API_CHANNEL_TTL=12*60*60*1000;

let CONFIG={
  API_BASE:'',
  PROXY:'',
  ARTIST_ID:'1078425',
  ALBUM_ID:'244810615',
  EXCLUDED_IDS:['32192205','4886973','500665207'],
};

function loadCachedChannel(){
  const data=safeStore.getJSON(API_CHANNEL_KEY,null);
  if(!data||!data.base)return null;
  if(Date.now()-(data.ts||0)>API_CHANNEL_TTL)return null;
  if(!API_INSTANCES.includes(data.base))return null;
  if(!CORS_PROXIES.includes(data.proxy||''))return null;
  return {base:data.base,proxy:data.proxy||''};
}

function saveCachedChannel(base,proxy){
  safeStore.setJSON(API_CHANNEL_KEY,{base,proxy:proxy||'',ts:Date.now()});
}

function buildUrl(base,path,proxy){
  const target=base+path;
  if(!proxy)return target;
  return proxy+encodeURIComponent(target);
}

async function tryFetchJson(base,proxy,path,timeoutMs){
  const url=buildUrl(base,path,proxy);
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeoutMs||8000);
    const resp=await fetch(url,{signal:controller.signal,mode:'cors',credentials:'omit',referrerPolicy:'no-referrer'});
    clearTimeout(timer);
    if(!resp.ok)return{ok:false,reason:'HTTP '+resp.status};
    const text=await resp.text();
    const trimmed=text.trim();
    if(!trimmed)return{ok:false,reason:'空响应'};
    const head=trimmed.slice(0,15).toLowerCase();
    if(trimmed.charAt(0)==='<'||head.indexOf('<!doctype')>=0||head.indexOf('<html')>=0){
      return{ok:false,reason:'返回 HTML 而非 JSON'};
    }
    let json;
    try{json=JSON.parse(trimmed);}catch(e){return{ok:false,reason:'JSON 解析失败: '+e.message};}
    return{ok:true,json,url};
  }catch(e){
    return{ok:false,reason:(e.name==='AbortError'?'超时':'网络错误: '+e.message)};
  }
}

async function apiFetchJson(path,validator){
  const tryOrder=[];
  if(CONFIG.API_BASE){
    tryOrder.push({base:CONFIG.API_BASE,proxy:CONFIG.PROXY||''});
  }
  for(const base of API_INSTANCES){
    for(const proxy of CORS_PROXIES){
      if(base===CONFIG.API_BASE&&proxy===(CONFIG.PROXY||''))continue;
      tryOrder.push({base,proxy});
    }
  }
  let lastReason='';
  for(const ch of tryOrder){
    const r=await tryFetchJson(ch.base,ch.proxy,path);
    if(!r.ok){lastReason=r.reason;continue;}
    if(validator&&!validator(r.json)){lastReason='数据结构不符';continue;}
    if(ch.base!==CONFIG.API_BASE||(ch.proxy||'')!==(CONFIG.PROXY||'')){
      CONFIG.API_BASE=ch.base;
      CONFIG.PROXY=ch.proxy||'';
      saveCachedChannel(CONFIG.API_BASE,CONFIG.PROXY);
      console.log('🎵 ✔ 切换到通道:',ch.base,ch.proxy?'[代理]':'[直连]');
    }
    return r.json;
  }
  console.error('🎵 ✘ 所有通道失败，最后原因:',lastReason);
  throw new Error('所有 API 通道均失败：'+lastReason);
}

async function pickWorkingApiInstance(){
  const cached=loadCachedChannel();
  if(cached){
    console.log('🎵 尝试使用记忆的通道:',cached.base,cached.proxy?'[代理]':'[直连]');
    const r=await tryFetchJson(cached.base,cached.proxy,'/artist/songs?id='+CONFIG.ARTIST_ID,6000);
    if(r.ok){
      const list=(r.json.data&&r.json.data.songs)||r.json.songs||(r.json.data&&r.json.data.list)||r.json.list||r.json.data||[];
      if(Array.isArray(list)&&list.length>0){
        CONFIG.API_BASE=cached.base;
        CONFIG.PROXY=cached.proxy;

const GLASS_KEY='glass_intensity',DEFAULT_GLASS=70;
let glassIntensity=DEFAULT_GLASS;
function applyGlassIntensity(value){
  value=Math.max(0,Math.min(100,parseInt(value,10)||0));
  glassIntensity=value;
  let mult;
  if(value===0){mult=0;}
  else{
    const n=value/70;
    mult=Math.pow(n,3);
    if(value>70){const e=(value-70)/30;mult*=1+e*1.4;}
  }
  document.documentElement.style.setProperty('--glass-mult',mult.toFixed(4));
  let sm;
  if(value===0){sm=0;}else{sm=value/70;}
  document.documentElement.style.setProperty('--glass-shadow-mult',sm.toFixed(4));
  let bf;
  if(value===0){bf='none';}
  else{
    const t=value/100;
    bf='blur('+(t*40).toFixed(1)+'px) saturate('+(100+t*100).toFixed(0)+'%) brightness('+(1+t*0.05).toFixed(3)+')';
  }
  document.documentElement.style.setProperty('--glass-backdrop',bf);
  const fill=document.getElementById('transparency-fill');
  const range=document.getElementById('transparency-range');
  const valEl=document.getElementById('transparency-value');
  if(fill)fill.style.width=value+'%';
  if(range)range.value=value;
  if(valEl)valEl.textContent=value;
  safeStore.set(GLASS_KEY,value);
}
function readSavedGlassIntensity(){
  const v=safeStore.get(GLASS_KEY,null);
  if(v===null)return DEFAULT_GLASS;
  const n=parseInt(v,10);
  if(isNaN(n)||n<0||n>100)return DEFAULT_GLASS;
  return n;
}
function initGlassIntensity(){

}

    function tryCors(){
      const img2=new Image();
      img2.crossOrigin='anonymous';
      img2.referrerPolicy='no-referrer';
      img2.onload=function(){if(!processImage(img2)){done(null);}};
      img2.onerror=function(){done(null);};
      const sep=absUrl.indexOf('?')>=0?'&':'?';
      img2.src=absUrl+sep+'_mcu='+Date.now();
    }
    img1.src=absUrl;
    setTimeout(function(){if(!resolved)done(null);},5000);
  });
}
async function precomputeMd3Seed(imageUrl){
  if(!imageUrl)return null;
  const absUrl=resolveImageUrl(imageUrl);
  if(__md3SeedHct&&__md3SeedHct.__src===absUrl)return __md3SeedHct;
  let seed=await extractSeedHct(absUrl);
  if(!seed){const fh=stringHash(absUrl)%360;seed={hue:fh,chroma:48,tone:50};}
  seed.__src=absUrl;
  __md3SeedHct=seed;
  return seed;
}
function generateMd3Scheme(seed,isDark){
  const MCU=window.__MCU__;
  if(!seed||typeof seed.hue!=='number')return;
  if(MCU&&MCU.Hct&&MCU.SchemeTonalSpot&&MCU.MaterialDynamicColors&&MCU.hexFromArgb){
    try{
      const seedHct=MCU.Hct.from(seed.hue,seed.chroma||48,seed.tone||50);
      const scheme=new MCU.SchemeTonalSpot(seedHct,!!isDark,0);
      const app=document.getElementById('pc-app');
      MD3_ROLES.forEach(function(pair){
        const mcuName=pair[0],cssName=pair[1];
        const dc=MCU.MaterialDynamicColors[mcuName];
        if(!dc)return;
        try{app.style.setProperty('--md-sys-color-'+cssName,MCU.hexFromArgb(dc.getArgb(scheme)));}catch(e){}
      });
      try{
        const primaryHex=MCU.hexFromArgb(MCU.MaterialDynamicColors.primary.getArgb(scheme));
        app.style.setProperty('--accent',primaryHex);
        app.style.setProperty('--play-btn-bg',primaryHex);
      }catch(e){}
      return;
    }catch(e){}
  }
  generateSimplifiedMd3Scheme(seed.hue,isDark);
}

function mapSongToLocal(song){
  let artistName='未知歌手';
  if(song.ar&&Array.isArray(song.ar)&&song.ar[0]&&song.ar[0].name){artistName=song.ar[0].name;}
  else if(song.artists&&Array.isArray(song.artists)&&song.artists[0]&&song.artists[0].name){artistName=song.artists[0].name;}
  else if(song.artist&&typeof song.artist==='string'){artistName=song.artist;}
  else if(song.artist&&song.artist.name){artistName=song.artist.name;}
  else if(song.singer){artistName=song.singer;}
  const albumName=(song.al&&song.al.name)||song.album||'未知专辑';
  const coverUrl=(song.al&&song.al.picUrl)||song.picUrl||song.cover||'';
  return{
    id:String(song.id),
    name:String(song.name||song.title||'未知歌曲'),
    artist:String(artistName),
    album:String(albumName),
    cover:String(coverUrl)
  };
}

async function fetchArtistSongs(artistId){

async function fetchSongUrl(songId){
  if(songUrlCache[songId])return songUrlCache[songId];
  const json=await apiFetchJson(
    '/song/url/v1?id='+songId+'&level=exhigh',
    function(j){return (j.data&&j.data[0]&&j.data[0].url)||j.url||(j.data&&j.data.url);}
  );
  let playUrl=(json.data&&json.data[0]&&json.data[0].url)||json.url||(json.data&&json.data.url)||'';
  if(!playUrl)throw new Error('未获取到播放地址');

async function fetchSongLyric(songId){
  if(lyricCache[songId])return lyricCache[songId];
  const json=await apiFetchJson('/lyric?id='+songId);
  const lyricText=(json.data&&json.data.lyric)||json.lyric||(json.lrc&&json.lrc.lyric)||(json.data&&json.data.lrc&&json.data.lrc.lyric)||'';
  if(!lyricText)return null;
  const parsed=parseLRC(lyricText);
  lyricCache[songId]=parsed;
  return parsed;
}

function parseLRC(lrcText){
  const lines=lrcText.split('\n');
  const parsed=[];
  const timeRegex=/\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
  for(let line of lines){
    const trimmed=line.trim();
    if(!trimmed)continue;
    const match=trimmed.match(timeRegex);
    if(match){
      const minutes=parseInt(match[1]);
      const seconds=parseInt(match[2]);
      const ms=parseInt(match[3].padEnd(3,'0'));
      const totalSeconds=minutes*60+seconds+ms/1000;
      const text=trimmed.replace(timeRegex,'').trim();
      if(text)parsed.push({time:totalSeconds,text:text});
    }
  }
  if(parsed.length===0){
    const textLines=lrcText.split('\n').filter(l=>l.trim().length>0);
    if(textLines.length>0){
      const dur=audio.duration||180;
      const step=dur/textLines.length;
      return textLines.map((t,i)=>({time:i*step,text:t.trim()}));
    }
    return null;
  }
  parsed.sort((a,b)=>a.time-b.time);
  return parsed;
}

function updateLyrics(){
  if(!lyricLines||lyricLines.length===0){
    updateLyricsDisplay('♪ 无歌词','♪ 无歌词','♪ 无歌词');
    return;
  }
  const currentTime=audio.currentTime||0;
  let idx=0;
  for(let i=0;i<lyricLines.length;i++){
    if(lyricLines[i].time<=currentTime)idx=i;
    else break;
  }
  if(idx>=lyricLines.length)idx=lyricLines.length-1;
  const prevIdx=idx-1>=0?idx-1:0;
  const nextIdx=idx+1<lyricLines.length?idx+1:lyricLines.length-1;
  lyricsLine1.textContent=lyricLines[prevIdx].text||'♪';
  lyricsLine2.textContent=lyricLines[idx].text||'♪';
  lyricsLine3.textContent=lyricLines[nextIdx].text||'♪';
  lyricsLine1.className='lyrics-line prev';
  lyricsLine2.className='lyrics-line current';
  lyricsLine3.className='lyrics-line next';
  if(prevIdx===idx)lyricsLine1.textContent='';
  if(nextIdx===idx)lyricsLine3.textContent='';
}

async function loadAndPlay(index,startTime){
  if(index<0||index>=songList.length)return;
  currentIdx=index;
  const song=songList[index];
  updateSongInfo();
  highlightCurrentSong();
  coverImg.src=song.cover||'CD.jpg';

  if(!song.cover){
    const cover=await fetchSongCover(song.id);
    if(cover){song.cover=cover;coverImg.src=cover;}
  }

  try{
    const url=await fetchSongUrl(song.id);
    audio.src=url;
    if(typeof startTime==='number'&&startTime>0){
      audio.currentTime=startTime;
    }
    audio.load();
    const p=audio.play();
    if(p!==undefined){
      p.then(()=>setPlayingState(true)).catch(err=>{
        console.warn('自动播放被拦截:',err);
        setPlayingState(false);
      });
    }
  }catch(e){
    console.error('❌ 获取播放地址失败:',e);
    audio.src='';
    setPlayingState(false);
    songInfoEl.textContent=song.name+' - 播放失败 (请检查控制台)';
  }

  try{
    const lyric=await fetchSongLyric(song.id);
    if(lyric&&lyric.length>0)lyricLines=lyric;
    else{lyricLines=[];updateLyricsDisplay('♪ 无歌词','♪ 无歌词','♪ 无歌词');}
  }catch(e){
    lyricLines=[];
    updateLyricsDisplay('♪ 歌词加载失败','♪ 请稍后重试','♪');
  }

  if(coverCache[song.id])coverImg.src=coverCache[song.id];
  updateProgress();
  applyWhiteToHighlights();
  setTimeout(adjustLyricsIslandPosition,100);
  savePlaybackState();
}

function togglePlayInternal(){

function prevInternal(){
  if(songList.length===0)return;

function nextInternal(){

  if(mode===2)currentIdx=Math.floor(Math.random()*songList.length);

/* ============ 主题切换 ============ */
let currentTheme='light',isTransitioning=false;
const transitionOverlay=document.getElementById('theme-transition-overlay');
const switchTrack=document.getElementById('switch-track');
const moonBtn=document.getElementById('moon-btn');
const sunBtn=document.getElementById('sun-btn');
const gearBtn=document.getElementById('gear-island');
const autoSwitchTrack=document.getElementById('auto-switch-track');
const autoCheckbox=document.getElementById('auto-theme-checkbox');
let autoThemeEnabled=true,systemThemeListener=null;
const manualControls=[moonBtn,switchTrack,sunBtn];

function setManualControlsDisabled(disabled){
  manualControls.forEach(el=>{
    if(disabled)el.classList.add('disabled');
    else el.classList.remove('disabled');
  });
}
function applySystemTheme(){
  if(autoThemeEnabled){
    const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark?'dark':'light');
  }
}
function setupAutoTheme(){
  if(autoThemeEnabled){
    if(systemThemeListener)systemThemeListener.removeEventListener('change',applySystemTheme);
    systemThemeListener=window.matchMedia('(prefers-color-scheme: dark)');
    systemThemeListener.addEventListener('change',applySystemTheme);
    applySystemTheme();
    setManualControlsDisabled(true);
  }else{
    if(systemThemeListener){
      systemThemeListener.removeEventListener('change',applySystemTheme);
      systemThemeListener=null;
    }
    setManualControlsDisabled(false);
  }
}
function setTheme(theme){
  if(theme===currentTheme||isTransitioning)return;
  const toDark=theme==='dark';
  const waveColor=toDark?'rgba(128,128,128,0.15)':'rgba(255,255,255,0.15)';
  const r=gearBtn.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  isTransitioning=true;
  const overlay=transitionOverlay;
  overlay.style.background=waveColor;
  overlay.style.clipPath='circle(0% at '+cx+'px '+cy+'px)';
  overlay.classList.add('animating');
  overlay.style.visibility='visible';
  overlay.style.opacity='1';
  void overlay.offsetWidth;
  overlay.style.transition='clip-path 0.7s cubic-bezier(0.25,0.46,0.45,0.94)';
  overlay.style.clipPath='circle(150% at '+cx+'px '+cy+'px)';
  const onEnd=function(){
    overlay.removeEventListener('transitionend',onEnd);
    applyTheme(theme);
    overlay.style.transition='none';
    overlay.classList.remove('animating');
    overlay.style.visibility='hidden';
    overlay.style.opacity='0';
    overlay.style.clipPath='';
    overlay.style.background='transparent';
    isTransitioning=false;
  };
  overlay.addEventListener('transitionend',onEnd);
  setTimeout(function(){
    if(isTransitioning){
      overlay.removeEventListener('transitionend',onEnd);
      applyTheme(theme);
      overlay.style.transition='none';
      overlay.classList.remove('animating');
      overlay.style.visibility='hidden';
      overlay.style.opacity='0';
      overlay.style.clipPath='';
      overlay.style.background='transparent';
      isTransitioning=false;
    }
  },1200);
}
function toggleTheme(){
  if(isTransitioning||autoThemeEnabled)return;
  const target=currentTheme==='light'?'dark':'light';
  setTheme(target);
}
function updateSwitchUI(theme){
  if(theme==='dark'){
    switchTrack.classList.add('active');
    moonBtn.classList.add('active');
    sunBtn.classList.remove('active');
  }else{
    switchTrack.classList.remove('active');
    moonBtn.classList.remove('active');
    sunBtn.classList.add('active');
  }
  switchTrack.setAttribute('aria-checked',theme==='dark'?'true':'false');
}
function applyTheme(theme){
  document.getElementById('pc-app').setAttribute('data-theme',theme);
  currentTheme=theme;
  updateSwitchUI(theme);
  refreshWeatherIcon();
  if(currentVisualStyle==='md3e')refreshMd3Scheme();
}
function updateAutoSwitchUI(enabled){
  if(enabled){
    autoSwitchTrack.classList.add('active');
    autoCheckbox.checked=true;
  }else{
    autoSwitchTrack.classList.remove('active');
    autoCheckbox.checked=false;
  }
  autoSwitchTrack.setAttribute('aria-checked',enabled?'true':'false');
  setManualControlsDisabled(enabled);
}
function syncSwitchUI(){updateSwitchUI(currentTheme);}
function initAutoSwitch(){
  autoThemeEnabled=true;
  autoCheckbox.checked=true;
  updateAutoSwitchUI(true);
  setupAutoTheme();
}
moonBtn.addEventListener('click',function(){if(!autoThemeEnabled)setTheme('dark');});
sunBtn.addEventListener('click',function(){if(!autoThemeEnabled)setTheme('light');});

});

function compressImage(file,maxDim,quality){
  return new Promise(function(resolve,reject){
    const reader=new FileReader();
    reader.onload=function(){
      const img=new Image();
      img.onload=function(){
        try{
          let w=img.naturalWidth||img.width||1;
          let h=img.naturalHeight||img.height||1;
          const scale=Math.min(1,maxDim/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale));
          h=Math.max(1,Math.round(h*scale));
          const canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext('2d');
          if(!ctx)throw new Error('no ctx');
          ctx.drawImage(img,0,0,w,h);
          let out=null;
          try{out=canvas.toDataURL('image/jpeg',quality);}catch(e){out=reader.result;}
          if(out&&out.length>4*1024*1024){
            try{out=canvas.toDataURL('image/jpeg',0.58);}catch(e){}
          }
          resolve(out||reader.result);
        }catch(e){resolve(reader.result);}
      };
      img.onerror=function(){reject(new Error('图片解码失败'));};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error('文件读取失败'));};
    reader.readAsDataURL(file);
  });
}

  /* ---- 自定义壁纸：链接 ---- */
  if(bgUrlApply){
    bgUrlApply.addEventListener('click',function(e){
      e.stopPropagation();
      const url=(bgUrlInput&&bgUrlInput.value||'').trim();
      if(!url){
        setCustomBgStatus('请输入图片链接');
        if(bgUrlInput)bgUrlInput.focus();
        return;
      }
      setCustomBgStatus('加载中…');
      applyCustomWallpaper(url,{statusText:'✓ 已应用链接壁纸'});
    });
  }
  if(bgUrlInput){
    bgUrlInput.addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();if(bgUrlApply)bgUrlApply.click();}
    });
  }

  /* ---- 自定义壁纸：本地文件 ---- */
  if(bgFile){
    bgFile.addEventListener('change',async function(){
      const file=this.files&&this.files[0];
      if(!file)return;
      if(!/^image\//.test(file.type)){
        setCustomBgStatus('✕ 请选择图片文件');
        this.value='';
        return;
      }
      setCustomBgStatus('处理图片中…');
      try{
        const dataUrl=await compressImage(file,1920,0.82);
        applyCustomWallpaper(dataUrl,{statusText:'✓ 已应用：'+file.name});
      }catch(err){
        setCustomBgStatus('✕ 图片处理失败');
      }
      this.value='';
    });
  }

  /* ---- 自定义壁纸：恢复预设 ---- */
  if(bgReset){
    bgReset.addEventListener('click',function(e){
      e.stopPropagation();
      const key=THUMB_IMAGES[appliedThumbIndex]||'722264.jpg';
      customWallpaper=null;
      currentWallpaperUrl=key;
      safeStore.set(CUSTOM_BG_KEY,'');
      safeStore.set(CUSTOM_BG_ACTIVE_KEY,'0');
      const app=document.getElementById('pc-app');
      app.style.backgroundImage="url('"+key+"')";
      app.style.backgroundSize='cover';
      app.style.backgroundPosition='center';
      app.style.backgroundRepeat='no-repeat';
      if(currentVisualStyle==='md3e')refreshMd3Scheme();
      setCustomBgStatus('已恢复预设壁纸');
      if(bgUrlInput)bgUrlInput.value='';
    });
  }

  /* ---- 自定义颜色：色盘 ---- */
  if(colorInput){
    colorInput.addEventListener('input',function(){
      const v=this.value;
      customColor=v;
      applyColorScheme(v);
      highlightSwatch(v);
      setCustomColorStatus('预览中…');
    });
    colorInput.addEventListener('change',function(){
      commitCustomColor(this.value);
    });
  }
  if(colorApply){
    colorApply.addEventListener('click',function(e){
      e.stopPropagation();
      commitCustomColor(colorInput?colorInput.value:'#66ccff');
    });
  }
  if(colorReset){
    colorReset.addEventListener('click',function(e){
      e.stopPropagation();
      customColor=null;
      safeStore.set(CUSTOM_COLOR_KEY,'');
      const c=getThumbColor(appliedThumbIndex);
      if(colorInput)colorInput.value=c;
      applyColorScheme(c);
      if(currentVisualStyle==='md3e')refreshMd3Scheme();
      highlightSwatch(c);
      setCustomColorStatus('已恢复壁纸默认色');
    });
  }
  if(colorAuto){
    colorAuto.addEventListener('click',async function(e){
      e.stopPropagation();
      setCustomColorStatus('提取中…');
      try{
        const seed=await precomputeMd3Seed(currentWallpaperUrl);
        if(seed&&typeof seed.hue==='number'){
          const hex=hslToHex(seed.hue,72,62);
          if(colorInput)colorInput.value=hex;
          commitCustomColor(hex);
          setCustomColorStatus('✓ 已从壁纸提取');
        }else{
          setCustomColorStatus('✕ 提取失败，请换张壁纸试试');
        }
      }catch(err){
        setCustomColorStatus('✕ 提取失败');
      }
    });
  }
  if(swatches){
    swatches.addEventListener('click',function(e){
      const btn=e.target.closest('.color-swatch');
      if(!btn)return;
      e.stopPropagation();
      const c=btn.dataset.color;
      if(!c)return;
      if(colorInput)colorInput.value=c;
      commitCustomColor(c);
    });
  }
}

/* ============ Cookie (SameSite=Lax) ============ */
function setCookie(name,value,days){
  const expires=new Date(Date.now()+days*24*60*60*1000).toUTCString();
  document.cookie=name+'='+encodeURIComponent(value)+'; expires='+expires+'; path=/; SameSite=Lax';
}
function getCookie(name){
  const match=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  if(match)return decodeURIComponent(match[2]);
  return null;
}

/* ============ 时间 / 天气 ============ */
const clockEl=document.getElementById('clock');
const weatherTempEl=document.getElementById('weather-temp');
const weatherDescEl=document.getElementById('weather-desc');
let userTimeZone='Asia/Shanghai';

function updateClock(){
  const now=new Date();
  try{
    const fmt=new Intl.DateTimeFormat('zh-CN',{
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:userTimeZone
    });
    clockEl.textContent=fmt.format(now);
  }catch(e){
    const offset=8*60;
    const local=new Date(now.getTime()+(offset-now.getTimezoneOffset())*60000);
    clockEl.textContent=
      String(local.getHours()).padStart(2,'0')+':'+
      String(local.getMinutes()).padStart(2,'0')+':'+
      String(local.getSeconds()).padStart(2,'0');
  }
}
updateClock();
setInterval(updateClock,1000);

fetch('https://ipapi.co/json/',{referrerPolicy:'no-referrer'})
  .then(r=>r.json())
  .then(d=>{
    if(d&&d.timezone){userTimeZone=d.timezone;updateClock();}
  })
  .catch(()=>{});

const WEATHER_CACHE_KEY='weather_cache',CACHE_DURATION=10*60*1000;
function updateWeatherUI(data){
  __lastWeatherCode=data.code||119;
  weatherTempEl.textContent=data.temp+'°C';
  weatherDescEl.textContent=data.desc||'';
  refreshWeatherIcon();
}
function fetchWeather(){
  const cached=safeStore.getJSON(WEATHER_CACHE_KEY,null);
  if(cached&&Date.now()-cached.timestamp<CACHE_DURATION){
    updateWeatherUI(cached);
    return;
  }
  fetch('https://wttr.in/?format=j1&lang=zh',{referrerPolicy:'no-referrer'})
    .then(r=>r.json())
    .then(json=>{
      const current=json.current_condition[0];
      const data={
        temp:current.temp_C,
        desc:current.weatherDesc[0].value,
        code:parseInt(current.weatherCode),
        timestamp:Date.now()
      };
      safeStore.setJSON(WEATHER_CACHE_KEY,data);
      updateWeatherUI(data);
    })
    .catch(()=>{
      updateWeatherUI({temp:'22',desc:'多云',code:119,timestamp:Date.now()});
    });
}
fetchWeather();
setInterval(fetchWeather,CACHE_DURATION);

function adjustLyricsIslandPosition(){
  const timeInfo=document.getElementById('top-right-info');
  if(!timeInfo)return;
  const rect=timeInfo.getBoundingClientRect();
  const island=document.getElementById('lyrics-island');
  if(!island)return;
  island.style.top=rect.top+'px';
  island.style.right=(window.innerWidth-rect.left+12)+'px';
}

const pcInput=document.getElementById('pc-search-input');

/* ============ 构建歌曲列表 ============ */
function buildSongListUI(){
  songListEl.innerHTML='';
  if(!songList||!Array.isArray(songList)||songList.length===0){
    const empty=document.createElement('div');
    empty.className='song-item';
    empty.style.color='#aaa';
    empty.style.padding='12px';
    empty.textContent='暂无歌曲数据';
    songListEl.appendChild(empty);
    return;
  }
  songList.forEach((song,index)=>{
    if(!song||typeof song!=='object')return;
    const div=document.createElement('div');
    div.className='song-item';
    div.dataset.index=index;
    const idxSpan=document.createElement('span');
    idxSpan.className='song-index';
    idxSpan.textContent=String(index+1).padStart(2,'0');
    const nameSpan=document.createElement('span');
    nameSpan.className='song-name';
    nameSpan.textContent=song.name||'未知歌曲';
    div.appendChild(idxSpan);
    div.appendChild(nameSpan);
    if(song.artist){
      const artistSpan=document.createElement('span');
      artistSpan.className='song-artist';
      artistSpan.textContent=song.artist;
      div.appendChild(artistSpan);
    }
    div.addEventListener('click',function(){
      const idx=parseInt(this.dataset.index);
      if(idx!==currentIdx)loadAndPlay(idx);
      else togglePlayInternal();
      closeListWithAnimation();
    });
    songListEl.appendChild(div);
  });
  highlightCurrentSong();
  updateSongInfo();
}

/* ============ 初始化 ============ */
async function initPlayer(){
  try{
    await pickWorkingApiInstance();
    console.log('🎵 开始加载歌曲…');
    const [artistSongs,albumSongs] = await Promise.all([
      fetchArtistSongs(CONFIG.ARTIST_ID).catch(e=>{
        console.warn('🎵 歌手歌曲获取失败:',e);
        return [];
      }),
      fetchAlbumSongs(CONFIG.ALBUM_ID).catch(e=>{
        console.warn('🎵 专辑歌曲获取失败:',e);
        return [];
      })
    ]);
    console.log('🎵 歌手歌曲:',artistSongs.length,'首');
    console.log('🎵 专辑歌曲 (ID '+CONFIG.ALBUM_ID+'):',albumSongs.length,'首');

    const seen=new Set();
    const merged=[];
    for(const s of artistSongs){
      if(!seen.has(s.id)){seen.add(s.id);merged.push(s);}
    }
    for(const s of albumSongs){
      if(!seen.has(s.id)){seen.add(s.id);merged.push(s);}
    }
    if(merged.length===0)throw new Error('没有获取到歌曲');
    songList=merged;
    console.log('🎵 ✔ 共 '+songList.length+' 首歌曲（去重合并后）');
    buildSongListUI();
    document.getElementById('mode-icon').innerHTML=iconMap[0];

    const savedState=loadPlaybackState();
    let startIndex=0;
    let startTime=0;
    if(savedState&&savedState.songId){
      const idx=songList.findIndex(s=>s.id===String(savedState.songId));
      if(idx>=0){
        startIndex=idx;
        startTime=Math.max(0,savedState.currentTime||0);
        if(typeof savedState.mode==='number'&&savedState.mode>=0&&savedState.mode<3){
          mode=savedState.mode;
          document.getElementById('mode-icon').innerHTML=iconMap[mode];
        }
        console.log('🎵 ✔ 恢复上次播放:',songList[idx].name,'@',startTime.toFixed(1)+'s');
      }
    }
    await loadAndPlay(startIndex,startTime);
  }catch(err){
    console.error('初始化播放器失败:',err);
    songInfoEl.textContent='⚠️ 加载失败：'+err.message.slice(0,60);
    songList=[{id:'0',name:'加载失败',artist:'请检查控制台',album:'',cover:'CD.jpg'}];
    buildSongListUI();
  }
}

  const bg=safeStore.get(CUSTOM_BG_KEY,'');

<script>
/* 果冻动画 */
(function(){
  const selector='#pc-app button,#pc-app a,#pc-app input,#pc-app label.file-label,#pc-app .song-item,#pc-app .sidebar-icon,#pc-app .thumb-dots span,#pc-app .switch-track,#pc-app .auto-switch-track,#mobile-app button,#mobile-app a,#mobile-app input';
  let active=null;
  document.querySelectorAll(selector).forEach(el=>el.classList.add('jelly-interactive'));
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest(selector);
    if(!el||e.button!==0)return;
    // 排除齿轮：齿轮有自己的独立动画，避免冲突
    if(el.id==='gear-island')return;
    // 排除颜色选择器：拖动取色时不要跟着抖
    if(el.type==='color')return;
    active={el,x:e.clientX,y:e.clientY};
    el.classList.remove('jelly-release');
    el.classList.add('jelly-grabbed');
    el.style.setProperty('--jelly-tilt','0deg');
    el.setPointerCapture?.(e.pointerId);
  });
  document.addEventListener('pointermove',e=>{
    if(!active)return;
    const dx=e.clientX-active.x;
    const dy=e.clientY-active.y;
    const x=Math.max(-18,Math.min(18,dx*.22));
    const y=Math.max(-14,Math.min(14,dy*.22));
    const tilt=Math.max(-12,Math.min(12,dx*.35));
    active.el.style.translate=x+'px '+y+'px';
    active.el.style.rotate=tilt+'deg';
    active.el.style.setProperty('--jelly-tilt',tilt+'deg');
  });
  function release(){
    if(!active)return;
    const el=active.el;
    el.classList.remove('jelly-grabbed');
    el.style.translate='0px 0px';
    el.style.rotate='0deg';
    el.classList.remove('jelly-release');
    void el.offsetWidth;
    el.classList.add('jelly-release');
    active=null;
  }
  document.addEventListener('pointerup',release);
  document.addEventListener('pointercancel',release);
  document.addEventListener('animationend',e=>{
    if(e.animationName==='jellySettle')e.target.classList.remove('jelly-release');
  });
})();
</script>
