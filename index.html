<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon 支持 -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="favicon-128.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>给你扇窗全看世界，但你摸不到乁⁠[⁠ᓀ⁠˵⁠▾⁠˵⁠ᓂ⁠]⁠ㄏ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        /* --- 1. 字体与全局设置 --- */
        @font-face {
            font-family: '悠哉字体 Light';
            src: url('Yozai-Light.woff2') format('woff2');
            font-display: swap;
        }

        :root {
            --accent: #66ccff;
            --progress-height: 2px;
            --glass-bg1: rgba(255, 255, 255, 0.095);
            --glass-bg2: rgba(255, 255, 255, 0.042);
            --glass-bg3: rgba(255, 255, 255, 0.063);
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
            --text-color: #fff;
            --bg-overlay: rgba(0, 0, 0, 0);
            --theme-transition-bg: rgba(0, 0, 0, 0.75);
        }

        [data-theme="dark"] {
            --glass-bg1: rgba(0, 0, 0, 0.45);
            --glass-bg2: rgba(0, 0, 0, 0.25);
            --glass-bg3: rgba(0, 0, 0, 0.35);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            --text-color: #e0e0e0;
            --bg-overlay: rgba(0, 0, 0, 0.65);
            --theme-transition-bg: rgba(0, 0, 0, 0.85);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: url('722264.jpg') center/cover no-repeat;
            font-family: '悠哉字体 Light', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            user-select: none;
            transition: filter 1.2s ease;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transition: opacity 1.2s ease;
            opacity: 0;
            background: var(--bg-overlay);
            backdrop-filter: brightness(0.55) saturate(0.7);
            -webkit-backdrop-filter: brightness(0.55) saturate(0.7);
        }
        [data-theme="dark"] body::before {
            opacity: 1;
        }

        /* --- 顶部 --- */
        #header-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background: #fdeeef;
            opacity: 0.45;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.8s ease;
        }
        [data-theme="dark"] #header-overlay {
            opacity: 0.15;
            background: #1a1a2e;
        }
        #title-text {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            pointer-events: none;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* --- 右上角信息 --- */
        #top-right-info {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            padding: 12px 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--glass-bg1) 0%, var(--glass-bg2) 50%, var(--glass-bg3) 100%);
            backdrop-filter: blur(30px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(30px) saturate(180%) brightness(1.05);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            color: var(--text-color);
            font-weight: 400;
            min-width: 110px;
            transition: background 0.6s ease, border 0.6s ease, box-shadow 0.6s ease, color 0.6s ease;
            pointer-events: none;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }
        #top-right-info .time {
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.20);
        }
        #top-right-info .weather {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        #top-right-info .weather-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #top-right-info .weather-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }
        #top-right-info .weather-temp {
            font-size: 1.1rem;
            font-weight: 500;
        }
        #top-right-info .weather-desc {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-left: 2px;
        }

        /* ----- 歌词岛 (新增) ----- */
        #lyrics-island {
            position: fixed;
            top: 16px;
            right: 146px;
            z-index: 1150;
            padding: 10px 16px;
            min-width: 180px;
            max-width: 280px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--glass-bg1) 0%, var(--glass-bg2) 50%, var(--glass-bg3) 100%);
            backdrop-filter: blur(30px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(30px) saturate(180%) brightness(1.05);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            color: var(--text-color);
            transition: background 0.6s ease, border 0.6s ease, box-shadow 0.6s ease, color 0.6s ease;
            pointer-events: none;
            will-change: transform, opacity;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
            text-align: center;
            opacity: 0.9;
        }
        #lyrics-island .lyrics-line {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            transition: font-size 0.2s ease, opacity 0.2s ease;
        }
        #lyrics-island .lyrics-line.current {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--accent);
            text-shadow: 0 0 12px rgba(102, 204, 255, 0.3);
        }
        #lyrics-island .lyrics-line.prev,
        #lyrics-island .lyrics-line.next {
            font-size: 0.9rem;
            opacity: 0.6;
        }
        #lyrics-island .lyrics-line.placeholder {
            font-size: 0.9rem;
            opacity: 0.5;
            font-style: italic;
        }

        /* --- 液态玻璃核心 --- */
        .liquid-glass {
            background: linear-gradient(135deg, var(--glass-bg1) 0%, var(--glass-bg2) 50%, var(--glass-bg3) 100%);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.05);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.05);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: background 0.6s ease, border 0.6s ease, box-shadow 0.6s ease, color 0.6s ease;
        }

        /* ===== 播放器 — 可拖拽 ===== */
        #player {
            position: fixed;
            top: 130px;
            left: 20px;
            width: 350px;
            border-radius: 24px;
            padding: 14px 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            user-select: none;
            will-change: left, top;
            backface-visibility: hidden;
            color: var(--text-color);
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.3s ease, background 0.6s ease, border 0.6s ease;
        }
        #player.dragging {
            cursor: grabbing;
            z-index: 1002 !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.40);
        }
        #art-box {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #222;
        }
        #art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* ----- 封面覆盖层 (播放/暂停) ----- */
        #play-pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.30);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s ease, background 0.3s ease;
            border-radius: 12px;
        }
        #play-pause-overlay:hover {
            opacity: 0.95;
            background: rgba(0, 0, 0, 0.45);
        }
        #play-pause-overlay .cover-icon {
            width: 28px;
            height: 28px;
            fill: #fff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
            transform: scale(0.9);
            opacity: 0.8;
        }
        #play-pause-overlay:hover .cover-icon {
            transform: scale(1.1);
            opacity: 1;
        }
        #play-pause-overlay .cover-icon.playing {
            transform: scale(1);
        }
        #play-pause-overlay .cover-icon.paused {
            transform: scale(0.9);
        }
        #play-pause-overlay:active .cover-icon {
            transform: scale(0.7);
            transition-duration: 0.08s;
        }

        .control-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            justify-content: center;
        }

        /* --- 歌曲信息 --- */
        .song-info {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-color);
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            transition: color 0.6s ease;
            padding: 0 2px;
            letter-spacing: 0.3px;
        }
        [data-theme="dark"] .song-info {
            color: #e0e0e0;
            opacity: 0.8;
        }

        /* --- 进度条 --- */
        #progress-container {
            position: relative;
            width: 100%;
            height: var(--progress-height);
            border-radius: calc(var(--progress-height) / 2);
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            touch-action: none;
        }
        #progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            border-radius: calc(var(--progress-height) / 2);
            background: var(--accent);
            background: linear-gradient(90deg, var(--accent), #88ddff, var(--accent));
            background-size: 200% 100%;
            background-position: 0% 0%;
            transition: none;
            will-change: width, background-position;
            box-shadow: 0 0 6px rgba(102, 204, 255, 0.4);
        }
        #progress-fill.playing {
            animation: flowGradient 1.8s linear infinite, pulseGlow 1.2s ease-in-out infinite;
        }
        @keyframes flowGradient {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(102, 204, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 16px rgba(102, 204, 255, 0.8), 0 0 30px rgba(102, 204, 255, 0.3);
            }
        }

        #progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        /* --- 时间显示 --- */
        #time-display {
            font-size: 10px;
            color: var(--text-color);
            text-align: right;
            font-variant-numeric: tabular-nums;
            transition: color 0.6s ease;
            opacity: 0.7;
            padding: 0 2px;
            line-height: 1.3;
            letter-spacing: 0.2px;
        }

        /* --- 控制按钮 --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2px;
        }

        /* --- 歌曲列表 --- */
        #song-list {
            position: fixed;
            width: 380px;
            max-height: 260px;
            border-radius: 20px;
            overflow-y: auto;
            z-index: 999;
            color: var(--text-color);
            padding: 8px 0;
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.92) translateY(-8px);
            transform-origin: top center;
            will-change: transform, opacity;
            transition: background 0.6s ease, border 0.6s ease, box-shadow 0.6s ease, color 0.6s ease;
        }
        #song-list.active {
            visibility: visible;
            pointer-events: auto;
            animation: listPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        #song-list.hiding {
            animation: listPopOut 0.25s ease-in forwards;
        }
        @keyframes listPopIn {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(-12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes listPopOut {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.9) translateY(-8px);
            }
        }
        .song-item {
            padding: 10px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, border-left 0.2s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .song-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .song-item .song-index {
            font-size: 11px;
            opacity: 0.4;
            min-width: 24px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .song-item .song-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item .song-artist {
            font-size: 12px;
            opacity: 0.6;
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item.active-song {
            background: rgba(102, 204, 255, 0.18);
            border-left-color: var(--accent);
        }
        .song-item.active-song .song-name {
            color: var(--accent);
        }

        /* 滚动条样式 */
        #song-list::-webkit-scrollbar {
            width: 4px;
        }
        #song-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #song-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        #song-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* ===== 导航链接框 — 固定底部居中 ===== */
        .nav-links {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 32px;
            padding: 14px 36px;
            border-radius: 50px;
            z-index: 50;
            flex-wrap: wrap;
            justify-content: center;
            box-sizing: border-box;
            cursor: default;
            touch-action: auto;
            transition: box-shadow 0.3s ease, background 0.6s ease, border 0.6s ease;
        }
        .nav-links a {
            color: #66ccff;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s, color 0.6s ease;
            white-space: nowrap;
            pointer-events: auto;
        }
        .nav-links a:hover {
            opacity: 0.8;
        }
        [data-theme="dark"] .nav-links a {
            color: #88ddff;
        }

        /* --- 齿轮按钮 --- */
        #gear-island {
            position: fixed;
            right: 32px;
            bottom: 120px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1100;
            transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.6s ease, border 0.6s ease;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.116) 0%,
                    rgba(255, 255, 255, 0.042) 50%,
                    rgba(255, 255, 255, 0.074) 100%);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.05);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.05);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        [data-theme="dark"] #gear-island {
            background: linear-gradient(135deg,
                    rgba(0, 0, 0, 0.4) 0%,
                    rgba(0, 0, 0, 0.2) 50%,
                    rgba(0, 0, 0, 0.3) 100%);
            border-color: rgba(255, 255, 255, 0.15);
        }
        #gear-island:hover {
            transform: scale(1.08) rotate(12deg);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }
        #gear-island:active {
            transform: scale(0.92);
        }
        #gear-island svg {
            width: 32px;
            height: 32px;
            color: rgba(255, 255, 255, 0.92);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.20));
            transition: transform 0.6s ease;
        }
        #gear-island:hover svg {
            transform: rotate(60deg);
        }

        /* ================================================================
           🪟 弹窗 — Windows 11 风格 (悬浮 + 可拖拽 + 无遮罩)
           ================================================================ */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        #modal-overlay.visible {
            pointer-events: auto;
            opacity: 1;
            visibility: visible;
        }

        #modal {
            position: relative;
            width: 420px;
            max-width: 90vw;
            min-height: 300px;
            max-height: 80vh;
            border-radius: 28px;
            padding: 20px 24px 20px 24px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg,
                    rgba(255, 255, 255, 0.105) 0%,
                    rgba(255, 255, 255, 0.037) 50%,
                    rgba(255, 255, 255, 0.068) 100%);
            backdrop-filter: blur(50px) saturate(220%) brightness(1.06);
            -webkit-backdrop-filter: blur(50px) saturate(220%) brightness(1.06);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.60),
                inset 0 -1px 1px rgba(255, 255, 255, 0.15);
            transform: scale(0.92) translateY(12px);
            opacity: 0;
            transition: transform 0.38s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 0.32s cubic-bezier(0.1, 0.9, 0.2, 1);
            will-change: transform, opacity;
            user-select: none;
            cursor: default;
            pointer-events: auto;
        }
        #modal-overlay.visible #modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        #modal.closing {
            transform: scale(0.92) translateY(12px) !important;
            opacity: 0 !important;
            transition: transform 0.32s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        [data-theme="dark"] #modal {
            background: linear-gradient(145deg,
                    rgba(0, 0, 0, 0.4) 0%,
                    rgba(0, 0, 0, 0.2) 50%,
                    rgba(0, 0, 0, 0.3) 100%);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            padding: 4px 0 12px 0;
            min-height: 44px;
            user-select: none;
            cursor: grab;
        }
        .modal-header:active {
            cursor: grabbing;
        }

        #window-controls {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: filter 0.2s, transform 0.15s;
            cursor: default;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.10);
            flex-shrink: 0;
        }
        .dot.red {
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #d32f2f);
            cursor: pointer;
        }
        .dot.red:hover {
            filter: brightness(1.15);
            transform: scale(1.12);
        }
        .dot.red:active {
            transform: scale(0.88);
        }
        .dot.yellow {
            background: radial-gradient(circle at 35% 35%, #ffd93d, #f9a825);
        }
        .dot.green {
            background: radial-gradient(circle at 35% 35%, #6bcf7f, #2e7d32);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-color);
            letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            transition: color 0.6s ease;
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
        }

    <script>
        // ===================================================================
        //  1. 右上角时间 (根据IP获取时区)
        // ===================================================================
        const clockEl = document.getElementById('clock');
        const weatherIconEl = document.getElementById('weather-icon');
        const weatherTempEl = document.getElementById('weather-temp');
        const weatherDescEl = document.getElementById('weather-desc');

        let userTimeZone = 'Asia/Shanghai';

        function updateClock() {
            const now = new Date();
            try {
                const formatter = new Intl.DateTimeFormat('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false,
                    timeZone: userTimeZone
                });
                clockEl.textContent = formatter.format(now);
            } catch (e) {
                const offset = 8 * 60;
                const local = new Date(now.getTime() + (offset - now.getTimezoneOffset()) * 60000);
                const h = String(local.getHours()).padStart(2, '0');
                const m = String(local.getMinutes()).padStart(2, '0');
                const s = String(local.getSeconds()).padStart(2, '0');
                clockEl.textContent = `${h}:${m}:${s}`;
            }
        }

        function fetchUserTimeZone() {
            fetch('https://ipapi.co/json/')
                .then(res => {
                    if (!res.ok) throw new Error('IP API error');
                    return res.json();
                })
                .then(data => {
                    if (data.timezone) {
                        userTimeZone = data.timezone;
                        updateClock();
                    }
                })
                .catch(err => console.warn('IP timezone fetch failed, using Asia/Shanghai', err));
        }

        updateClock();
        setInterval(updateClock, 1000);
        fetchUserTimeZone();

        // ===================================================================
        //  2. 天气
        // ===================================================================
        const WEATHER_CACHE_KEY = 'weather_cache';
        const CACHE_DURATION = 10 * 60 * 1000;

        function getWeatherIconSVG(code) {
            let iconName = 'sunny';

        // ----- 解析文件名 -----
        function parseFromFileName(fileName) {
            let name = fileName.replace(/\.mp3$/i, '');
            let artist = '';
            if (name.includes(' - ')) {
                const parts = name.split(' - ');
                artist = parts.pop().trim();
                name = parts.join(' - ').trim();
            }
            if (!name) name = fileName;
            if (!artist) artist = 'unknown';
            return { title: name, artist: artist };
        }

        // ----- Spotify 搜索 (用于解析歌曲信息) -----
        function searchTrackInfo(query) {
            const url = `${SPOTIFY_PROXY}/search/track/${encodeURIComponent(query)}`;
            return fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('Spotify proxy error');
                    return res.json();
                })
                .then(data => {
                    if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                        const track = data.tracks.items[0];
                        return { title: track.name, artist: track.artists.map(a => a.name).join(', ') };
                    }
                    return null;
                })
                .catch(() => null);
        }

        // ----- 封面获取 (元数据→文件名→Spotify→Last.fm) -----
        function getCoverForSong(fileName) {
            return new Promise((resolve) => {
                if (coverCache[fileName] !== undefined) {
                    resolve(coverCache[fileName]);
                    return;
                }
                if (typeof jsmediatags !== 'undefined') {
                    const fileUrl = fileName;
                    jsmediatags.read(fileUrl, {
                        onSuccess: function(tag) {
                            let artist = tag.tags.artist;
                            let title = tag.tags.title;
                            if (artist && title) {
                                artist = artist.trim();
                                title = title.trim();
                                searchCoverWithSpotify(title, artist)
                                    .then(url => {
                                        if (url) { coverCache[fileName] = url;
                                            resolve(url); } else { return searchCoverWithLastFm(title, artist); }
                                    })
                                    .then(url => {
                                        if (url) { coverCache[fileName] = url;
                                            resolve(url); } else { coverCache[fileName] = null;
                                            resolve(null); }
                                    })
                                    .catch(() => { coverCache[fileName] = null;
                                        resolve(null); });
                            } else {
                                const parsed = parseFromFileName(fileName);
                                searchCoverWithSpotify(parsed.title, parsed.artist)
                                    .then(url => {
                                        if (url) { coverCache[fileName] = url;
                                            resolve(url); } else { return searchCoverWithLastFm(parsed.title, parsed.artist); }
                                    })
                                    .then(url => {
                                        if (url) { coverCache[fileName] = url;
                                            resolve(url); } else { coverCache[fileName] = null;
                                            resolve(null); }
                                    })
                                    .catch(() => { coverCache[fileName] = null;
                                        resolve(null); });
                            }
                        },
                        onError: function(error) {
                            console.warn('读取元数据失败，回退到文件名', error);
                            const parsed = parseFromFileName(fileName);
                            searchCoverWithSpotify(parsed.title, parsed.artist)
                                .then(url => {
                                    if (url) { coverCache[fileName] = url;
                                        resolve(url); } else { return searchCoverWithLastFm(parsed.title, parsed.artist); }
                                })
                                .then(url => {
                                    if (url) { coverCache[fileName] = url;
                                        resolve(url); } else { coverCache[fileName] = null;
                                        resolve(null); }
                                })
                                .catch(() => { coverCache[fileName] = null;
                                    resolve(null); });
                        }
                    });
                } else {
                    console.warn('jsmediatags 未加载，使用文件名解析');
                    const parsed = parseFromFileName(fileName);
                    searchCoverWithSpotify(parsed.title, parsed.artist)
                        .then(url => {
                            if (url) { coverCache[fileName] = url;
                                resolve(url); } else { return searchCoverWithLastFm(parsed.title, parsed.artist); }
                        })
                        .then(url => {

                                resolve(null); }
                        })
                        .catch(() => { coverCache[fileName] = null;
                            resolve(null); });
                }
            });
        }

        function searchCoverWithSpotify(title, artist) {
            const query = encodeURIComponent(`${title} ${artist}`);
            const url = `${SPOTIFY_PROXY}/search/track/${query}`;
            return fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('Spotify proxy error');
                    return res.json();
                })
                .then(data => {
                    if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                        const track = data.tracks.items[0];
                        if (track.album && track.album.images && track.album.images.length > 0) {
                            const sorted = track.album.images.sort((a, b) => b.width - a.width);
                            return sorted[0].url;
                        }
                    }
                    return null;
                })
                .catch(() => null);
        }

        function searchCoverWithLastFm(title, artist) {
            const url =
                `https://ws.audioscrobbler.com/2.0/?method=track.getInfo&api_key=${LASTFM_API_KEY}&artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(title)}&format=json`;
            return fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('Last.fm API error');
                    return res.json();
                })
                .then(data => {
                    if (data.track && data.track.album && data.track.album.image) {
                        const images = data.track.album.image;
                        let imgUrl = null;
                        for (let img of images) {
                            if (img.size === 'extralarge' && img['#text']) {
                                imgUrl = img['#text'];
                                break;
                            }
                        }
                        if (!imgUrl) {
                            const sorted = [...images].sort((a, b) => {
                                const sizes = ['small', 'medium', 'large', 'extralarge', 'mega'];
                                return sizes.indexOf(b.size) - sizes.indexOf(a.size);
                            });
                            if (sorted.length > 0 && sorted[0]['#text']) {
                                imgUrl = sorted[0]['#text'];
                            }
                        }
                        return imgUrl || null;
                    }
                    return null;
                })
                .catch(() => null);
        }

        // ----- QQ音乐歌词获取 (使用代理) -----
        function fetchQQMusicLyrics(title, artist) {
            return new Promise((resolve, reject) => {
                // 使用第三方代理：https://api.qqlyrics.cn/
                const searchUrl =
                    `https://api.qqlyrics.cn/search?keyword=${encodeURIComponent(title + ' ' + artist)}`;
                fetch(searchUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0 && data.data && data.data.length > 0) {
                            const song = data.data[0];
                            const mid = song.mid;
                            // 获取歌词
                            const lyricUrl = `https://api.qqlyrics.cn/lyric?mid=${mid}`;
                            return fetch(lyricUrl);
                        } else {
                            throw new Error('未找到歌曲');
                        }
                    })
                    .then(res => res.json())
                    .then(lyricData => {
                        if (lyricData.code === 0 && lyricData.data && lyricData.data.lyric) {
                            const lrcText = lyricData.data.lyric;
                            // 解析 LRC 格式
                            const lines = lrcText.split('\n');
                            const parsed = [];
                            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
                            for (let line of lines) {
                                const trimmed = line.trim();
                                if (!trimmed) continue;
                                const match = trimmed.match(timeRegex);
                                if (match) {
                                    const minutes = parseInt(match[1]);
                                    const seconds = parseInt(match[2]);
                                    const ms = parseInt(match[3].padEnd(3, '0'));
                                    const totalSeconds = minutes * 60 + seconds + ms / 1000;
                                    const text = trimmed.replace(timeRegex, '').trim();
                                    if (text) {
                                        parsed.push({ time: totalSeconds, text: text });
                                    }
                                }
                            }
                            if (parsed.length > 0) {
                                // 按时间排序
                                parsed.sort((a, b) => a.time - b.time);
                                resolve(parsed);
                            } else {
                                reject(new Error('无有效歌词行'));
                            }
                        } else {
                            reject(new Error('歌词数据为空'));
                        }
                    })
                    .catch(err => {
                        reject(err);
                    });
            });
        }

        // ----- 歌词更新 (根据当前播放时间) -----
        function updateLyrics() {
            if (!lyricLines || lyricLines.length === 0) {
                lyricsLine1.textContent = '♪ 无歌词';
                lyricsLine2.textContent = '♪ 等待中...';
                lyricsLine3.textContent = '♪ 请播放歌曲';
                lyricsLine1.className = 'lyrics-line placeholder';
                lyricsLine2.className = 'lyrics-line current placeholder';
                lyricsLine3.className = 'lyrics-line placeholder';
                return;
            }

            const currentTime = audio.currentTime || 0;
            // 查找当前行 (最后一行 time <= currentTime)
            let idx = 0;
            for (let i = 0; i < lyricLines.length; i++) {
                if (lyricLines[i].time <= currentTime) {
                    idx = i;
                } else {
                    break;
                }
            }
            // 如果 idx 超出范围，取最后一行
            if (idx >= lyricLines.length) idx = lyricLines.length - 1;
            lyricCurrentIndex = idx;

            const total = lyricLines.length;
            const prevIdx = idx - 1 >= 0 ? idx - 1 : 0;
            const nextIdx = idx + 1 < total ? idx + 1 : total - 1;

            lyricsLine1.textContent = lyricLines[prevIdx].text || '♪';
            lyricsLine2.textContent = lyricLines[idx].text || '♪';
            lyricsLine3.textContent = lyricLines[nextIdx].text || '♪';

            lyricsLine1.className = 'lyrics-line prev';
            lyricsLine2.className = 'lyrics-line current';
            lyricsLine3.className = 'lyrics-line next';

            if (prevIdx === idx) lyricsLine1.textContent = '';
            if (nextIdx === idx) lyricsLine3.textContent = '';
        }

                return { original: fileName, title: info.title, artist: info.artist, display: `${info.title} - ${info.artist}` };

        function triggerAnimation(element, className, duration) {
            if (!element) return;
            element.classList.remove(className);

            element.classList.add(className);
            setTimeout(() => { element.classList.remove(className); }, duration);

        function updateProgress() {
            if (isDraggingProgress) return;
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                progressFill.style.width = percent + '%';
            } else {
                progressFill.style.width = '0%';
            }
        }

        window.togglePlay = () => {
            if (audio.paused) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => { setPlayingState(true); }).catch(err => { console.warn('播放被阻止:', err);
                        setPlayingState(false); });
                }
            } else {
                audio.pause();
                setPlayingState(false);
            }
            triggerAnimation(mainPlayBtn, 'btn-anim', 450);
            triggerAnimation(playOverlay, 'btn-anim', 450);
        };

        window.prev = () => {
            currentIdx = (currentIdx - 1 + songs.length) % songs.length;
            loadAndPlay();
        };
        window.next = () => {
            currentIdx = (mode === 2) ? Math.floor(Math.random() * songs.length) : (currentIdx + 1) % songs.length;
            loadAndPlay();
        };

        const iconMap = [
            `<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4" /><path d="M3 11v-2a4 4 0 0 1 4-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></svg>`,
            `<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4" /><path d="M3 11v-2a4 4 0 0 1 4-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /><path d="M12 10v4" /><path d="M12 14h1.5" /></svg>`,
            `<svg viewBox="0 0 24 24"><path d="M21 7h-4a3 3 0 0 0-3 3v4a3 3 0 0 1-3 3H3" /><path d="M21 17h-4a3 3 0 0 1-3-3v-4a3 3 0 0 0-3-3H3" /><path d="M3 7h4" /><path d="M3 17h4" /></svg>`
        ];

        window.changeMode = () => {
            mode = (mode + 1) % 3;
            document.getElementById('mode-icon').innerHTML = iconMap[mode];
            triggerAnimation(modeBtn, 'mode-anim', 550);
        };

        audio.onended = () => {
            if (mode === 1) {
                audio.play().catch(e => console.warn('循环播放失败', e));
            } else {
                window.next();
            }
        };
        audio.ontimeupdate = () => {
            updateProgress();
            const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
            const duration = audio.duration || 0;
            const remaining = duration - audio.currentTime;
            timeDisplay.innerText = `${fmt(audio.currentTime)} / ${fmt(duration)} / ${fmt(remaining)}`;
        };
        audio.onerror = () => {
            console.error('音频加载错误:', audio.error);
            setTimeout(() => { if (audio.src) { audio.load(); } }, 1000);
        };

        progressBar.addEventListener('mousedown', () => { isDraggingProgress = true;
            progressFill.classList.remove('playing'); });
        progressBar.addEventListener('touchstart', () => { isDraggingProgress = true;
            progressFill.classList.remove('playing'); }, { passive: true });
        const endProgressDrag = () => {
            isDraggingProgress = false;
            if (!audio.paused) { progressFill.classList.add('playing'); }
        };
        document.addEventListener('mouseup', endProgressDrag);
        document.addEventListener('touchend', endProgressDrag);
        progressBar.oninput = () => {
            const val = parseFloat(progressBar.value);
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
                progressFill.style.width = val + '%';
            }
        };
        document.getElementById('progress-container').addEventListener('click', function(e) {
            if (e.target === progressBar) return;
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const val = Math.min(1, Math.max(0, x)) * 100;
            progressBar.value = val;
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
                progressFill.style.width = val + '%';
            }
        });
        audio.onplay = () => setPlayingState(true);
        audio.onpause = () => setPlayingState(false);

        // 播放列表动画
        function closeListImmediate() {
            songListEl.classList.remove('active', 'hiding');
            songListEl.style.visibility = 'hidden';
            songListEl.style.pointerEvents = 'none';
            songListEl.style.animation = 'none';
            void songListEl.offsetWidth;
            songListEl.style.animation = '';
        }

        function closeListWithAnimation() {
            if (songListEl.classList.contains('active')) {
                songListEl.classList.remove('active');
                songListEl.classList.add('hiding');
                const onEnd = function() {
                    songListEl.classList.remove('hiding');
                    songListEl.style.visibility = 'hidden';
                    songListEl.style.pointerEvents = 'none';
                    songListEl.style.animation = '';
                    songListEl.removeEventListener('animationend', onEnd);
                };
                songListEl.addEventListener('animationend', onEnd, { once: true });
            }
        }

        window.toggleList = (e) => {
            e.stopPropagation();
            if (songListEl.classList.contains('active')) {
                closeListWithAnimation();
                return;
            }
            songListEl.classList.remove('hiding');
            const rect = player.getBoundingClientRect();
            const isAbove = rect.top > window.innerHeight / 2;
            songListEl.style.left = rect.left + 'px';
            songListEl.style.top = isAbove ? (rect.top - Math.min(songListEl.scrollHeight + 30, 280) + 'px') : (rect.top + 90 +
            'px');
            songListEl.style.visibility = 'visible';
            songListEl.style.pointerEvents = 'auto';
            void songListEl.offsetWidth;
            songListEl.classList.add('active');
        };
        document.addEventListener('click', (e) => {
            if (!player.contains(e.target) && !songListEl.contains(e.target)) {
                if (songListEl.classList.contains('active')) {
                    closeListWithAnimation();
                }
            }
        });

        // 播放器拖拽
        let isDraggingPlayer = false;
        let playerOffsetX = 0,
            playerOffsetY = 0;
        player.addEventListener('mousedown', (e) => {
            if (e.target.closest('button, input, #play-pause-overlay, #main-play-btn, #progress-container')) return;
            isDraggingPlayer = true;
            const rect = player.getBoundingClientRect();
            playerOffsetX = e.clientX - rect.left;
            playerOffsetY = e.clientY - rect.top;
            player.classList.add('dragging');
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingPlayer) return;
            let newLeft = e.clientX - playerOffsetX;
            let newTop = e.clientY - playerOffsetY;
            const w = player.offsetWidth;
            const h = player.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            player.style.left = newLeft + 'px';
            player.style.top = newTop + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (isDraggingPlayer) {
                player.classList.remove('dragging');
                isDraggingPlayer = false;
            }
        });
        player.addEventListener('touchstart', (e) => {
            if (e.target.closest('button, input, #play-pause-overlay, #main-play-btn, #progress-container')) return;
            const touch = e.touches[0];
            isDraggingPlayer = true;
            const rect = player.getBoundingClientRect();
            playerOffsetX = touch.clientX - rect.left;
            playerOffsetY = touch.clientY - rect.top;
            player.classList.add('dragging');
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingPlayer) return;
            const touch = e.touches[0];
            let newLeft = touch.clientX - playerOffsetX;
            let newTop = touch.clientY - playerOffsetY;
            const w = player.offsetWidth;
            const h = player.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            player.style.left = newLeft + 'px';
            player.style.top = newTop + 'px';
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', () => {
            if (isDraggingPlayer) {
                player.classList.remove('dragging');
                isDraggingPlayer = false;
            }
        });

        // ===================================================================
        //  4. 弹窗控制 (Windows 11 风格，无遮罩)
        // ===================================================================
        const overlayEl = document.getElementById('modal-overlay');
        const modalEl = document.getElementById('modal');
        const headerEl = document.getElementById('modal-header');
        let isModalOpen = false;
        let isClosing = false;

        window.openModal = function() {
            if (isModalOpen || isClosing) return;
            isModalOpen = true;
            modalEl.classList.remove('closing');
            overlayEl.classList.add('visible');
            document.body.style.overflow = 'hidden';
            syncSwitchUI();
            updateAutoSwitchUI(autoThemeEnabled);
        };

        window.closeModal = function() {
            if (!isModalOpen || isClosing) return;
            isClosing = true;
            modalEl.classList.add('closing');
            const onTransitionEnd = () => {
                modalEl.removeEventListener('transitionend', onTransitionEnd);
                overlayEl.classList.remove('visible');
                modalEl.classList.remove('closing');
                isModalOpen = false;
                isClosing = false;
                document.body.style.overflow = '';
            };
            modalEl.addEventListener('transitionend', onTransitionEnd);
            setTimeout(() => {
                if (isClosing) {
                    modalEl.removeEventListener('transitionend', onTransitionEnd);
                    overlayEl.classList.remove('visible');
                    modalEl.classList.remove('closing');
                    isModalOpen = false;
                    isClosing = false;
                    document.body.style.overflow = '';
                }
            }, 500);
        };

        window.closeModalViaOverlay = function(e) {
            if (e.target === overlayEl) {
                closeModal();
            }
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isModalOpen) {
                closeModal();
            }
        });

        // ===================================================================
        //  5. 弹窗拖拽 (在标题栏上)
        // ===================================================================
        let isDraggingModal = false;
        let modalOffsetX = 0,
            modalOffsetY = 0;

        headerEl.addEventListener('mousedown', (e) => {
            if (e.target.closest('.dot, #window-controls')) return;
            if (!isModalOpen) return;
            isDraggingModal = true;
            const rect = modalEl.getBoundingClientRect();
            modalOffsetX = e.clientX - rect.left;
            modalOffsetY = e.clientY - rect.top;
            modalEl.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDraggingModal) return;
            let newLeft = e.clientX - modalOffsetX;
            let newTop = e.clientY - modalOffsetY;
            const w = modalEl.offsetWidth;
            const h = modalEl.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            modalEl.style.position = 'fixed';
            modalEl.style.left = newLeft + 'px';
            modalEl.style.top = newTop + 'px';
            modalEl.style.transform = 'none';
            modalEl.style.margin = '0';
        });

        document.addEventListener('mouseup', () => {
            if (isDraggingModal) {
                modalEl.style.cursor = '';
                isDraggingModal = false;
            }
        });

        headerEl.addEventListener('touchstart', (e) => {
            if (e.target.closest('.dot, #window-controls')) return;
            if (!isModalOpen) return;
            const touch = e.touches[0];
            const rect = modalEl.getBoundingClientRect();
            modalOffsetX = touch.clientX - rect.left;
            modalOffsetY = touch.clientY - rect.top;
            isDraggingModal = true;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!isDraggingModal) return;
            const touch = e.touches[0];
            let newLeft = touch.clientX - modalOffsetX;
            let newTop = touch.clientY - modalOffsetY;
            const w = modalEl.offsetWidth;
            const h = modalEl.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            modalEl.style.position = 'fixed';
            modalEl.style.left = newLeft + 'px';
            modalEl.style.top = newTop + 'px';
            modalEl.style.transform = 'none';
            modalEl.style.margin = '0';
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDraggingModal = false;
        });

        // ===================================================================
        //  6. 主题切换 (波浪扩散动画) + 自动跟随
        // ===================================================================
        let currentTheme = 'light';
        let isTransitioning = false;

        const transitionOverlay = document.getElementById('theme-transition-overlay');
        const switchTrack = document.getElementById('switch-track');
        const moonBtn = document.getElementById('moon-btn');
        const sunBtn = document.getElementById('sun-btn');
        const gearBtn = document.getElementById('gear-island');

        const autoSwitchTrack = document.getElementById('auto-switch-track');
        const autoCheckbox = document.getElementById('auto-theme-checkbox');
        let autoThemeEnabled = true;
        let systemThemeListener = null;

        const manualControls = [moonBtn, switchTrack, sunBtn];

        function setManualControlsDisabled(disabled) {
            manualControls.forEach(el => {
                if (disabled) {
                    el.classList.add('disabled');
                } else {
                    el.classList.remove('disabled');
                }
            });
        }

        function applySystemTheme() {
            if (autoThemeEnabled) {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark ? 'dark' : 'light');
            }
        }

        function setupAutoTheme() {
            if (autoThemeEnabled) {
                if (systemThemeListener) {
                    systemThemeListener.removeEventListener('change', applySystemTheme);
                    systemThemeListener = null;
                }
                systemThemeListener = window.matchMedia('(prefers-color-scheme: dark)');
                systemThemeListener.addEventListener('change', applySystemTheme);
                applySystemTheme();
                setManualControlsDisabled(true);
            } else {
                if (systemThemeListener) {
                    systemThemeListener.removeEventListener('change', applySystemTheme);
                    systemThemeListener = null;
                }
                setManualControlsDisabled(false);
            }
        }

        function setTheme(theme) {
            if (theme === currentTheme || isTransitioning) return;
            const toDark = theme === 'dark';
            const waveColor = toDark ? 'rgba(128,128,128,0.15)' : 'rgba(255,255,255,0.15)';
            const gearRect = gearBtn.getBoundingClientRect();
            const cx = gearRect.left + gearRect.width / 2;
            const cy = gearRect.top + gearRect.height / 2;
            isTransitioning = true;
            const overlay = transitionOverlay;
            overlay.style.background = waveColor;
            overlay.style.clipPath = `circle(0% at ${cx}px ${cy}px)`;
            overlay.classList.add('animating');
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '1';
            void overlay.offsetWidth;
            overlay.style.transition = 'clip-path 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            overlay.style.clipPath = `circle(150% at ${cx}px ${cy}px)`;
            const onTransitionEnd = () => {
                overlay.removeEventListener('transitionend', onTransitionEnd);
                applyTheme(theme);
                overlay.style.transition = 'none';
                overlay.classList.remove('animating');
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
                overlay.style.clipPath = '';
                overlay.style.background = 'transparent';
                isTransitioning = false;
            };
            overlay.addEventListener('transitionend', onTransitionEnd);
            setTimeout(() => {
                if (isTransitioning) {
                    overlay.removeEventListener('transitionend', onTransitionEnd);
                    applyTheme(theme);
                    overlay.style.transition = 'none';
                    overlay.classList.remove('animating');
                    overlay.style.visibility = 'hidden';
                    overlay.style.opacity = '0';
                    overlay.style.clipPath = '';
                    overlay.style.background = 'transparent';
                    isTransitioning = false;
                }
            }, 1200);
        }

        function toggleTheme() {
            if (isTransitioning || autoThemeEnabled) return;
            const target = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(target);
        }

        function updateSwitchUI(theme) {
            if (theme === 'dark') {
                switchTrack.classList.add('active');
                moonBtn.classList.add('active');
                sunBtn.classList.remove('active');
            } else {
                switchTrack.classList.remove('active');
                moonBtn.classList.remove('active');
                sunBtn.classList.add('active');
            }
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            currentTheme = theme;
            updateSwitchUI(theme);
            const btns = document.querySelectorAll('.md3-icon-btn');
            btns.forEach(btn => {
                btn.style.color = theme === 'dark' ? '#f0f0f0' : '#fff';
            });
        }

        function updateAutoSwitchUI(enabled) {
            if (enabled) {
                autoSwitchTrack.classList.add('active');
                autoCheckbox.checked = true;
            } else {
                autoSwitchTrack.classList.remove('active');
                autoCheckbox.checked = false;
            }
            setManualControlsDisabled(enabled);
        }

        autoSwitchTrack.addEventListener('click', function(e) {
            e.stopPropagation();
            const newState = !autoCheckbox.checked;
            autoCheckbox.checked = newState;
            autoThemeEnabled = newState;
            updateAutoSwitchUI(newState);
            setupAutoTheme();
        });

        function initAutoSwitch() {
            autoThemeEnabled = true;
            autoCheckbox.checked = true;
            updateAutoSwitchUI(true);
            setupAutoTheme();
        }

        function syncSwitchUI() {
            updateSwitchUI(currentTheme);
        }

        // ===================================================================
        //  7. 歌词岛位置自适应 (与时间/天气岛同一水平线)
        // ===================================================================
        function adjustLyricsIslandPosition() {
            const timeInfo = document.getElementById('top-right-info');
            if (!timeInfo) return;
            const rect = timeInfo.getBoundingClientRect();
            const island = document.getElementById('lyrics-island');
            if (!island) return;
            island.style.top = rect.top + 'px';
            const gap = 12;
            island.style.right = (window.innerWidth - rect.left + gap) + 'px';
        }

        window.addEventListener('load', () => {
            setTimeout(adjustLyricsIslandPosition, 100);
        });
        window.addEventListener('resize', adjustLyricsIslandPosition);

        // ===================================================================
        //  8. 初始化
        // ===================================================================
        window.addEventListener('load', async () => {
            try {
                await buildSongListFromProxy();
                await preloadAllCovers();
                console.log('所有封面预加载完成');
                const src = songs[0];
                audio.src = src;
                audio.load();
                document.getElementById('mode-icon').innerHTML = iconMap[0];
                setPlayingState(false);
                updateProgress();
                initAutoSwitch();
                const cachedUrl = coverCache[src];
                coverImg.src = cachedUrl || 'CD.jpg';
                const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
                timeDisplay.innerText = `00:00 / ${fmt(0)} / 00:00`;
                highlightCurrentSong();
                updateSongInfo();
                loadLyrics(src);
                startLyricsUpdater();
                setTimeout(adjustLyricsIslandPosition, 200);
            } catch (err) {
                console.warn('初始化过程中出错:', err);
                await buildSongListFromProxy();
                const src = songs[0];
                audio.src = src;
                audio.load();
                document.getElementById('mode-icon').innerHTML = iconMap[0];
                setPlayingState(false);
                updateProgress();
                initAutoSwitch();
                coverImg.src = 'CD.jpg';
                const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
                timeDisplay.innerText = `00:00 / ${fmt(0)} / 00:00`;
                highlightCurrentSong();
                updateSongInfo();
                loadLyrics(src);
                startLyricsUpdater();
                setTimeout(adjustLyricsIslandPosition, 200);
            }
        });

        // 重写 loadAndPlay 以调整位置
        const _loadAndPlay = loadAndPlay;
        loadAndPlay = function() {
            _loadAndPlay();
            setTimeout(adjustLyricsIslandPosition, 100);
        };
    </script>

</body>
</html>
