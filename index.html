<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>bxfans ~~~ 幻想的な星明かり ~~~~</title>

    <!-- Favicon 支持 (内联占位) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />

    <style>
        /* ================================================================
           全局样式 — 日系二次元 · 毛玻璃 · 响应式
           ================================================================ */
        @font-face {
            font-family: '悠哉字体 Light';
            src: url('Yozai-Light.woff2') format('woff2');
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #66ccff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 12px 48px rgba(0, 0, 0, 0.30);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --bg-overlay: rgba(0, 0, 0, 0.30);
            --player-bg: rgba(255, 255, 255, 0.07);
            --list-item-hover: rgba(255, 255, 255, 0.08);
            --modal-bg: rgba(255, 255, 255, 0.06);
            --transition-speed: 0.5s;
        }

        [data-theme="dark"] {
            --glass-bg: rgba(0, 0, 0, 0.35);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-shadow: 0 12px 48px rgba(0, 0, 0, 0.60);
            --text-primary: #e8e8e8;
            --text-secondary: rgba(255, 255, 255, 0.60);
            --bg-overlay: rgba(0, 0, 0, 0.60);
            --player-bg: rgba(0, 0, 0, 0.30);
            --list-item-hover: rgba(255, 255, 255, 0.05);
            --modal-bg: rgba(0, 0, 0, 0.30);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: '悠哉字体 Light', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Microsoft JhengHei', sans-serif;
            background: #0b0e1a;
            color: var(--text-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- 主容器 ---------- */
        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: url('722264.jpg') center/cover no-repeat;
            transition: background-image 1.2s ease, filter 1.2s ease;
            overflow: hidden;
        }
        #app::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            backdrop-filter: brightness(0.60) saturate(0.80);
            -webkit-backdrop-filter: brightness(0.60) saturate(0.80);
            pointer-events: none;
            z-index: 0;
            transition: background 0.8s ease;
        }
        #app[data-theme="dark"]::before {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: brightness(0.45) saturate(0.60);
            -webkit-backdrop-filter: brightness(0.45) saturate(0.60);
        }

        /* ---------- 毛玻璃工具类 ---------- */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: background var(--transition-speed) ease,
                border var(--transition-speed) ease,
                box-shadow var(--transition-speed) ease;
        }

        /* ---------- 顶部：标题 ---------- */
        #header-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background: #fdeeef;
            opacity: 0.35;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.8s ease, background 0.8s ease;
        }
        [data-theme="dark"] #header-overlay {
            opacity: 0.12;
            background: #1a1a2e;
        }

        #title-text {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
            line-height: 1.2;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.30);
            z-index: 1;
            transition: color 0.6s ease;
        }
        #title-text .line1 {
            font-size: clamp(1.2rem, 2.5vw, 2.0rem);
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }
        #title-text .line2 {
            font-size: clamp(2.0rem, 4.5vw, 3.6rem);
            letter-spacing: 0.08em;
            color: var(--text-primary);
            text-shadow: 0 0 40px rgba(102, 204, 255, 0.20);
        }

        /* ---------- 右上：时间+天气 ---------- */
        #top-right-info {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            padding: 10px 18px;
            border-radius: 20px;
            min-width: 100px;
            pointer-events: none;
            will-change: transform;
        }
        #top-right-info .time {
            font-size: clamp(1.0rem, 1.6vw, 1.3rem);
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
        }
        #top-right-info .weather {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(0.8rem, 1.2vw, 0.95rem);
            color: var(--text-secondary);
        }
        #top-right-info .weather-icon {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #top-right-info .weather-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* ---------- 歌词岛 ---------- */
        #lyrics-island {
            position: fixed;
            top: 16px;
            right: 146px;
            z-index: 1150;
            padding: 10px 18px;
            min-width: 160px;
            max-width: 300px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.7;
            text-align: center;
            pointer-events: none;
            will-change: transform;
            transition: background var(--transition-speed) ease,
                border var(--transition-speed) ease;
        }
        #lyrics-island .lyrics-line {
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: font-size 0.2s ease, opacity 0.2s ease, color 0.4s ease;
            color: var(--text-secondary);
        }
        #lyrics-island .lyrics-line.current {
            font-size: clamp(1.0rem, 1.6vw, 1.3rem);
            font-weight: 500;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }
        #lyrics-island .lyrics-line.prev,
        #lyrics-island .lyrics-line.next {
            font-size: clamp(0.7rem, 1.0vw, 0.9rem);
            opacity: 0.55;
        }
        #lyrics-island .lyrics-line.placeholder {
            font-size: clamp(0.7rem, 1.0vw, 0.9rem);
            opacity: 0.40;
            font-style: italic;
        }

        /* ---------- 播放器 ---------- */
        #player {
            position: fixed;
            top: 130px;
            left: 20px;
            width: 380px;
            border-radius: 24px;
            padding: 14px 18px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: grab;
            touch-action: none;
            will-change: left, top;
            transition: box-shadow 0.3s ease, background var(--transition-speed) ease,
                border var(--transition-speed) ease;
            background: var(--player-bg);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.04);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.04);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        #player.dragging {
            cursor: grabbing;
            z-index: 1002 !important;
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.50);
        }

        #art-box {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background: #222;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }
        #art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .control-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            justify-content: center;
        }
        .song-info {
            font-size: clamp(12px, 1.2vw, 14px);
            font-weight: 400;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            color: var(--text-primary);
            padding: 0 2px;
            letter-spacing: 0.3px;
            transition: color 0.4s ease;
        }

        /* 进度条 */
        #progress-container {
            position: relative;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            touch-action: none;
        }
        #progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            border-radius: 2px;
            background: var(--accent);
            background: linear-gradient(90deg, var(--accent), #88ddff, var(--accent));
            background-size: 200% 100%;
            transition: none;
            will-change: width;
            box-shadow: 0 0 10px rgba(102, 204, 255, 0.30);
        }
        #progress-fill.playing {
            animation: flowGradient 1.8s linear infinite, pulseGlow 1.2s ease-in-out infinite;
        }
        @keyframes flowGradient {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(102, 204, 255, 0.30);
            }
            50% {
                box-shadow: 0 0 18px rgba(102, 204, 255, 0.70), 0 0 40px rgba(102, 204, 255, 0.20);
            }
        }
        #progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        #time-display {
            font-size: 10px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            opacity: 0.60;
            padding: 0 2px;
            line-height: 1.3;
            letter-spacing: 0.2px;
            color: var(--text-secondary);
            transition: color 0.4s ease;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2px;
            gap: 2px;
        }
        .controls .md3-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
            transition: opacity 0.2s, transform 0.15s;
            color: var(--text-primary) !important;
            border-radius: 50%;
        }
        .controls .md3-icon-btn:hover {
            opacity: 0.75;
        }
        .controls .md3-icon-btn:active {
            transform: scale(0.90);
        }
        .controls .md3-icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #main-play-btn {
            width: 34px !important;
            height: 34px !important;
            border: none !important;
            border-radius: 50% !important;
            background: var(--accent) !important;
            color: #fff !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: transform 0.2s ease, background 0.3s ease;
            box-shadow: 0 4px 16px rgba(102, 204, 255, 0.30);
        }
        #main-play-btn:active {
            transform: scale(0.88);
        }
        #main-play-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            stroke: none;
        }
        .btn-anim {
            animation: playPulse 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .mode-anim {
            animation: modeFlip 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes playPulse {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.30) rotate(12deg);
            }
            70% {
                transform: scale(0.92) rotate(-8deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        @keyframes modeFlip {
            0% {
                transform: scale(1) rotate(0deg);
            }
            40% {
                transform: scale(1.25) rotate(180deg);
            }
            70% {
                transform: scale(0.88) rotate(320deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
            }
        }
        #mode-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        #mode-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- 歌曲列表 ---------- */
        #song-list {
            position: fixed;
            width: 400px;
            max-height: 280px;
            border-radius: 20px;
            overflow-y: auto;
            z-index: 999;
            padding: 6px 0;
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.92) translateY(-8px);
            transform-origin: top center;
            will-change: transform, opacity;
            transition: background var(--transition-speed) ease,
                border var(--transition-speed) ease;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.04);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.04);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        #song-list.active {
            visibility: visible;
            pointer-events: auto;
            animation: listPopIn 0.30s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        #song-list.hiding {
            animation: listPopOut 0.25s ease-in forwards;
        }
        @keyframes listPopIn {
            0% {
                opacity: 0;
                transform: scale(0.88) translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes listPopOut {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.92) translateY(-6px);
            }
        }
        #song-list::-webkit-scrollbar {
            width: 4px;
        }
        #song-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #song-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.20);
            border-radius: 4px;
        }
        .song-item {
            padding: 10px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s, border-left 0.15s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
        }
        .song-item:hover {
            background: var(--list-item-hover);
        }
        .song-item .song-index {
            font-size: 11px;
            opacity: 0.35;
            min-width: 26px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .song-item .song-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.4s ease;
            color: var(--text-secondary);
        }
        .song-item .song-artist {
            font-size: 12px;
            opacity: 0.50;
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
        }
        .song-item.active-song {
            background: rgba(102, 204, 255, 0.14);
            border-left-color: var(--accent);
        }
        .song-item.active-song .song-name {
            color: var(--text-primary);
        }

        /* ---------- 导航栏 ---------- */
        .nav-links {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: clamp(16px, 3vw, 36px);
            padding: 12px 28px;
            border-radius: 50px;
            z-index: 50;
            flex-wrap: wrap;
            justify-content: center;
            box-sizing: border-box;
            transition: background var(--transition-speed) ease,
                border var(--transition-speed) ease,
                box-shadow 0.3s ease;
            background: var(--glass-bg);
            backdrop-filter: blur(32px) saturate(180%) brightness(1.04);
            -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.04);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .nav-links a {
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s, color 0.4s ease;
            white-space: nowrap;
            color: var(--accent);
            font-size: clamp(0.8rem, 1.2vw, 1.0rem);
            letter-spacing: 0.04em;
        }
        .nav-links a:hover {
            opacity: 0.70;
        }

        /* ---------- 搜索框 (居中) ---------- */
        #search-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 49;
            width: min(680px, 88vw);
            max-width: 760px;
            border-radius: 28px;
            padding: 4px 6px 4px 22px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(36px) saturate(200%) brightness(1.06);
            -webkit-backdrop-filter: blur(36px) saturate(200%) brightness(1.06);
            border: 1.5px solid rgba(255, 255, 255, 0.20);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25);
            transition: all 0.30s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform, opacity;
            min-height: 50px;
        }
        #search-container:focus-within {
            border-color: rgba(102, 204, 255, 0.50);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25), 0 0 0 4px rgba(102, 204, 255, 0.10);
            background: rgba(255, 255, 255, 0.12);
            transform: translate(-50%, -50%) scale(1.02);
        }
        #search-container .search-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            color: rgba(255, 255, 255, 0.40);
            transition: color 0.3s ease;
        }
        #search-container .search-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #search-container:focus-within .search-icon {
            color: rgba(255, 255, 255, 0.80);
        }
        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: clamp(15px, 2.0vw, 19px);
            font-family: inherit;
            padding: 12px 4px;
            min-width: 0;
            letter-spacing: 0.4px;
            font-weight: 400;
        }
        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.30);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        #search-input::-webkit-search-decoration,
        #search-input::-webkit-search-cancel-button {
            display: none;
        }
        .clear-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.40);
            font-size: 20px;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            line-height: 1;
            flex-shrink: 0;
            width: 30px;
        }
        .clear-btn:hover {
            color: #fff;
            transform: scale(1.10);
        }
        .clear-btn:active {
            transform: scale(0.90);
        }
        .search-btn {
            flex-shrink: 0;
            border: none;
            border-radius: 24px;
            padding: 10px 24px;
            background: rgba(102, 204, 255, 0.18);
            color: var(--text-primary);
            font-size: clamp(14px, 1.4vw, 17px);
            font-family: inherit;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.6px;
            font-weight: 400;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-btn:hover {
            background: rgba(102, 204, 255, 0.32);
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(102, 204, 255, 0.12);
        }
        .search-btn:active {
            transform: scale(0.94);
        }
        .search-btn svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- 齿轮按钮 ---------- */
        #gear-island {
            position: fixed;
            right: 28px;
            bottom: 110px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1100;
            transition: transform 0.25s ease, box-shadow 0.3s ease,
                background var(--transition-speed) ease,
                border var(--transition-speed) ease;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.04);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.04);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        #gear-island:hover {
            transform: scale(1.08) rotate(18deg);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
        }
        #gear-island:active {
            transform: scale(0.90);
        }
        #gear-island svg {
            width: 28px;
            height: 28px;
            color: var(--text-primary);
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.20));
            transition: transform 0.6s ease;
        }
        #gear-island:hover svg {
            transform: rotate(60deg);
        }

        /* ---------- 弹窗 ---------- */
        #modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #modal-overlay.visible {
            pointer-events: auto;
            opacity: 1;
            visibility: visible;
        }
        #modal {
            position: relative;
            width: 540px;
            max-width: 94vw;
            min-height: 400px;
            max-height: 82vh;
            border-radius: 28px;
            padding: 16px 24px 20px;
            display: flex;
            flex-direction: column;
            background: var(--modal-bg);
            backdrop-filter: blur(56px) saturate(220%) brightness(1.06);
            -webkit-backdrop-filter: blur(56px) saturate(220%) brightness(1.06);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.50);
            transform: scale(0.92) translateY(16px);
            opacity: 0;
            transition: transform 0.38s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 0.32s cubic-bezier(0.1, 0.9, 0.2, 1);
            will-change: transform, opacity;
            user-select: none;
            pointer-events: auto;
        }
        #modal-overlay.visible #modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        #modal.closing {
            transform: scale(0.92) translateY(16px) !important;
            opacity: 0 !important;
            transition: transform 0.32s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            padding: 4px 0 6px;
            min-height: 44px;
            cursor: grab;
        }
        .modal-header:active {
            cursor: grabbing;
        }
        #window-controls {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: filter 0.2s, transform 0.15s;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.10);
            flex-shrink: 0;
        }
        .dot.red {
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #d32f2f);
            cursor: pointer;
        }
        .dot.red:hover {
            filter: brightness(1.15);
            transform: scale(1.12);
        }
        .dot.red:active {
            transform: scale(0.88);
        }
        .dot.yellow {
            background: radial-gradient(circle at 35% 35%, #ffd93d, #f9a825);
        }
        .dot.green {
            background: radial-gradient(circle at 35% 35%, #6bcf7f, #2e7d32);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
            transition: color 0.4s ease;
        }
        .modal-subtitle {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            opacity: 0.70;
            letter-spacing: 3px;
            padding: 2px 0 10px;
            transition: color 0.4s ease, opacity 0.4s ease;
            flex-shrink: 0;
            min-height: 28px;
        }

        /* 轮播 */
        .thumb-carousel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 6px 0 4px;
            min-height: 200px;
        }
        .thumb-carousel .thumb-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            flex-shrink: 0;
        }
        .thumb-carousel .thumb-wrapper {
            position: relative;
            width: 280px;
            height: 200px;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            background: rgba(0, 0, 0, 0.20);
            flex-shrink: 0;
        }
        .thumb-carousel .thumb-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .thumb-carousel .thumb-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            display: block;
        }
        .thumb-carousel .thumb-arrow {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, transform 0.2s ease;
            user-select: none;
            line-height: 1;
            padding: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
            flex-shrink: 0;
        }
        .thumb-carousel .thumb-arrow:hover {
            background: rgba(0, 0, 0, 0.50);
            transform: scale(1.08);
        }
        .thumb-carousel .thumb-arrow:active {
            transform: scale(0.92);
        }
        .thumb-carousel .thumb-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-shrink: 0;
        }
        .thumb-carousel .thumb-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.20);
            transition: background 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }
        .thumb-carousel .thumb-dots span.active {
            background: var(--accent);
            transform: scale(1.20);
        }
        .thumb-carousel .thumb-dots span:hover {
            background: rgba(255, 255, 255, 0.40);
        }
        .thumb-carousel .apply-btn {
            padding: 8px 32px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            letter-spacing: 1px;
            flex-shrink: 0;
            font-family: inherit;
        }
        .thumb-carousel .apply-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.25);
        }
        .thumb-carousel .apply-btn:active {
            transform: scale(0.96);

        /* 主题切换 */
        #theme-switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
            padding-top: 14px;
            padding-bottom: 2px;
            flex-wrap: wrap;
            pointer-events: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 6px;
        }
        .theme-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.50);
            transition: color 0.3s, transform 0.3s, background 0.3s;
            padding: 0;
        }
        .theme-icon-btn:hover {
            transform: scale(1.10);
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.06);
        }
        .theme-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .theme-icon-btn.active {
            color: rgba(255, 255, 255, 0.90);
        }
        [data-theme="dark"] .theme-icon-btn.moon-icon {
            color: #ffd93d;
        }
        [data-theme="light"] .theme-icon-btn.sun-icon {
            color: #ffd93d;
        }
        .theme-icon-btn.disabled {
            opacity: 0.30 !important;
            pointer-events: none !important;
        }

        .switch-track {
            position: relative;
            width: 38px;
            height: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.18);
            cursor: pointer;
            transition: background 0.3s ease, opacity 0.3s ease;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.20);
        }
        .switch-track.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .switch-track.disabled {
            opacity: 0.30 !important;
            pointer-events: none !important;
        }
        .switch-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
            transition: transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
            will-change: transform;
            pointer-events: none;
        }
        .switch-track.active .switch-thumb {
            transform: translateX(18px);
            background: #fff;
        }
        .auto-switch-track {
            position: relative;
            width: 38px;
            height: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.18);
            cursor: pointer;
            transition: background 0.3s ease;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.20);
        }
        .auto-switch-track.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .auto-switch-track .auto-switch-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
            transition: transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
            will-change: transform;
            pointer-events: none;
        }
        .auto-switch-track.active .auto-switch-thumb {
            transform: translateX(18px);
            background: #fff;
        }
        .auto-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            transition: color 0.4s ease;
        }

    <!-- ============================================================== -->
    <!-- 脚本：重写版 — 使用您自己的后端域名                           -->
    <!-- ============================================================== -->
    <script>
        (function() {
            'use strict';

            // ---------- 配置 ----------
            // ★★★ 已切换为您自己的后端域名 ★★★
            const API_BASE = 'https://163musicapi.bxfans.dpdns.org';

            const ARTIST_ID = '1078425';
            const EXCLUDED_IDS = ['32192205', '4886973', '500665207'];

            // ---------- DOM 引用 ----------
            const app = document.getElementById('app');
            const audio = document.getElementById('audio');
            const playIcon = document.getElementById('play-icon');
            const songListEl = document.getElementById('song-list');
            const progressBar = document.getElementById('progress');
            const progressFill = document.getElementById('progress-fill');
            const timeDisplay = document.getElementById('time-display');
            const player = document.getElementById('player');
            const coverImg = document.getElementById('cover-img');
            const songInfoEl = document.getElementById('song-info');
            const mainPlayBtn = document.getElementById('main-play-btn');
            const lyricsLine1 = document.getElementById('lyrics-line-1');
            const lyricsLine2 = document.getElementById('lyrics-line-2');
            const lyricsLine3 = document.getElementById('lyrics-line-3');
            const modeBtn = document.getElementById('mode-btn');
            const modeIcon = document.getElementById('mode-icon');
            const clockEl = document.getElementById('clock');
            const weatherIconEl = document.getElementById('weather-icon');
            const weatherTempEl = document.getElementById('weather-temp');
            const weatherDescEl = document.getElementById('weather-desc');
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-btn');
            const searchBtn = document.getElementById('search-btn');

            // ---------- 状态 ----------
            let songList = [];
            let currentIdx = 0;
            let mode = 0; // 0:顺序 1:单曲循环 2:随机
            let isDraggingProgress = false;
            let lyricLines = [];
            let songUrlCache = {};
            let lyricCache = {};
            let coverCache = {};
            let isPlayerReady = false;

            const playSVG = `<path d="M8 5v14l11-7z"/>`;
            const pauseSVG = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;

            // ---------- API 封装 (使用您自己的后端) ----------
            async function apiFetch(endpoint) {
                const url = `${API_BASE}${endpoint}`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                return resp.json();
            }

            async function fetchArtistSongs(artistId) {
                const json = await apiFetch(`/artist/songs?uid=${artistId}`);
                let list = json.data?.songs || json.songs || json.data?.list || json.list || json.data || [];
                if (!Array.isArray(list)) list = [];
                const filtered = list.filter(s => !EXCLUDED_IDS.includes(String(s.id)));
                return filtered.map(song => {
                    let artistName = '未知歌手';
                    if (song.ar && Array.isArray(song.ar) && song.ar[0]?.name) artistName = song.ar[0].name;
                    else if (song.artists && Array.isArray(song.artists) && song.artists[0]?.name) artistName = song
                        .artists[0].name;
                    else if (song.artist && typeof song.artist === 'string') artistName = song.artist;
                    else if (song.artist?.name) artistName = song.artist.name;
                    else if (song.singer) artistName = song.singer;
                    let albumName = song.al?.name || song.album || '未知专辑';
                    let coverUrl = song.al?.picUrl || song.picUrl || song.cover || '';
                    return {
                        id: String(song.id),
                        name: song.name || song.title || '未知歌曲',
                        artist: artistName,
                        album: albumName,
                        cover: coverUrl,
                        url: '',
                        lyric: ''
                    };
                });
            }

            async function fetchSongUrl(songId) {
                if (songUrlCache[songId]) return songUrlCache[songId];
                const json = await apiFetch(`/song/url?id=${songId}`);
                let playUrl = json.data?.url || json.url || '';
                if (!playUrl) throw new Error('未获取到播放地址');
                songUrlCache[songId] = playUrl;
                if (json.data?.cover) coverCache[songId] = json.data.cover;
                return playUrl;
            }

            async function fetchSongLyric(songId) {
                if (lyricCache[songId]) return lyricCache[songId];
                const json = await apiFetch(`/lyric?id=${songId}`);
                let lyricText = json.data?.lyric || json.lyric || json.lrc?.lyric || '';
                if (!lyricText) return null;
                const parsed = parseLRC(lyricText);
                lyricCache[songId] = parsed;
                return parsed;
            }

            function parseLRC(lrcText) {
                const lines = lrcText.split('\n');
                const parsed = [];
                const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
                for (let line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    const match = trimmed.match(timeRegex);
                    if (match) {
                        const minutes = parseInt(match[1]);
                        const seconds = parseInt(match[2]);
                        const ms = parseInt(match[3].padEnd(3, '0'));
                        const totalSeconds = minutes * 60 + seconds + ms / 1000;
                        const text = trimmed.replace(timeRegex, '').trim();
                        if (text) parsed.push({ time: totalSeconds, text: text });
                    }
                }
                if (parsed.length === 0) {
                    const textLines = lrcText.split('\n').filter(line => line.trim().length > 0);
                    if (textLines.length > 0) {
                        const duration = audio.duration || 180;
                        const timeStep = duration / textLines.length;
                        return textLines.map((text, i) => ({ time: i * timeStep, text: text.trim() }));
                    }
                    return null;
                }
                parsed.sort((a, b) => a.time - b.time);
                return parsed;
            }

            // ---------- UI 更新 ----------
            function setPlayingState(playing) {
                if (playing) {
                    progressFill.classList.add('playing');
                    playIcon.innerHTML = pauseSVG;
                } else {
                    progressFill.classList.remove('playing');
                    playIcon.innerHTML = playSVG;
                }
            }

            function updateProgress() {
                if (isDraggingProgress) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = percent;
                    progressFill.style.width = percent + '%';
                } else {
                    progressFill.style.width = '0%';
                }
            }

            function updateSongInfo() {
                if (currentIdx < 0 || currentIdx >= songList.length) return;
                const song = songList[currentIdx];
                songInfoEl.textContent = `${song.name} - ${song.artist}`;
            }

            function highlightCurrentSong() {
                const items = songListEl.querySelectorAll('.song-item');
                items.forEach((item, index) => {
                    item.classList.toggle('active-song', index === currentIdx);
                });
            }

            function updateLyricsDisplay(line1, line2, line3) {
                lyricsLine1.textContent = line1 || '';
                lyricsLine2.textContent = line2 || '';
                lyricsLine3.textContent = line3 || '';
                lyricsLine1.className = 'lyrics-line placeholder';
                lyricsLine2.className = 'lyrics-line current placeholder';
                lyricsLine3.className = 'lyrics-line placeholder';
            }

            function updateLyrics() {
                if (!lyricLines || lyricLines.length === 0) {
                    updateLyricsDisplay('♪ 无歌词', '♪ 无歌词', '♪ 无歌词');
                    return;
                }
                const currentTime = audio.currentTime || 0;
                let idx = 0;
                for (let i = 0; i < lyricLines.length; i++) {
                    if (lyricLines[i].time <= currentTime) idx = i;
                    else break;
                }
                if (idx >= lyricLines.length) idx = lyricLines.length - 1;
                const prevIdx = Math.max(0, idx - 1);
                const nextIdx = Math.min(lyricLines.length - 1, idx + 1);
                lyricsLine1.textContent = lyricLines[prevIdx]?.text || '♪';
                lyricsLine2.textContent = lyricLines[idx]?.text || '♪';
                lyricsLine3.textContent = lyricLines[nextIdx]?.text || '♪';
                lyricsLine1.className = 'lyrics-line prev';
                lyricsLine2.className = 'lyrics-line current';
                lyricsLine3.className = 'lyrics-line next';
                if (prevIdx === idx) lyricsLine1.textContent = '';
                if (nextIdx === idx) lyricsLine3.textContent = '';

                lyricsLine2.style.textShadow = '0 0 20px rgba(255,255,255,0.40)';

            // ---------- 核心播放 ----------
            async function loadAndPlay(index) {
                if (index < 0 || index >= songList.length) {
                    console.warn('索引无效:', index);
                    return;
                }
                currentIdx = index;
                const song = songList[index];
                updateSongInfo();
                highlightCurrentSong();
                coverImg.src = song.cover || 'CD.jpg';

                try {
                    const url = await fetchSongUrl(song.id);
                    audio.src = url;
                    audio.load();
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => setPlayingState(true)).catch(() => setPlayingState(false));
                    }
                } catch (e) {
                    console.error('❌ 获取播放地址失败:', e);
                    audio.src = '';
                    setPlayingState(false);
                    songInfoEl.textContent = song.name + ' - 播放失败';
                }

                try {
                    const lyric = await fetchSongLyric(song.id);
                    lyricLines = lyric || [];
                    if (lyricLines.length === 0) updateLyricsDisplay('♪ 无歌词', '♪ 无歌词', '♪ 无歌词');
                } catch (e) {
                    lyricLines = [];
                    updateLyricsDisplay('♪ 歌词加载失败', '♪ 请稍后重试', '♪');
                }

                if (coverCache[song.id]) coverImg.src = coverCache[song.id];
                updateProgress();
                setTimeout(adjustLyricsIslandPosition, 100);
            }

            // ---------- 播放控制 ----------

                    audio.pause();
                    setPlayingState(false);
                }

            };

            window.prevSong = function() {
                if (songList.length === 0) return;
                currentIdx = (currentIdx - 1 + songList.length) % songList.length;
                loadAndPlay(currentIdx);

                if (songList.length === 0) return;
                if (mode === 2) {

            // ---------- 主题切换 ----------
            let currentTheme = 'light';
            let isTransitioning = false;
            const switchTrack = document.getElementById('switch-track');
            const moonBtn = document.getElementById('moon-btn');
            const sunBtn = document.getElementById('sun-btn');
            const gearBtn = document.getElementById('gear-island');
            const autoSwitchTrack = document.getElementById('auto-switch-track');
            const autoCheckbox = document.getElementById('auto-theme-checkbox');
            let autoThemeEnabled = true;
            let systemThemeListener = null;
            const manualControls = [moonBtn, switchTrack, sunBtn];

            function setManualControlsDisabled(disabled) {
                manualControls.forEach(el => el.classList.toggle('disabled', disabled));
            }

            function applySystemTheme() {
                if (autoThemeEnabled) {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    setTheme(prefersDark ? 'dark' : 'light', true);
                }
            }

            function setupAutoTheme() {
                if (autoThemeEnabled) {
                    if (systemThemeListener) systemThemeListener.removeEventListener('change', applySystemTheme);
                    systemThemeListener = window.matchMedia('(prefers-color-scheme: dark)');
                    systemThemeListener.addEventListener('change', applySystemTheme);
                    applySystemTheme();
                    setManualControlsDisabled(true);
                } else {
                    if (systemThemeListener) {
                        systemThemeListener.removeEventListener('change', applySystemTheme);
                        systemThemeListener = null;
                    }
                    setManualControlsDisabled(false);
                }
            }

            function setTheme(theme, silent = false) {
                if (theme === currentTheme && !silent) return;
                if (isTransitioning) return;
                const toDark = theme === 'dark';
                const waveColor = toDark ? 'rgba(128,128,128,0.12)' : 'rgba(255,255,255,0.12)';
                const gearRect = gearBtn.getBoundingClientRect();
                const cx = gearRect.left + gearRect.width / 2;
                const cy = gearRect.top + gearRect.height / 2;
                isTransitioning = true;

                const overlay = document.getElementById('theme-transition-overlay');
                if (!overlay) {
                    applyThemeDirect(theme);
                    isTransitioning = false;
                    return;
                }
                overlay.style.background = waveColor;
                overlay.style.clipPath = `circle(0% at ${cx}px ${cy}px)`;
                overlay.classList.add('animating');
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';
                void overlay.offsetWidth;
                overlay.style.transition = 'clip-path 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                overlay.style.clipPath = `circle(150% at ${cx}px ${cy}px)`;

                const onEnd = function() {
                    overlay.removeEventListener('transitionend', onEnd);
                    applyThemeDirect(theme);
                    overlay.style.transition = 'none';
                    overlay.classList.remove('animating');
                    overlay.style.visibility = 'hidden';
                    overlay.style.opacity = '0';
                    overlay.style.clipPath = '';
                    overlay.style.background = 'transparent';
                    isTransitioning = false;
                };
                overlay.addEventListener('transitionend', onEnd);
                setTimeout(() => {
                    if (isTransitioning) {
                        overlay.removeEventListener('transitionend', onEnd);
                        applyThemeDirect(theme);
                        overlay.style.transition = 'none';
                        overlay.classList.remove('animating');
                        overlay.style.visibility = 'hidden';
                        overlay.style.opacity = '0';
                        overlay.style.clipPath = '';
                        overlay.style.background = 'transparent';
                        isTransitioning = false;
                    }
                }, 1200);
            }

            function applyThemeDirect(theme) {
                app.setAttribute('data-theme', theme);
                currentTheme = theme;
                updateSwitchUI(theme);
            }

            function updateSwitchUI(theme) {
                if (theme === 'dark') {
                    switchTrack.classList.add('active');
                    moonBtn.classList.add('active');
                    sunBtn.classList.remove('active');
                } else {
                    switchTrack.classList.remove('active');
                    moonBtn.classList.remove('active');
                    sunBtn.classList.add('active');
                }
            }

            function toggleTheme() {
                if (isTransitioning || autoThemeEnabled) return;
                const target = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(target);
            }

            window.toggleTheme = toggleTheme;
            window.setTheme = setTheme;

            function updateAutoSwitchUI(enabled) {
                if (enabled) {
                    autoSwitchTrack.classList.add('active');

            // ---------- 主题图片轮播 ----------

                const imgTest = new Image();

            // ---------- Cookie ----------
            function setCookie(name, value, days) {
                const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
                document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
            }

            function getCookie(name) {
                const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? decodeURIComponent(match[2]) : null;
            }

            // ---------- 时间 / 天气 ----------
            let userTimeZone = 'Asia/Shanghai';

            function updateClock() {
                const now = new Date();
                try {
                    const formatter = new Intl.DateTimeFormat('zh-CN', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false,
                        timeZone: userTimeZone
                    });
                    clockEl.textContent = formatter.format(now);
                } catch {
                    const offset = 8 * 60;
                    const local = new Date(now.getTime() + (offset - now.getTimezoneOffset()) * 60000);
                    clockEl.textContent =
                        `${String(local.getHours()).padStart(2,'0')}:${String(local.getMinutes()).padStart(2,'0')}:${String(local.getSeconds()).padStart(2,'0')}`;
                }
            }
            updateClock();
            setInterval(updateClock, 1000);

            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(d => { if (d.timezone) { userTimeZone = d.timezone;
                        updateClock(); } })
                .catch(() => {});

            const WEATHER_CACHE_KEY = 'weather_cache';
            const CACHE_DURATION = 10 * 60 * 1000;
            const svgMap = {
                'sunny': `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
                'cloudy': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/></svg>`,
                'rainy': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/><line x1="8" y1="17" x2="8" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="16" y1="17" x2="16" y2="21"/></svg>`,
                'snowy': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/><circle cx="8" cy="18" r="1.5"/><circle cx="12" cy="20" r="1.5"/><circle cx="16" cy="18" r="1.5"/></svg>`,
                'thunderstorm': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/><path d="M12 17l-2 4h4l-2 4"/></svg>`
            };

            function getWeatherIconSVG(code) {
                let icon = 'cloudy';
                if (code === 113) icon = 'sunny';
                else if ([176, 179, 182, 185, 293, 296, 299, 302, 305, 308, 311, 314, 317, 320, 323, 326, 329, 332, 335, 338,
                        350, 353, 356, 359, 362, 365, 368, 371, 374, 377, 386, 389, 392, 395
                    ].includes(code)) {
                    if (code >= 200 && code < 300) icon = 'thunderstorm';
                    else if (code >= 300 && code < 600) icon = 'rainy';
                    else if (code >= 600 && code < 700) icon = 'snowy';
                    else icon = 'rainy';
                }
                return svgMap[icon] || svgMap['cloudy'];
            }

            function updateWeatherUI(data) {
                weatherTempEl.textContent = `${data.temp}°C`;
                weatherDescEl.textContent = data.desc || '';
                weatherIconEl.innerHTML = getWeatherIconSVG(data.code);
            }

            function fetchWeather() {
                const cached = localStorage.getItem(WEATHER_CACHE_KEY);
                if (cached) {
                    try {
                        const data = JSON.parse(cached);
                        if (Date.now() - data.timestamp < CACHE_DURATION) { updateWeatherUI(data); return; }
                    } catch (e) {}
                }
                fetch('https://wttr.in/?format=j1&lang=zh')
                    .then(r => r.json())
                    .then(json => {
                        const current = json.current_condition[0];
                        const data = {
                            temp: current.temp_C,
                            desc: current.weatherDesc[0].value,
                            code: parseInt(current.weatherCode),
                            timestamp: Date.now()
                        };
                        localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(data));
                        updateWeatherUI(data);
                    })
                    .catch(() => {
                        updateWeatherUI({ temp: '22', desc: '多云', code: 119 });
                    });
            }
            fetchWeather();
            setInterval(fetchWeather, CACHE_DURATION);

            // ---------- 歌词岛位置自适应 ----------
            function adjustLyricsIslandPosition() {
                const timeInfo = document.getElementById('top-right-info');
                if (!timeInfo) return;
                const rect = timeInfo.getBoundingClientRect();
                const island = document.getElementById('lyrics-island');
                if (!island) return;
                island.style.top = rect.top + 'px';
                island.style.right = (window.innerWidth - rect.left + 12) + 'px';
            }

            // ---------- 搜索 ----------
            window.performSearch = function() {
                const query = searchInput.value.trim();
                if (!query) { searchInput.focus(); return; }
                window.open('https://cn.bing.com/search?q=' + encodeURIComponent(query), '_blank');
            };

            window.clearSearch = function() {
                searchInput.value = '';
                searchInput.focus();
                clearBtn.style.display = 'none';
            };

            searchInput.addEventListener('input', function() {
                clearBtn.style.display = this.value.length > 0 ? 'flex' : 'none';
            });

            searchInput.addEventListener('blur', function() {
                if (this.value.length === 0) clearBtn.style.display = 'none';
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault();
                    performSearch(); }
            });

            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                performSearch();
            });

            // ---------- 移动端搜索 ----------
            window.performMobileSearch = function() {
                const input = document.getElementById('mobile-search-input');
                const query = input.value.trim();
                if (!query) { input.focus(); return; }
                window.open('https://cn.bing.com/search?q=' + encodeURIComponent(query), '_blank');
            };

            const mobileInput = document.getElementById('mobile-search-input');
            const mobileBtn = document.getElementById('mobile-search-btn');
            mobileInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault();
                    performMobileSearch(); }
            });
            mobileBtn.addEventListener('click', function(e) {
                e.preventDefault();
                performMobileSearch();
            });

            // ---------- 构建歌曲列表 ----------
            function buildSongListUI() {
                songListEl.innerHTML = '';
                if (!songList || songList.length === 0) {
                    songListEl.innerHTML = '<div class="song-item" style="color:#aaa;padding:12px;">暂无歌曲数据</div>';
                    return;
                }
                songList.forEach((song, index) => {
                    const div = document.createElement('div');
                    div.className = 'song-item';
                    div.dataset.index = index;
                    const idxSpan = document.createElement('span');
                    idxSpan.className = 'song-index';
                    idxSpan.textContent = String(index + 1).padStart(2, '0');
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'song-name';
                    nameSpan.textContent = song.name || '未知歌曲';
                    const artistSpan = document.createElement('span');
                    artistSpan.className = 'song-artist';
                    artistSpan.textContent = song.artist || '未知歌手';
                    div.appendChild(idxSpan);
                    div.appendChild(nameSpan);
                    if (song.artist) div.appendChild(artistSpan);
                    div.onclick = function() {
                        const idx = parseInt(this.dataset.index);
                        if (idx !== currentIdx) loadAndPlay(idx);
                        else window.togglePlay();
                        closeListWithAnimation();
                    };
                    songListEl.appendChild(div);
                });
                highlightCurrentSong();
                updateSongInfo();
            }

            // ---------- 初始化 ----------
            async function initPlayer() {
                try {
                    const list = await fetchArtistSongs(ARTIST_ID);
                    if (list.length === 0) throw new Error('没有获取到歌曲');
                    songList = list;
                    console.log(`🎵 获取到 ${songList.length} 首歌曲`);
                    buildSongListUI();
                    modeIcon.innerHTML = modeIcons[0];
                    await loadAndPlay(0);
                    isPlayerReady = true;
                } catch (err) {
                    console.error('❌ 初始化失败:', err);
                    songInfoEl.textContent = '⚠️ 加载失败: ' + err.message.slice(0, 60);
                    songList = [{ id: '0', name: '加载失败', artist: '请检查控制台', album: '', cover: 'CD.jpg' }];
                    buildSongListUI();
                }
            }

            // ---------- 事件绑定 ----------
            thumbPrev.addEventListener('click', function(e) { e.stopPropagation();
                goToThumb(currentThumbIndex - 1); });
            thumbNext.addEventListener('click', function(e) { e.stopPropagation();
                goToThumb(currentThumbIndex + 1); });
            thumbDots.querySelectorAll('span').forEach((dot, i) => {
                dot.addEventListener('click', function(e) { e.stopPropagation();
                    goToThumb(i); });
            });
            applyBtn.addEventListener('click', function(e) { e.stopPropagation();
                applyCurrentTheme(); });

            document.addEventListener('keydown', function(e) {
                if (isModalOpen) {
                    if (e.key === 'ArrowLeft') { e.preventDefault();
                        goToThumb(currentThumbIndex - 1); } else if (e.key === 'ArrowRight') { e.preventDefault();
                        goToThumb(currentThumbIndex + 1); } else if (e.key === 'Enter' && !e.target.closest(
                            'input, textarea, button')) {
                        applyCurrentTheme();
                    }
                }
            });

            // ---------- 启动 ----------
            document.addEventListener('DOMContentLoaded', function() {
                preloadImages();
                initDefaultTheme();
                setTimeout(adjustLyricsIslandPosition, 50);
            });

            window.addEventListener('load', function() {
                initPlayer();
                initAutoSwitch();
                setTimeout(adjustLyricsIslandPosition, 100);

                window.__player = {
                    songList,
                    currentIdx,
                    mode,
                    loadAndPlay,
                    togglePlay,
                    prevSong,
                    nextSong,
                    changeMode
                };
                console.log('🎵 播放器已启动 (后端: ' + API_BASE + ')');
                console.log('🔍 搜索框已加载 — 必应中国特供版');
            });

            window.addEventListener('resize', adjustLyricsIslandPosition);
            window.addEventListener('scroll', adjustLyricsIslandPosition);

        })();
    </script>

</body>
</html>
