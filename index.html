                    <div class="switch-thumb" id="switch-thumb"></div>
                </div>
                <button class="theme-icon-btn sun-icon active" id="sun-btn" onclick="setTheme('light')" title="明亮模式">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
                <span class="auto-label">根据设备设置</span>
                <div class="auto-switch-track active" id="auto-switch-track" title="开启后自动跟随系统主题">
                    <div class="auto-switch-thumb" id="auto-switch-thumb"></div>
                    <input type="checkbox" id="auto-theme-checkbox" checked style="opacity:0; width:0; height:0; position:absolute; pointer-events:none;" />
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 主题过渡层 ====== -->
    <div id="theme-transition-overlay"></div>

    <!-- ====== 音频 ====== -->
    <audio id="audio"></audio>

    <script>
        // ===================================================================
        //  完整脚本 — 蝶云.jpg → 蝶云.png，移除CD.jpg除专辑封面外的占位
        // ===================================================================

        // ---------- Cookie 工具 ----------
        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return decodeURIComponent(match[2]);
            return null;
        }

        // ---------- 1. 时间 / 天气 ----------
        const clockEl = document.getElementById('clock');
        const weatherIconEl = document.getElementById('weather-icon');
        const weatherTempEl = document.getElementById('weather-temp');
        const weatherDescEl = document.getElementById('weather-desc');

        let userTimeZone = 'Asia/Shanghai';

        function updateClock() {
            const now = new Date();
            try {
                const formatter = new Intl.DateTimeFormat('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false,
                    timeZone: userTimeZone
                });
                clockEl.textContent = formatter.format(now);
            } catch {
                const offset = 8 * 60;
                const local = new Date(now.getTime() + (offset - now.getTimezoneOffset()) * 60000);
                clockEl.textContent = `${String(local.getHours()).padStart(2,'0')}:${String(local.getMinutes()).padStart(2,'0')}:${String(local.getSeconds()).padStart(2,'0')}`;
            }
        }
        updateClock();
        setInterval(updateClock, 1000);
        fetch('https://ipapi.co/json/')
            .then(r => r.json())
            .then(d => { if (d.timezone) { userTimeZone = d.timezone; updateClock(); } })
            .catch(() => {});

        const WEATHER_CACHE_KEY = 'weather_cache';
        const CACHE_DURATION = 10 * 60 * 1000;
        const svgMap = {
            'sunny': `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
            'cloudy': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/></svg>`,
            'rainy': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/><line x1="8" y1="17" x2="8" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="16" y1="17" x2="16" y2="21"/></svg>`,
            'snowy': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/><circle cx="8" cy="18" r="1.5"/><circle cx="12" cy="20" r="1.5"/><circle cx="16" cy="18" r="1.5"/></svg>`,
            'thunderstorm': `<svg viewBox="0 0 24 24"><path d="M6 12a5 5 0 0 1 5-5 4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1 3.5 3.5c0 1.5-1 3-2.5 3H7a4 4 0 0 1-1-7.9z"/><path d="M12 17l-2 4h4l-2 4"/></svg>`
        };

        function getWeatherIconSVG(code) {
            let icon = 'cloudy';
            if (code === 113) icon = 'sunny';
            else if ([176,179,182,185,293,296,299,302,305,308,311,314,317,320,323,326,329,332,335,338,350,353,356,359,362,365,368,371,374,377,386,389,392,395].includes(code)) {
                if (code >= 200 && code < 300) icon = 'thunderstorm';
                else if (code >= 300 && code < 600) icon = 'rainy';
                else if (code >= 600 && code < 700) icon = 'snowy';
                else icon = 'rainy';
            }
            return svgMap[icon] || svgMap['cloudy'];
        }
        function updateWeatherUI(data) {
            weatherTempEl.textContent = `${data.temp}°C`;
            weatherDescEl.textContent = data.desc || '';
            weatherIconEl.innerHTML = getWeatherIconSVG(data.code);
        }
        function fetchWeather() {
            const cached = localStorage.getItem(WEATHER_CACHE_KEY);
            if (cached) {
                try {
                    const data = JSON.parse(cached);
                    if (Date.now() - data.timestamp < CACHE_DURATION) { updateWeatherUI(data); return; }
                } catch {}
            }
            fetch('https://wttr.in/?format=j1&lang=zh')
                .then(r => r.json())
                .then(json => {
                    const current = json.current_condition[0];
                    const data = { temp: current.temp_C, desc: current.weatherDesc[0].value, code: parseInt(current.weatherCode), timestamp: Date.now() };
                    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(data));
                    updateWeatherUI(data);
                })
                .catch(() => {
                    const fallback = { temp: '22', desc: '多云', code: 119, timestamp: Date.now() };
                    updateWeatherUI(fallback);
                });
        }
        fetchWeather();
        setInterval(fetchWeather, CACHE_DURATION);

        // ---------- 2. 播放器核心 ----------
        const songs = [
            "Aquaculture - LamazeP.mp3",
            "I say love - LamazeP.mp3",
            "Nothing - LamazeP.mp3",
            "Refugium - LamazeP.mp3",
            "WAVEFILE_V3ver - LamazeP.mp3",
            "くるくるぱぁ - LamazeP.mp3",
            "デレ化現象100_ - LamazeP.mp3",
            "トキメキ - LamazeP.mp3",
            "愛の詩 - LamazeP.mp3",
            "銀河系から徒歩_分以内で - LamazeP.mp3",
            "LEMON MELON COOKIE - TAK.mp3",
            "mochimochi - TAK.mp3",
            "はじまりの未来 - Hatsune Miku.mp3",
            "哀の隙間 - MIMI.mp3",
            "化孵化 - sasakure.UK.mp3",
            "水音とカーテン - MIMI.mp3",
            "静寂に咲く - MIMI.mp3",
            "魔理沙は大変なものを盗んでいきました - IOSYS.mp3"
        ];

        const audio = document.getElementById('audio');
        const playIcon = document.getElementById('play-icon');
        const songListEl = document.getElementById('song-list');
        const progressBar = document.getElementById('progress');
        const progressFill = document.getElementById('progress-fill');
        const timeDisplay = document.getElementById('time-display');
        const player = document.getElementById('player');
        const coverImg = document.getElementById('cover-img');
        const songInfoEl = document.getElementById('song-info');
        const mainPlayBtn = document.getElementById('main-play-btn');

        const lyricsLine1 = document.getElementById('lyrics-line-1');
        const lyricsLine2 = document.getElementById('lyrics-line-2');
        const lyricsLine3 = document.getElementById('lyrics-line-3');

        const modeBtn = document.getElementById('mode-btn');

        let currentIdx = 0, mode = 0;
        let isDraggingProgress = false;

        const playSVG = `<path d="M8 5v14l11-7z"/>`;
        const pauseSVG = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;

        const SPOTIFY_PROXY = 'https://spotify-api-wrapper.appspot.com';
        const coverCache = {};
        let lyricLines = [];

        function parseFromFileName(fileName) {
            let name = fileName.replace(/\.mp3$/i, '');
            let artist = '';
            if (name.includes(' - ')) {
                const parts = name.split(' - ');
                artist = parts.pop().trim();
                name = parts.join(' - ').trim();
            }
            if (!name) name = fileName;
            if (!artist) artist = 'unknown';
            return { title: name, artist: artist };
        }

        function fetchCoverFromSpotify(title, artist) {
            const query = encodeURIComponent(`${title} ${artist}`);
            return fetch(`${SPOTIFY_PROXY}/search/track/${query}`)
                .then(res => res.json())
                .then(data => {
                    if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                        const track = data.tracks.items[0];
                        if (track.album && track.album.images && track.album.images.length > 0) {
                            const sorted = track.album.images.sort((a, b) => b.width - a.width);
                            return sorted[0].url;
                        }
                    }
                    return null;
                })
                .catch(() => null);
        }

        function getCoverForSong(fileName) {
            return new Promise((resolve) => {
                if (coverCache[fileName] !== undefined) {
                    resolve(coverCache[fileName]);
                    return;
                }
                const parsed = parseFromFileName(fileName);
                fetchCoverFromSpotify(parsed.title, parsed.artist)
                    .then(url => {
                        coverCache[fileName] = url || null;
                        resolve(coverCache[fileName]);
                    })
                    .catch(() => {
                        coverCache[fileName] = null;
                        resolve(null);
                    });
            });
        }

        function preloadAllCovers() {
            return Promise.all(songs.map(song => getCoverForSong(song)));
        }

        let lyricsCache = {};

        function fetchLyricsOvh(title, artist) {
            const url = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;
            return fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.lyrics) {
                        return data.lyrics.split('\n').filter(line => line.trim().length > 0);
                    }
                    throw new Error('No lyrics');
                })
                .catch(() => null);
        }

        function loadLyrics(fileName) {
            lyricLines = [];
            updateLyricsDisplay('♪ 加载中...', '♪ 请稍候', '♪ 获取歌词...');

            const parsed = parseFromFileName(fileName);
            const title = parsed.title;
            const artist = parsed.artist;

            if (lyricsCache[fileName]) {
                lyricLines = lyricsCache[fileName];
                updateLyrics();
                return;
            }

            fetchLyricsOvh(title, artist)
                .then(lines => {
                    if (lines && lines.length > 0) {
                        const duration = audio.duration || 180;
                        const total = lines.length;
                        const timeStep = duration / total;
                        lyricLines = lines.map((text, i) => ({ time: i * timeStep, text: text }));
                        lyricsCache[fileName] = lyricLines;
                        updateLyrics();
                    } else {
                        return fetchLyricsOvh(title, '');
                    }
                })
                .then(linesFallback => {
                    if (linesFallback && linesFallback.length > 0) {
                        const duration = audio.duration || 180;
                        const total = linesFallback.length;
                        const timeStep = duration / total;
                        lyricLines = linesFallback.map((text, i) => ({ time: i * timeStep, text: text }));
                        lyricsCache[fileName] = lyricLines;
                        updateLyrics();
                    } else {
                        lyricLines = [];
                        updateLyricsDisplay('♪ 无歌词', '♪ 无歌词', '♪ 无歌词');
                    }
                })
                .catch(() => {
                    lyricLines = [];
                    updateLyricsDisplay('♪ 无歌词', '♪ 无歌词', '♪ 无歌词');
                });
        }

        function updateLyricsDisplay(line1, line2, line3) {
            lyricsLine1.textContent = line1;
            lyricsLine2.textContent = line2;
            lyricsLine3.textContent = line3;
            lyricsLine1.className = 'lyrics-line placeholder';
            lyricsLine2.className = 'lyrics-line current placeholder';
            lyricsLine3.className = 'lyrics-line placeholder';
        }

        function updateLyrics() {
            if (!lyricLines || lyricLines.length === 0) {
                updateLyricsDisplay('♪ 无歌词', '♪ 无歌词', '♪ 无歌词');
                return;
            }
            const currentTime = audio.currentTime || 0;
            let idx = 0;
            for (let i = 0; i < lyricLines.length; i++) {
                if (lyricLines[i].time <= currentTime) idx = i;
                else break;
            }
            if (idx >= lyricLines.length) idx = lyricLines.length - 1;
            const prevIdx = idx - 1 >= 0 ? idx - 1 : 0;
            const nextIdx = idx + 1 < lyricLines.length ? idx + 1 : lyricLines.length - 1;

            lyricsLine1.textContent = lyricLines[prevIdx].text || '♪';
            lyricsLine2.textContent = lyricLines[idx].text || '♪';
            lyricsLine3.textContent = lyricLines[nextIdx].text || '♪';
            lyricsLine1.className = 'lyrics-line prev';
            lyricsLine2.className = 'lyrics-line current';
            lyricsLine3.className = 'lyrics-line next';
            if (prevIdx === idx) lyricsLine1.textContent = '';
            if (nextIdx === idx) lyricsLine3.textContent = '';
        }

        function setPlayingState(playing) {
            if (playing) {
                progressFill.classList.add('playing');
                playIcon.innerHTML = pauseSVG;
            } else {
                progressFill.classList.remove('playing');
                playIcon.innerHTML = playSVG;
            }
        }

        function updateProgress() {
            if (isDraggingProgress) return;
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                progressFill.style.width = percent + '%';
            } else {
                progressFill.style.width = '0%';
            }
        }

        function loadAndPlay() {
            const src = songs[currentIdx];
            audio.src = src;
            audio.load();
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => setPlayingState(true)).catch(() => setPlayingState(false));
            }
            const cachedUrl = coverCache[src];
            if (cachedUrl) {
                coverImg.src = cachedUrl;
            } else {
                coverImg.src = 'CD.jpg'; // 专辑封面使用CD.jpg作为默认占位
                getCoverForSong(src).then(url => { if (url) coverImg.src = url; });
            }
            updateProgress();
            highlightCurrentSong();
            updateSongInfo();
            loadLyrics(src);
            applyWhiteToHighlights();
        }

        function updateSongInfo() {
            const data = songDisplayData[currentIdx];
            if (data) songInfoEl.textContent = data.display;
            else {
                const parsed = parseFromFileName(songs[currentIdx]);
                songInfoEl.textContent = `${parsed.title} - ${parsed.artist}`;
            }
        }

        function highlightCurrentSong() {
            const items = songListEl.querySelectorAll('.song-item');
            items.forEach((item, index) => {
                if (index === currentIdx) item.classList.add('active-song');
                else item.classList.remove('active-song');
            });
        }

        let songDisplayData = [];

        function searchTrackInfo(query) {
            return fetch(`${SPOTIFY_PROXY}/search/track/${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                        const track = data.tracks.items[0];
                        return { title: track.name, artist: track.artists.map(a => a.name).join(', ') };
                    }
                    return null;
                })
                .catch(() => null);
        }

        async function resolveWithSpotify(fileName) {
            const query = fileName.replace(/\.mp3$/i, '').trim();
            const info = await searchTrackInfo(query);
            if (info) {
                return { original: fileName, title: info.title, artist: info.artist, display: `${info.title} - ${info.artist}` };
            } else {
                const parsed = parseFromFileName(fileName);
                return { original: fileName, title: parsed.title, artist: parsed.artist, display: `${parsed.title} - ${parsed.artist}` };
            }
        }

        async function buildSongListFromProxy() {
            const results = await Promise.all(songs.map(fileName => resolveWithSpotify(fileName)));
            songDisplayData = results;
            songListEl.innerHTML = '';
            results.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.dataset.index = index;
                const idxSpan = document.createElement('span');
                idxSpan.className = 'song-index';
                idxSpan.textContent = String(index + 1).padStart(2, '0');
                const nameSpan = document.createElement('span');
                nameSpan.className = 'song-name';
                nameSpan.textContent = item.title;
                const artistSpan = document.createElement('span');
                artistSpan.className = 'song-artist';
                artistSpan.textContent = item.artist !== 'unknown' ? item.artist : '';
                div.appendChild(idxSpan);
                div.appendChild(nameSpan);
                if (item.artist !== 'unknown') div.appendChild(artistSpan);
                div.onclick = () => {
                    currentIdx = parseInt(div.dataset.index);
                    loadAndPlay();
                    closeListWithAnimation();
                    highlightCurrentSong();
                };
                songListEl.appendChild(div);
            });
            highlightCurrentSong();
            updateSongInfo();
        }

        window.togglePlay = () => {
            if (audio.paused) {
                audio.play().then(() => setPlayingState(true)).catch(() => setPlayingState(false));
            } else {
                audio.pause();
                setPlayingState(false);
            }
            triggerAnimation(mainPlayBtn, 'btn-anim', 450);
        };
        window.prev = () => {
            currentIdx = (currentIdx - 1 + songs.length) % songs.length;
            loadAndPlay();
        };
        window.next = () => {
            currentIdx = (mode === 2) ? Math.floor(Math.random() * songs.length) : (currentIdx + 1) % songs.length;
            loadAndPlay();
        };

        const iconMap = [
            `<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4" /><path d="M3 11v-2a4 4 0 0 1 4-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></svg>`,
            `<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4" /><path d="M3 11v-2a4 4 0 0 1 4-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /><path d="M12 10v4" /><path d="M12 14h1.5" /></svg>`,
            `<svg viewBox="0 0 24 24"><path d="M21 7h-4a3 3 0 0 0-3 3v4a3 3 0 0 1-3 3H3" /><path d="M21 17h-4a3 3 0 0 1-3-3v-4a3 3 0 0 0-3-3H3" /><path d="M3 7h4" /><path d="M3 17h4" /></svg>`
        ];
        window.changeMode = () => {
            mode = (mode + 1) % 3;
            document.getElementById('mode-icon').innerHTML = iconMap[mode];
            triggerAnimation(modeBtn, 'mode-anim', 550);
        };

        function triggerAnimation(element, className, duration) {
            if (!element) return;
            element.classList.remove(className);
            void element.offsetWidth;
            element.classList.add(className);
            setTimeout(() => element.classList.remove(className), duration);
        }

        audio.onended = () => {
            if (mode === 1) audio.play().catch(() => {});
            else window.next();
        };
        audio.ontimeupdate = () => {
            updateProgress();
            if (!audio.paused && audio.duration) {
                updateLyrics();
                applyWhiteToHighlights();
            }
            const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
            const duration = audio.duration || 0;
            const remaining = duration - audio.currentTime;
            timeDisplay.innerText = `${fmt(audio.currentTime)} / ${fmt(duration)} / ${fmt(remaining)}`;
        };
        audio.onerror = () => {
            console.error('音频错误，尝试重载');
            setTimeout(() => { if (audio.src) audio.load(); }, 1000);
        };

        progressBar.addEventListener('mousedown', () => { isDraggingProgress = true; progressFill.classList.remove('playing'); });
        progressBar.addEventListener('touchstart', () => { isDraggingProgress = true; progressFill.classList.remove('playing'); }, { passive: true });
        const endProgressDrag = () => {
            isDraggingProgress = false;
            if (!audio.paused) progressFill.classList.add('playing');
        };
        document.addEventListener('mouseup', endProgressDrag);
        document.addEventListener('touchend', endProgressDrag);
        progressBar.oninput = () => {
            const val = parseFloat(progressBar.value);
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
                progressFill.style.width = val + '%';
            }
        };
        document.getElementById('progress-container').addEventListener('click', function(e) {
            if (e.target === progressBar) return;
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const val = Math.min(1, Math.max(0, x)) * 100;
            progressBar.value = val;
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
                progressFill.style.width = val + '%';
            }
        });

        function closeListImmediate() {
            songListEl.classList.remove('active', 'hiding');
            songListEl.style.visibility = 'hidden';
            songListEl.style.pointerEvents = 'none';
            songListEl.style.animation = 'none';
            void songListEl.offsetWidth;
            songListEl.style.animation = '';
        }
        function closeListWithAnimation() {
            if (songListEl.classList.contains('active')) {
                songListEl.classList.remove('active');
                songListEl.classList.add('hiding');
                const onEnd = () => {
                    songListEl.classList.remove('hiding');
                    songListEl.style.visibility = 'hidden';
                    songListEl.style.pointerEvents = 'none';
                    songListEl.style.animation = '';
                    songListEl.removeEventListener('animationend', onEnd);
                };
                songListEl.addEventListener('animationend', onEnd, { once: true });
            }
        }
        window.toggleList = (e) => {
            e.stopPropagation();
            if (songListEl.classList.contains('active')) {
                closeListWithAnimation();
                return;
            }
            songListEl.classList.remove('hiding');
            const rect = player.getBoundingClientRect();
            const isAbove = rect.top > window.innerHeight / 2;
            songListEl.style.left = rect.left + 'px';
            songListEl.style.top = isAbove ? (rect.top - Math.min(songListEl.scrollHeight + 30, 280) + 'px') : (rect.top + 90 + 'px');
            songListEl.style.visibility = 'visible';
            songListEl.style.pointerEvents = 'auto';
            void songListEl.offsetWidth;
            songListEl.classList.add('active');
        };
        document.addEventListener('click', (e) => {
            if (!player.contains(e.target) && !songListEl.contains(e.target)) {
                if (songListEl.classList.contains('active')) closeListWithAnimation();
            }
        });

        let isDraggingPlayer = false;
        let playerOffsetX = 0, playerOffsetY = 0;
        player.addEventListener('mousedown', (e) => {
            if (e.target.closest('button, input, #main-play-btn, #progress-container')) return;
            isDraggingPlayer = true;
            const rect = player.getBoundingClientRect();
            playerOffsetX = e.clientX - rect.left;
            playerOffsetY = e.clientY - rect.top;
            player.classList.add('dragging');
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingPlayer) return;
            let newLeft = e.clientX - playerOffsetX;
            let newTop = e.clientY - playerOffsetY;
            const w = player.offsetWidth, h = player.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            player.style.left = newLeft + 'px';
            player.style.top = newTop + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (isDraggingPlayer) {
                player.classList.remove('dragging');
                isDraggingPlayer = false;
            }
        });
        player.addEventListener('touchstart', (e) => {
            if (e.target.closest('button, input, #main-play-btn, #progress-container')) return;
            const touch = e.touches[0];
            isDraggingPlayer = true;
            const rect = player.getBoundingClientRect();
            playerOffsetX = touch.clientX - rect.left;
            playerOffsetY = touch.clientY - rect.top;
            player.classList.add('dragging');
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingPlayer) return;
            const touch = e.touches[0];
            let newLeft = touch.clientX - playerOffsetX;
            let newTop = touch.clientY - playerOffsetY;
            const w = player.offsetWidth, h = player.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            player.style.left = newLeft + 'px';
            player.style.top = newTop + 'px';
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', () => {
            if (isDraggingPlayer) {
                player.classList.remove('dragging');
                isDraggingPlayer = false;
            }
        });

        // ---------- 3. 弹窗控制 ----------
        const overlayEl = document.getElementById('modal-overlay');
        const modalEl = document.getElementById('modal');
        const headerEl = document.getElementById('modal-header');
        let isModalOpen = false, isClosing = false;

        window.openModal = function() {
            if (isModalOpen || isClosing) return;
            isModalOpen = true;
            modalEl.classList.remove('closing');
            overlayEl.classList.add('visible');
            document.body.style.overflow = 'hidden';
            syncSwitchUI();
            updateAutoSwitchUI(autoThemeEnabled);
            updateThumbPosition();
        };
        window.closeModal = function() {
            if (!isModalOpen || isClosing) return;
            isClosing = true;
            modalEl.classList.add('closing');
            const onTransitionEnd = () => {
                modalEl.removeEventListener('transitionend', onTransitionEnd);
                overlayEl.classList.remove('visible');
                modalEl.classList.remove('closing');
                isModalOpen = false;
                isClosing = false;
                document.body.style.overflow = '';
            };
            modalEl.addEventListener('transitionend', onTransitionEnd);
            setTimeout(() => {
                if (isClosing) {
                    modalEl.removeEventListener('transitionend', onTransitionEnd);
                    overlayEl.classList.remove('visible');
                    modalEl.classList.remove('closing');
                    isModalOpen = false;
                    isClosing = false;
                    document.body.style.overflow = '';
                }
            }, 500);
        };
        window.closeModalViaOverlay = function(e) {
            if (e.target === overlayEl) closeModal();
        };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isModalOpen) closeModal();
        });

        let isDraggingModal = false;
        let modalOffsetX = 0, modalOffsetY = 0;
        headerEl.addEventListener('mousedown', (e) => {
            if (e.target.closest('.dot, #window-controls')) return;
            if (!isModalOpen) return;
            isDraggingModal = true;
            const rect = modalEl.getBoundingClientRect();
            modalOffsetX = e.clientX - rect.left;
            modalOffsetY = e.clientY - rect.top;
            modalEl.style.cursor = 'grabbing';
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingModal) return;
            let newLeft = e.clientX - modalOffsetX;
            let newTop = e.clientY - modalOffsetY;
            const w = modalEl.offsetWidth, h = modalEl.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            modalEl.style.position = 'fixed';
            modalEl.style.left = newLeft + 'px';
            modalEl.style.top = newTop + 'px';
            modalEl.style.transform = 'none';
            modalEl.style.margin = '0';
        });
        document.addEventListener('mouseup', () => {
            if (isDraggingModal) {
                modalEl.style.cursor = '';
                isDraggingModal = false;
            }
        });
        headerEl.addEventListener('touchstart', (e) => {
            if (e.target.closest('.dot, #window-controls')) return;
            if (!isModalOpen) return;
            const touch = e.touches[0];
            const rect = modalEl.getBoundingClientRect();
            modalOffsetX = touch.clientX - rect.left;
            modalOffsetY = touch.clientY - rect.top;
            isDraggingModal = true;
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingModal) return;
            const touch = e.touches[0];
            let newLeft = touch.clientX - modalOffsetX;
            let newTop = touch.clientY - modalOffsetY;
            const w = modalEl.offsetWidth, h = modalEl.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - w));
            newTop = Math.max(0, Math.min(newTop, window.innerHeight - h));
            modalEl.style.position = 'fixed';
            modalEl.style.left = newLeft + 'px';
            modalEl.style.top = newTop + 'px';
            modalEl.style.transform = 'none';
            modalEl.style.margin = '0';
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', () => {
            isDraggingModal = false;
        });

        // ---------- 4. 主题切换 (暗黑/明亮) ----------
        let currentTheme = 'light';
        let isTransitioning = false;
        const transitionOverlay = document.getElementById('theme-transition-overlay');
        const switchTrack = document.getElementById('switch-track');
        const moonBtn = document.getElementById('moon-btn');
        const sunBtn = document.getElementById('sun-btn');
        const gearBtn = document.getElementById('gear-island');
        const autoSwitchTrack = document.getElementById('auto-switch-track');
        const autoCheckbox = document.getElementById('auto-theme-checkbox');
        let autoThemeEnabled = true;
        let systemThemeListener = null;
        const manualControls = [moonBtn, switchTrack, sunBtn];

        function setManualControlsDisabled(disabled) {
            manualControls.forEach(el => {
                if (disabled) el.classList.add('disabled');
                else el.classList.remove('disabled');
            });
        }

        function applySystemTheme() {
            if (autoThemeEnabled) {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark ? 'dark' : 'light');
            }
        }

        function setupAutoTheme() {
            if (autoThemeEnabled) {
                if (systemThemeListener) systemThemeListener.removeEventListener('change', applySystemTheme);
                systemThemeListener = window.matchMedia('(prefers-color-scheme: dark)');
                systemThemeListener.addEventListener('change', applySystemTheme);
                applySystemTheme();
                setManualControlsDisabled(true);
            } else {
                if (systemThemeListener) {
                    systemThemeListener.removeEventListener('change', applySystemTheme);
                    systemThemeListener = null;
                }
                setManualControlsDisabled(false);
            }
        }

        function setTheme(theme) {
            if (theme === currentTheme || isTransitioning) return;
            const toDark = theme === 'dark';
            const waveColor = toDark ? 'rgba(128,128,128,0.15)' : 'rgba(255,255,255,0.15)';
            const gearRect = gearBtn.getBoundingClientRect();
            const cx = gearRect.left + gearRect.width / 2;
            const cy = gearRect.top + gearRect.height / 2;
            isTransitioning = true;
            const overlay = transitionOverlay;
            overlay.style.background = waveColor;
            overlay.style.clipPath = `circle(0% at ${cx}px ${cy}px)`;
            overlay.classList.add('animating');
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '1';
            void overlay.offsetWidth;
            overlay.style.transition = 'clip-path 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            overlay.style.clipPath = `circle(150% at ${cx}px ${cy}px)`;
            const onTransitionEnd = () => {
                overlay.removeEventListener('transitionend', onTransitionEnd);
                applyTheme(theme);
                overlay.style.transition = 'none';
                overlay.classList.remove('animating');
                overlay.style.visibility = 'hidden';
                overlay.style.opacity = '0';
                overlay.style.clipPath = '';
                overlay.style.background = 'transparent';
                isTransitioning = false;
            };
            overlay.addEventListener('transitionend', onTransitionEnd);
            setTimeout(() => {
                if (isTransitioning) {
                    overlay.removeEventListener('transitionend', onTransitionEnd);
                    applyTheme(theme);
                    overlay.style.transition = 'none';
                    overlay.classList.remove('animating');
                    overlay.style.visibility = 'hidden';
                    overlay.style.opacity = '0';
                    overlay.style.clipPath = '';
                    overlay.style.background = 'transparent';
                    isTransitioning = false;
                }
            }, 1200);
        }

        function toggleTheme() {
            if (isTransitioning || autoThemeEnabled) return;
            const target = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(target);
        }

        function updateSwitchUI(theme) {
            if (theme === 'dark') {
                switchTrack.classList.add('active');
                moonBtn.classList.add('active');
                sunBtn.classList.remove('active');
            } else {
                switchTrack.classList.remove('active');
                moonBtn.classList.remove('active');
                sunBtn.classList.add('active');
            }
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            currentTheme = theme;
            updateSwitchUI(theme);
        }

        function updateAutoSwitchUI(enabled) {
            if (enabled) {
                autoSwitchTrack.classList.add('active');
                autoCheckbox.checked = true;
            } else {
                autoSwitchTrack.classList.remove('active');
                autoCheckbox.checked = false;
            }
            setManualControlsDisabled(enabled);
        }

        autoSwitchTrack.addEventListener('click', function(e) {
            e.stopPropagation();
            const newState = !autoCheckbox.checked;
            autoCheckbox.checked = newState;
            autoThemeEnabled = newState;
            updateAutoSwitchUI(newState);
            setupAutoTheme();
        });

        function initAutoSwitch() {
            autoThemeEnabled = true;
            autoCheckbox.checked = true;
            updateAutoSwitchUI(true);
            setupAutoTheme();
        }

        function syncSwitchUI() {
            updateSwitchUI(currentTheme);
        }

        // ---------- 5. 缩略图切换 + 背景/配色切换 ----------
        // 更新为蝶云.png，移除CD.jpg占位
        const THUMB_IMAGES = ['722264.jpg', 'miku2.jpg', '蝶云.png'];
        const THUMB_TITLES = {
            '722264.jpg': '海边のミク',
            'miku2.jpg': '桜ミク',
            '蝶云.png': '洛天依-蝶变'
        };
        const THUMB_COLORS = {
            '722264.jpg': '#66ccff',
            'miku2.jpg': '#FFC0CB',
            '蝶云.png': '#32CD32'
        };

        let currentThumbIndex = 0;
        let appliedThumbIndex = 0;

        const thumbTrack = document.getElementById('thumb-track');
        const thumbDots = document.getElementById('thumb-dots');
        const thumbPrev = document.getElementById('thumb-prev');
        const thumbNext = document.getElementById('thumb-next');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const applyBtn = document.getElementById('apply-theme-btn');
        const bgOverlay = document.getElementById('bg-transition-overlay');
        const titleText = document.getElementById('title-text');
        const navLinks = document.getElementById('navLinks');

        // 预加载图片：不再使用CD.jpg占位，加载失败则标记为隐藏
        function preloadImages() {
            THUMB_IMAGES.forEach(src => {
                const img = new Image();
                img.onerror = function() {
                    // 图片加载失败，不做任何处理（保持空白）
                    this.style.display = 'none';
                };
                img.src = src;
            });
        }

        function updateThumbPosition() {
            const offset = -currentThumbIndex * 100;
            thumbTrack.style.transform = `translateX(${offset}%)`;
            const dots = thumbDots.querySelectorAll('span');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentThumbIndex);
            });
            const key = THUMB_IMAGES[currentThumbIndex];
            modalSubtitle.textContent = THUMB_TITLES[key] || '主题';
            const color = THUMB_COLORS[key];
            dots.forEach((dot, i) => {
                if (i === currentThumbIndex) {
                    dot.style.background = color;
                } else {
                    dot.style.background = 'rgba(255,255,255,0.25)';
                }
            });
        }

        function goToThumb(index) {
            if (index < 0) index = THUMB_IMAGES.length - 1;
            if (index >= THUMB_IMAGES.length) index = 0;
            currentThumbIndex = index;
            updateThumbPosition();
        }

        // ----- 单独的函数：将高亮元素设为白色（对比色） -----
        function applyWhiteToHighlights() {
            document.querySelectorAll('#lyrics-island .lyrics-line.current').forEach(el => {
                el.style.color = '#fff';
                el.style.textShadow = '0 0 16px rgba(255,255,255,0.6)';
            });
            if (songInfoEl) songInfoEl.style.color = '#fff';
            document.querySelectorAll('.song-item.active-song .song-name').forEach(el => {
                el.style.color = '#fff';
            });
            if (applyBtn) applyBtn.style.color = '#fff';
        }

        // ----- 应用主题配色 (不覆盖白色控制按钮和天气/时间) -----
        function applyColorScheme(color) {
            titleText.style.color = color;
            navLinks.querySelectorAll('a').forEach(a => {
                a.style.color = color;
            });
            mainPlayBtn.style.background = color;
            document.documentElement.style.setProperty('--play-btn-bg', color);
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--nav-link-color', color);

            document.querySelectorAll('#lyrics-island .lyrics-line:not(.current)').forEach(line => {
                line.style.color = color;
                if (line.classList.contains('prev') || line.classList.contains('next')) {
                    line.style.opacity = '0.6';
                } else if (line.classList.contains('placeholder')) {
                    line.style.opacity = '0.5';
                }
            });
            document.querySelectorAll('#song-list .song-item:not(.active-song) .song-name').forEach(el => {
                el.style.color = color;
            });
            progressFill.style.background = `linear-gradient(90deg, ${color}, #88ddff, ${color})`;
            applyBtn.style.background = color;
            const switchTrackActive = document.querySelector('.switch-track.active');
            if (switchTrackActive) {
                switchTrackActive.style.background = color;
                switchTrackActive.style.borderColor = color;
            }
            const autoSwitchTrackActive = document.querySelector('.auto-switch-track.active');
            if (autoSwitchTrackActive) {
                autoSwitchTrackActive.style.background = color;
                autoSwitchTrackActive.style.borderColor = color;
            }
            applyWhiteToHighlights();
        }

        // ----- 根据主题 key 应用主题 (用于初始化) -----
        function applyThemeByKey(key) {
            const index = THUMB_IMAGES.indexOf(key);
            if (index === -1) {
                key = '722264.jpg';
            }
            const color = THUMB_COLORS[key];
            const title = THUMB_TITLES[key];
            // 背景切换：不使用CD.jpg回退，若图片加载失败则保留原背景
            const imgTest = new Image();
            imgTest.onload = function() {
                document.body.style.backgroundImage = `url('${key}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
            };
            imgTest.onerror = function() {
                // 加载失败，保留原有背景，不做回退
                console.warn('背景图片加载失败:', key);
            };
            imgTest.src = key;
            // 立即应用配色，背景稍后加载
            applyColorScheme(color);
            currentThumbIndex = THUMB_IMAGES.indexOf(key);
            appliedThumbIndex = currentThumbIndex;
            updateThumbPosition();
            setCookie('theme_key', key, 30);
            modalSubtitle.textContent = title;
        }

        // ----- 应用当前选中的主题 (背景+配色) -----
        function applyCurrentTheme() {
            const key = THUMB_IMAGES[currentThumbIndex];
            const color = THUMB_COLORS[key];
            const title = THUMB_TITLES[key];

            if (appliedThumbIndex === currentThumbIndex) return;

            bgOverlay.style.backgroundImage = `url('${key}')`;
            bgOverlay.style.opacity = '0';
            bgOverlay.classList.add('active');
            void bgOverlay.offsetWidth;
            bgOverlay.style.opacity = '1';

            applyColorScheme(color);

            const dots = thumbDots.querySelectorAll('span');
            dots.forEach((dot, i) => {
                if (i === currentThumbIndex) {
                    dot.style.background = color;
                } else {
                    dot.style.background = 'rgba(255,255,255,0.25)';
                }
            });

            setTimeout(() => {
                // 尝试加载新背景，若失败则保留当前背景（不替换）
                const imgTest = new Image();
                imgTest.onload = function() {
                    document.body.style.backgroundImage = `url('${key}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundRepeat = 'no-repeat';
                };
                imgTest.onerror = function() {
                    // 加载失败，保留当前背景
                    console.warn('背景图片加载失败:', key);
                };
                imgTest.src = key;

                bgOverlay.style.opacity = '0';
                setTimeout(() => {
                    bgOverlay.classList.remove('active');
                    bgOverlay.style.backgroundImage = '';
                }, 1200);

                appliedThumbIndex = currentThumbIndex;
                modalSubtitle.textContent = `✓ ${title}`;
                setTimeout(() => {
                    if (currentThumbIndex === appliedThumbIndex) {
                        modalSubtitle.textContent = title;
                    }
                }, 1500);

                setCookie('theme_key', key, 30);
            }, 300);
        }

        // ----- 初始化默认主题 (从 Cookie 或默认) -----
        function initDefaultTheme() {
            const savedKey = getCookie('theme_key');
            if (savedKey && THUMB_IMAGES.includes(savedKey)) {
                applyThemeByKey(savedKey);
            } else {
                applyThemeByKey('722264.jpg');
            }
        }

        // ---------- 6. 歌词岛位置自适应 ----------
        function adjustLyricsIslandPosition() {
            const timeInfo = document.getElementById('top-right-info');
            if (!timeInfo) return;
            const rect = timeInfo.getBoundingClientRect();
            const island = document.getElementById('lyrics-island');
            if (!island) return;
            island.style.top = rect.top + 'px';
            island.style.right = (window.innerWidth - rect.left + 12) + 'px';
        }

        // ---------- 7. 事件绑定 ----------
        thumbPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            goToThumb(currentThumbIndex - 1);
        });
        thumbNext.addEventListener('click', (e) => {
            e.stopPropagation();
            goToThumb(currentThumbIndex + 1);
        });
        thumbDots.querySelectorAll('span').forEach((dot, i) => {
            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                goToThumb(i);
            });
        });
        applyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            applyCurrentTheme();
        });
        document.addEventListener('keydown', (e) => {
            if (isModalOpen) {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToThumb(currentThumbIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToThumb(currentThumbIndex + 1);
                } else if (e.key === 'Enter' && !e.target.closest('input, textarea, button')) {
                    applyCurrentTheme();
                }
            }
        });

        // ---------- 8. 初始化 — 尽早执行 ----------
        document.addEventListener('DOMContentLoaded', function() {
            preloadImages();
            initDefaultTheme();
            setTimeout(adjustLyricsIslandPosition, 50);
        });

        window.addEventListener('load', async function() {
            try {
                await buildSongListFromProxy();
                await preloadAllCovers();
                const src = songs[0];
                audio.src = src;
                audio.load();
                document.getElementById('mode-icon').innerHTML = iconMap[0];
                setPlayingState(false);
                updateProgress();
                initAutoSwitch();
                const cachedUrl = coverCache[src];
                coverImg.src = cachedUrl || 'CD.jpg'; // 专辑封面用CD.jpg占位
                const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
                timeDisplay.innerText = `00:00 / ${fmt(0)} / 00:00`;
                highlightCurrentSong();
                updateSongInfo();
                loadLyrics(src);
                setTimeout(adjustLyricsIslandPosition, 100);
                applyWhiteToHighlights();
            } catch (err) {
                console.warn('初始化失败，使用备用', err);
                await buildSongListFromProxy();
                const src = songs[0];
                audio.src = src;
                audio.load();
                document.getElementById('mode-icon').innerHTML = iconMap[0];
                setPlayingState(false);
                updateProgress();
                initAutoSwitch();
                coverImg.src = 'CD.jpg';
                const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
                timeDisplay.innerText = `00:00 / ${fmt(0)} / 00:00`;
                highlightCurrentSong();
                updateSongInfo();
                loadLyrics(src);
                setTimeout(adjustLyricsIslandPosition, 100);
                applyWhiteToHighlights();
            }
        });

        const _loadAndPlay = loadAndPlay;
        loadAndPlay = function() {
            _loadAndPlay();
            setTimeout(adjustLyricsIslandPosition, 100);
            applyWhiteToHighlights();
        };

        console.log('🎵 播放器已启动，蝶云.png 已替换，CD.jpg 仅用于专辑封面 ✦');
    </script>
</body>
</html>
