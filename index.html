<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes"/>
<meta name="referrer" content="no-referrer"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh https://cdn.jsdelivr.net https://unpkg.com https://cdn.skypack.dev; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' https: http: blob:; connect-src 'self' https: http:;">
<title>bxfans ~~~ 幻想的な星明かり ~~~~</title>
<link rel="icon" href="dd3.svg"/>
<style>
@font-face{
  font-family:'悠哉字体 Light';
  src:url('Yozai-Light.woff2') format('woff2');
  font-display:swap;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'悠哉字体 Light','Hiragino Kaku Gothic ProN','Hiragino Sans','Microsoft JhengHei',sans-serif;
  background:#0b0e1a;color:#fff;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --glass-mult:1;
  --glass-shadow-mult:1;
  --glass-backdrop:blur(40px) saturate(200%) brightness(1.05);
  --bg-blur: 0px; /* 默认背景虚化为 0 */
}

/* ============ 应用容器 ============ */
#pc-app,#mobile-app{
  position:fixed;inset:0;width:100%;height:100%;
  overflow:hidden;transition:opacity .4s ease;
}
#pc-app{z-index:10;opacity:1;display:block}
#mobile-app{z-index:20;opacity:0;display:none}
.mode-mobile #pc-app{opacity:0;pointer-events:none;display:none}
.mode-mobile #mobile-app{opacity:1;display:flex}

/* ============ 默认 Glass 变量 ============ */
#pc-app{
  --accent:#66ccff;
  --progress-height:2px;
  --glass-bg1:rgba(255,255,255,calc(.095 * var(--glass-mult)));
  --glass-bg2:rgba(255,255,255,calc(.042 * var(--glass-mult)));
  --glass-bg3:rgba(255,255,255,calc(.063 * var(--glass-mult)));
  --glass-border:rgba(255,255,255,calc(.45 * var(--glass-mult)));
  --glass-shadow:
    0 calc(16px * var(--glass-shadow-mult)) calc(48px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.30 * var(--glass-shadow-mult))),
    0 calc(4px * var(--glass-shadow-mult)) calc(12px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.18 * var(--glass-shadow-mult)));
  --text-color:#fff;
  --nav-link-color:#66ccff;
  --play-btn-bg:#66ccff;
}
#pc-app[data-theme="dark"]{
  --glass-bg1:rgba(0,0,0,calc(.45 * var(--glass-mult)));
  --glass-bg2:rgba(0,0,0,calc(.25 * var(--glass-mult)));
  --glass-bg3:rgba(0,0,0,calc(.35 * var(--glass-mult)));
  --glass-border:rgba(255,255,255,calc(.15 * var(--glass-mult)));
  --glass-shadow:
    0 calc(16px * var(--glass-shadow-mult)) calc(48px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.65 * var(--glass-shadow-mult))),
    0 calc(4px * var(--glass-shadow-mult)) calc(12px * var(--glass-shadow-mult)) rgba(0,0,0,calc(.40 * var(--glass-shadow-mult)));
  --text-color:#e0e0e0;
}

/* ============ 背景层 ============ */
#pc-app{
  background:url('741383.png') center/cover no-repeat;
  transition:filter 1.2s ease;position:relative;
}
#pc-app::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
  background:rgba(0,0,0,.30);
  backdrop-filter:brightness(.86) saturate(.92) blur(var(--bg-blur, 0px));
  -webkit-backdrop-filter:brightness(.86) saturate(.92) blur(var(--bg-blur, 0px));
  transition:background 1.2s ease,backdrop-filter 1.2s ease;
}
#pc-app[data-theme="dark"]::before{
  background:rgba(0,0,0,.55);
  backdrop-filter:brightness(.65) saturate(.78) blur(var(--bg-blur, 0px));
  -webkit-backdrop-filter:brightness(.65) saturate(.78) blur(var(--bg-blur, 0px));
}

/* ============ 通用面板 ============ */
#pc-app .liquid-glass,
#pc-app #top-right-info,
#pc-app #lyrics-island,
#pc-app #pc-search-container,
#pc-app #gear-island,
#pc-app #modal,
#pc-app #github-island,
#mobile-app #mobile-search-container,
#mobile-app #mobile-github-island{
  backdrop-filter:var(--glass-backdrop);
  -webkit-backdrop-filter:var(--glass-backdrop);
  box-shadow:var(--glass-shadow);
}
#pc-app .liquid-glass{
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);
}

/* ============ 右上信息 ============ */
#pc-app #top-right-info{
  position:fixed;top:16px;right:16px;z-index:1200;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  padding:12px 18px;border-radius:20px;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);min-width:110px;pointer-events:none;
}
#pc-app #top-right-info .time{font-size:1.2rem;letter-spacing:1px;font-weight:500;color:#fff!important}
#pc-app #top-right-info .weather{display:flex;align-items:center;gap:8px;font-size:.95rem;color:#fff!important}
#pc-app #top-right-info .weather-icon{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#pc-app #top-right-info .weather-icon img{width:100%;height:100%;display:block;object-fit:contain}
#pc-app #top-right-info .weather-icon svg{width:100%;height:100%;display:block}
#pc-app #top-right-info .weather-temp{font-size:1.1rem;font-weight:500}
#pc-app #top-right-info .weather-desc{font-size:.75rem;opacity:.85;margin-left:2px}

/* ============ 歌词岛 ============ */
#pc-app #lyrics-island{
  position:fixed;top:16px;right:146px;z-index:1150;
  padding:10px 16px;min-width:180px;max-width:280px;border-radius:20px;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.6;text-align:center;opacity:.95;
}
#pc-app #lyrics-island .lyrics-line{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
  transition:font-size .2s ease,opacity .2s ease,color .6s ease;
}
#pc-app #lyrics-island .lyrics-line.current{font-size:1.3rem;font-weight:500}
#pc-app #lyrics-island .lyrics-line.prev,
#pc-app #lyrics-island .lyrics-line.next{font-size:.9rem;opacity:.75}
#pc-app #lyrics-island .lyrics-line.placeholder{font-size:.9rem;opacity:.65;font-style:italic}

/* ============ 播放器基础 ============ */
#pc-app #player{
  position:fixed;top:130px;left:20px;width:350px;border-radius:24px;
  padding:14px 16px;z-index:1000;display:flex;align-items:center;gap:14px;
  cursor:grab;touch-action:none;
}
#pc-app #player.dragging{cursor:grabbing;z-index:1002!important}
#pc-app #art-box{
  position:relative;width:56px;height:56px;border-radius:12px;
  overflow:hidden;flex-shrink:0;background:#222;
}
#pc-app #art-box img{width:100%;height:100%;object-fit:cover;display:block}
#pc-app .control-area{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;justify-content:center}
#pc-app .song-info{
  font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.4;padding:0 2px;letter-spacing:.3px;
}

/* ============ 进度条基础 ============ */
#pc-app #progress-container{
  position:relative;width:100%;height:var(--progress-height);
  border-radius:calc(var(--progress-height)/2);
  background:rgba(255,255,255,.22);cursor:pointer;touch-action:none;
}
#pc-app #progress-fill{
  position:absolute;top:0;left:0;height:100%;width:0%;
  border-radius:calc(var(--progress-height)/2);
  background:linear-gradient(90deg,var(--accent),#88ddff,var(--accent));
  background-size:200% 100%;will-change:width;
}
#pc-app #progress-fill.playing{
  animation:flowGradient 1.8s linear infinite,pulseGlow 1.2s ease-in-out infinite;
}
@keyframes flowGradient{0%{background-position:0% 0%}100%{background-position:200% 0%}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 6px rgba(102,204,255,.4)}
  50%{box-shadow:0 0 16px rgba(102,204,255,.8),0 0 30px rgba(102,204,255,.3)}
}

#pc-app #progress-container .progress-thumb{
  position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;
  background:var(--accent,#66ccff);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.85),
    0 2px 6px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);pointer-events:none;
  transition:left .06s linear,width .18s ease,height .18s ease,box-shadow .2s ease;
  z-index:3;will-change:left;
}
#pc-app #progress-container.dragging .progress-thumb,
#pc-app #progress-container:hover .progress-thumb{
  width:16px;height:16px;
  box-shadow:
    0 0 0 2.5px rgba(255,255,255,.95),
    0 3px 8px rgba(0,0,0,.30);
}

#pc-app #progress{
  position:absolute;top:0;left:0;width:100%;height:100%;
  opacity:0;cursor:pointer;z-index:2;margin:0;padding:0;touch-action:none;
}
#pc-app #time-display{
  font-size:10px;text-align:right;font-variant-numeric:tabular-nums;
  opacity:.9;padding:0 2px;letter-spacing:.2px;color:#fff!important;
}
#pc-app .controls{display:flex;justify-content:space-between;align-items:center;padding-top:2px}

#wave-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;display:none;
}

/* MD3E 专属装饰元素 */
.md3e-deco{display:none;}

/* ============ 播放列表 ============ */
#pc-app #song-list{
  position:fixed;width:380px;max-height:260px;border-radius:20px;
  overflow-y:auto;z-index:999;padding:8px 0;
  visibility:hidden;pointer-events:none;opacity:0;
  transform:scale(.92) translateY(-8px);transform-origin:top center;
  will-change:transform,opacity;
}
#pc-app #song-list.active{
  visibility:visible;pointer-events:auto;
  animation:listPopIn .35s cubic-bezier(.34,1.56,.64,1) forwards;
}
#pc-app #song-list.hiding{animation:listPopOut .25s ease-in forwards}
#pc-app #song-list.list-above{transform-origin:bottom center}
#pc-app #song-list.list-above.active{
  animation:listPopInAbove .35s cubic-bezier(.34,1.56,.64,1) forwards;
}
#pc-app #song-list.list-above.hiding{
  animation:listPopOutAbove .25s ease-in forwards;
}
@keyframes listPopIn{
  0%{opacity:0;transform:scale(.85) translateY(-12px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes listPopOut{
  0%{opacity:1;transform:scale(1) translateY(0)}
  100%{opacity:0;transform:scale(.9) translateY(-8px)}
}
@keyframes listPopInAbove{
  0%{opacity:0;transform:scale(.85) translateY(12px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes listPopOutAbove{
  0%{opacity:1;transform:scale(1) translateY(0)}
  100%{opacity:0;transform:scale(.9) translateY(8px)}
}
#pc-app .song-item{
  padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.08);
  cursor:pointer;font-size:14px;transition:background .2s,border-left .2s;
  border-left:3px solid transparent;display:flex;align-items:center;gap:10px;
}
#pc-app .song-item:hover{background:rgba(255,255,255,.08)}
#pc-app .song-item .song-index{font-size:11px;opacity:.55;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
#pc-app .song-item .song-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pc-app .song-item .song-artist{font-size:12px;opacity:.75;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}
#pc-app .song-item.active-song{background:rgba(102,204,255,.18);border-left-color:var(--accent)}
#pc-app .song-item.active-song .song-name{color:#fff}
#pc-app #song-list::-webkit-scrollbar{width:4px}
#pc-app #song-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}

/* ============ 导航岛 ============ */
#pc-app .nav-links{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  display:flex;gap:32px;padding:14px 36px;border-radius:50px;z-index:50;
  flex-wrap:wrap;justify-content:center;
}
#pc-app .nav-links a{
  text-decoration:none;font-weight:bold;white-space:nowrap;
  pointer-events:auto;color:var(--nav-link-color);
}
#pc-app .nav-links a:hover{opacity:.8}

/* ============ GitHub 岛 ============ */
#pc-app #github-island{
  position:fixed;left:32px;bottom:40px;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  z-index:50;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);transition:transform .25s ease;
  text-decoration:none;
}
#pc-app #github-island:hover{transform:scale(1.1) rotate(-6deg)}
#pc-app #github-island svg{width:28px;height:28px;fill:rgba(255,255,255,.92)}

/* ============ 底部小字 ============ */
#pc-app #pc-footer{
  position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:50;
  font-size:.7rem;letter-spacing:.1em;color:rgba(255,255,255,.5);
  text-align:center;pointer-events:none;
  transition:color .3s ease;
}
#pc-app #pc-footer .pc-footer-title{margin-bottom:2px}

/* ============ 搜索框 ============ */
#pc-app #pc-search-container{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:49;
  width:min(720px,90vw);max-width:760px;border-radius:28px;
  padding:4px 6px 4px 22px;display:flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1.5px solid var(--glass-border);min-height:52px;
}
#pc-app #pc-search-container .search-icon{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:22px;height:22px;color:rgba(255,255,255,.62);
}
#pc-app #pc-search-container .search-icon svg{
  width:100%;height:100%;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
#pc-app #pc-search-input{
  flex:1;background:transparent;border:none;outline:none;color:#fff;
  font-size:clamp(15px,2.2vw,20px);font-family:inherit;
  padding:12px 4px;min-width:0;letter-spacing:.4px;
}
#pc-app #pc-search-input::placeholder{color:rgba(255,255,255,.5);font-weight:300}
#pc-app .clear-btn{
  background:none;border:none;color:rgba(255,255,255,.6);
  font-size:22px;cursor:pointer;padding:0 6px;
  display:flex;align-items:center;justify-content:center;
  height:100%;flex-shrink:0;width:32px;
}
#pc-app .pc-search-btn{
  flex-shrink:0;border:none;border-radius:24px;padding:10px 24px;
  background:rgba(102,204,255,.20);color:#fff;
  font-size:clamp(14px,1.6vw,17px);font-family:inherit;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
#pc-app .pc-search-btn svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}

/* ============ 齿轮按钮 ============ */
#pc-app #gear-island{
  position:fixed;right:32px;bottom:120px;width:62px;height:62px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1100;
  background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);
  transform-origin:center;will-change:transform;
  transition:
    transform .3s cubic-bezier(.22,1,.36,1),
    box-shadow .3s ease,
    background .6s ease,
    border-color .6s ease;
}
#pc-app #gear-island:hover{
  transform:scale(1.06) rotate(3deg);
  box-shadow:
    var(--glass-shadow),
    0 0 16px rgba(102,204,255,.22);
}
#pc-app #gear-island:active{
  transform:scale(0.94) rotate(-3deg);
  transition-duration:.1s;
  box-shadow:
    var(--glass-shadow),
    0 0 8px rgba(102,204,255,.42),
    inset 0 2px 6px rgba(0,0,0,.18);
}
#pc-app #gear-island svg{
  width:32px;height:32px;
  color:rgba(255,255,255,.92);
  transition:transform .35s cubic-bezier(.22,1,.36,1);
  transform-origin:center;
}
#pc-app #gear-island:hover svg{transform:rotate(30deg)}
#pc-app #gear-island.gear-spin{animation:gearClickSpin .5s cubic-bezier(.22,1,.36,1)}
@keyframes gearClickSpin{
  0%   {transform:scale(1) rotate(0deg)}
  45%  {transform:scale(1.04) rotate(55deg)}
  100% {transform:scale(1) rotate(0deg)}
}
#pc-app #gear-island.gear-spin svg{animation:gearSvgSpin .5s cubic-bezier(.22,1,.36,1)}
@keyframes gearSvgSpin{
  0%   {transform:rotate(0deg)}
  50%  {transform:rotate(60deg)}
  100% {transform:rotate(0deg)}
}
#pc-app #gear-island::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,
    color-mix(in srgb,var(--accent,#66ccff) 55%,transparent) 0%,
    transparent 70%);
  opacity:0;transform:scale(.75);
}
#pc-app #gear-island.gear-pulse::after{animation:gearPulse .5s ease-out}
@keyframes gearPulse{
  0%   {opacity:.55;transform:scale(.85)}
  100% {opacity:0;transform:scale(1.55)}
}

/* ============ 弹窗 ============ */
#pc-app #modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .25s ease,visibility .25s ease;
}
#pc-app #modal-overlay.visible{pointer-events:auto;opacity:1;visibility:visible}
#pc-app #modal{
  position:relative;width:600px;max-width:94vw;
  height:min(640px,88vh);min-height:0;max-height:none;
  border-radius:28px;padding:22px 28px 24px 28px;
  display:flex;flex-direction:column;
  background:linear-gradient(145deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  transform:scale(.92) translateY(12px);opacity:0;
  transition:transform .38s cubic-bezier(.1,.9,.2,1),opacity .32s cubic-bezier(.1,.9,.2,1);
  pointer-events:auto;
}
#pc-app #modal-overlay.visible #modal{transform:scale(1) translateY(0);opacity:1}
#pc-app #modal.closing{transform:scale(.92) translateY(12px)!important;opacity:0!important}

#pc-app .modal-header{
  display:flex;align-items:center;justify-content:center;position:relative;
  flex-shrink:0;padding:4px 0 6px 0;min-height:44px;cursor:grab;
}
#pc-app .modal-header:active{cursor:grabbing}
#pc-app #window-controls{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  display:flex;gap:8px;align-items:center;
}
#pc-app .dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0}
#pc-app .dot.red{background:radial-gradient(circle at 35% 35%,#ff6b6b,#d32f2f);cursor:pointer}
#pc-app .dot.yellow{background:radial-gradient(circle at 35% 35%,#ffd93d,#f9a825)}
#pc-app .dot.green{background:radial-gradient(circle at 35% 35%,#6bcf7f,#2e7d32)}
#pc-app .modal-title{
  font-size:1.1rem;font-weight:500;color:var(--text-color);
  letter-spacing:2px;text-align:center;
}
#pc-app .modal-subtitle{
  text-align:center;font-size:.9rem;color:var(--text-color);opacity:.8;
  letter-spacing:3px;padding:4px 0 12px 0;min-height:28px;
}
#pc-app .modal-body{display:flex;flex:1;gap:18px;padding:4px 0 0 0;min-height:0}
#pc-app .modal-sidebar{
  position:relative;display:flex;flex-direction:column;gap:14px;
  padding:8px 6px;flex-shrink:0;
  background:rgba(255,255,255,calc(.04 * var(--glass-mult)));
  border-radius:16px;border:1px solid rgba(255,255,255,calc(.10 * var(--glass-mult)));
  overflow:visible;
}
#pc-app .sidebar-icon{
  position:relative;z-index:1;width:42px;height:42px;border-radius:12px;
  background:transparent;border:1px solid transparent;
  color:rgba(255,255,255,.68);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;outline:none;
}
#pc-app .sidebar-icon svg{width:24px;height:24px}
#pc-app .sidebar-icon:hover{
  color:#fff;
  background:rgba(255,255,255,calc(.10 * var(--glass-mult)));
}
#pc-app .sidebar-icon.active{color:#fff}

#pc-app .sidebar-icon[data-tooltip]::after{
  content:attr(data-tooltip);
  position:absolute;
  left:calc(100% + 12px);top:50%;
  transform:translateY(-50%) translateX(-6px) scale(.94);
  transform-origin:left center;
  background:rgba(18,20,30,.90);color:#fff;
  font-size:.72rem;font-weight:400;letter-spacing:.6px;line-height:1;
  padding:7px 12px;border-radius:9px;white-space:nowrap;
  pointer-events:none;opacity:0;visibility:hidden;z-index:30;
  box-shadow:0 6px 22px rgba(0,0,0,.38);
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.34,1.56,.64,1),
             visibility .18s ease;
}
#pc-app .sidebar-icon[data-tooltip]:hover::after,
#pc-app .sidebar-icon[data-tooltip]:focus-visible::after{
  opacity:1;visibility:visible;
  transform:translateY(-50%) translateX(0) scale(1);
}

#pc-app .sidebar-indicator{
  position:absolute;left:6px;top:8px;width:42px;height:42px;border-radius:12px;
  background:rgba(102,204,255,.22);border:1px solid var(--accent,#66ccff);
  box-shadow:0 4px 16px rgba(102,204,255,.30);
  pointer-events:none;z-index:0;
  transition:top .45s cubic-bezier(.34,1.56,.64,1),left .45s cubic-bezier(.34,1.56,.64,1),
             width .45s cubic-bezier(.34,1.56,.64,1),height .45s cubic-bezier(.34,1.56,.64,1);
}
#pc-app .modal-content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#pc-app .tab-panel{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#pc-app .tab-panel[hidden]{display:none}

/* 堆叠卡片轮播 */
#pc-app .thumb-carousel{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;padding:10px 0 14px 0;
}
#pc-app .thumb-carousel .thumb-row{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
#pc-app .thumb-carousel .thumb-wrapper{
  position:relative;width:320px;height:220px;
  overflow:visible;
}
#pc-app .thumb-carousel .thumb-track{
  position:relative;width:100%;height:100%;
}
#pc-app .thumb-carousel .thumb-track img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;flex-shrink:0;display:block;
  border-radius:18px;
  box-shadow:0 8px 32px rgba(0,0,0,.30);
  transition:transform .45s cubic-bezier(.25,.46,.45,.94), opacity .45s ease, z-index .45s ease;
  will-change:transform, opacity;
}
#pc-app .thumb-carousel .thumb-arrow{display:none;}
#pc-app .thumb-carousel .thumb-dots{
  display:flex;gap:10px;justify-content:center;flex-shrink:0;flex-wrap:wrap;margin-top:10px;
}
#pc-app .thumb-carousel .thumb-dots span{
  width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);
  transition:background .3s ease,transform .3s ease;cursor:pointer;
}
#pc-app .thumb-carousel .thumb-dots span.active{background:var(--accent,#66ccff);transform:scale(1.2)}
#pc-app .thumb-carousel .apply-btn{
  padding:8px 32px;border-radius:30px;border:none;
  background:var(--accent,#66ccff);color:#fff;font-size:.95rem;font-weight:500;
  cursor:pointer;letter-spacing:1px;flex-shrink:0;font-family:inherit;
}

#pc-app .personalize-scroll{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:14px;
  padding:2px 6px 4px 2px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.22) transparent;
}
#pc-app .personalize-scroll::-webkit-scrollbar{width:5px}
#pc-app .personalize-scroll::-webkit-scrollbar-track{background:transparent}
#pc-app .personalize-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
#pc-app .personalize-scroll .settings-card{margin-bottom:0;flex-shrink:0}
#pc-app .tab-panel[data-panel="personalize"] .thumb-carousel{
  flex:0 0 auto;gap:14px;padding:4px 0 4px 0;
}

#pc-app .custom-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
#pc-app .custom-input{
  flex:1 1 170px;min-width:0;
  background:rgba(255,255,255,calc(.07 * var(--glass-mult)));
  border:1px solid rgba(255,255,255,calc(.18 * var(--glass-mult)));
  border-radius:12px;padding:10px 14px;
  color:#fff;font-family:inherit;font-size:.84rem;letter-spacing:.3px;
  outline:none;
  transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;
}
#pc-app .custom-input::placeholder{color:rgba(255,255,255,.42)}
#pc-app .custom-input:focus{
  border-color:var(--accent,#66ccff);
  background:rgba(255,255,255,calc(.11 * var(--glass-mult)));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#66ccff) 22%,transparent);
}

#pc-app .pill-btn{
  flex-shrink:0;padding:10px 20px;border-radius:9999px;
  font-family:inherit;font-size:.82rem;letter-spacing:1px;
  cursor:pointer;white-space:nowrap;
  background:rgba(255,255,255,calc(.12 * var(--glass-mult)));
  border:1px solid rgba(255,255,255,calc(.16 * var(--glass-mult)));
  color:rgba(255,255,255,.9);
  transition:background .25s ease,color .25s ease,border-color .25s ease,
             transform .2s ease,filter .2s ease;
}
#pc-app .pill-btn:hover{background:rgba(255,255,255,calc(.20 * var(--glass-mult)))}
#pc-app .pill-btn:active{transform:scale(.95)}
#pc-app .pill-btn.primary{
  background:var(--accent,#66ccff);
  border-color:var(--accent,#66ccff);
  color:#fff;
}
#pc-app .pill-btn.primary:hover{filter:brightness(1.1)}

#pc-app .file-label{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:9999px;
  font-size:.82rem;letter-spacing:1px;
  background:rgba(255,255,255,calc(.12 * var(--glass-mult)));
  border:1px solid rgba(255,255,255,calc(.16 * var(--glass-mult)));
  color:rgba(255,255,255,.9);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:background .25s ease,transform .2s ease;
}
#pc-app .file-label:hover{background:rgba(255,255,255,calc(.20 * var(--glass-mult)))}
#pc-app .file-label:active{transform:scale(.95)}
#pc-app .file-label svg{flex-shrink:0}

#pc-app .custom-status{
  font-size:.72rem;color:rgba(255,255,255,.55);
  letter-spacing:.5px;line-height:1.5;min-height:1em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px;
}

#pc-app input[type="color"].color-picker{
  -webkit-appearance:none;appearance:none;
  width:42px;height:42px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.42);
  background:transparent;padding:0;cursor:pointer;flex-shrink:0;
  position:relative;
  box-shadow:
    0 4px 14px rgba(0,0,0,.24),
    0 0 0 4px rgba(255,255,255,.06),
    inset 0 1px 2px rgba(255,255,255,.38),
    inset 0 -2px 4px rgba(0,0,0,.16);
  transition:
    transform .25s cubic-bezier(.34,1.56,.64,1),
    border-color .25s ease,
    box-shadow .25s ease;
}
#pc-app input[type="color"].color-picker:hover{
  transform:scale(1.08);
  border-color:rgba(255,255,255,.78);
  box-shadow:
    0 6px 20px rgba(0,0,0,.30),
    0 0 0 4px rgba(255,255,255,.10),
    0 0 22px color-mix(in srgb, var(--accent,#66ccff) 38%, transparent),
    inset 0 1px 2px rgba(255,255,255,.55);
}
#pc-app input[type="color"].color-picker:active{transform:scale(.94);transition-duration:.08s}
#pc-app input[type="color"].color-picker::-webkit-color-swatch-wrapper{padding:0}
#pc-app input[type="color"].color-picker::-webkit-color-swatch{border:none;border-radius:50%}
#pc-app input[type="color"].color-picker::-moz-color-swatch{border:none;border-radius:50%}

#pc-app .color-swatches{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0;
}
#pc-app .color-swatch{
  width:30px;height:30px;border-radius:50%;
  border:2px solid rgba(255,255,255,.28);
  padding:0;cursor:pointer;flex-shrink:0;position:relative;
  box-shadow:
    0 2px 8px rgba(0,0,0,.22),
    inset 0 1px 1px rgba(255,255,255,.35),
    inset 0 -1px 2px rgba(0,0,0,.16);
  transition:
    transform .22s cubic-bezier(.34,1.56,.64,1),
    border-color .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}
#pc-app .color-swatch:hover{
  transform:scale(1.16);
  border-color:rgba(255,255,255,.60);
  filter:brightness(1.12) saturate(1.08);
  box-shadow:
    0 4px 14px rgba(0,0,0,.28),
    0 0 14px rgba(255,255,255,.38),
    inset 0 1px 1px rgba(255,255,255,.55);
}
#pc-app .color-swatch.active{
  border-color:#fff;transform:scale(1.10);
  filter:brightness(1.06);
  box-shadow:
    0 0 0 2.5px rgba(255,255,255,.30),
    0 4px 14px rgba(0,0,0,.28),
    0 0 16px rgba(255,255,255,.30),
    inset 0 1px 2px rgba(255,255,255,.60);
}

#pc-app .visual-style-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
#pc-app .visual-style-btn{
  padding:9px 26px;border-radius:9999px;
  border:1px solid rgba(255,255,255,calc(.25 * var(--glass-mult)));
  background:rgba(255,255,255,calc(.08 * var(--glass-mult)));
  color:rgba(255,255,255,.82);font-family:inherit;font-size:.88rem;
  cursor:pointer;letter-spacing:1px;outline:none;
}
#pc-app .visual-style-btn.active{
  background:var(--accent,#66ccff);border-color:var(--accent,#66ccff);color:#fff;
}

#pc-app .settings-container{
  flex:1;display:flex;flex-direction:column;gap:0;padding:6px 4px;
  min-height:0;overflow-y:auto;
}
#pc-app .settings-card{
  background:rgba(255,255,255,calc(.05 * var(--glass-mult)));
  border:1px solid rgba(255,255,255,calc(.10 * var(--glass-mult)));
  border-radius:18px;padding:18px 20px 20px 20px;
  display:flex;flex-direction:column;gap:8px;flex-shrink:0;
  margin-bottom:14px;overflow:hidden;max-height:500px;
  transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .35s ease,
             padding .4s cubic-bezier(.2,.8,.2,1),margin .45s cubic-bezier(.2,.8,.2,1);
}
#pc-app .settings-card:last-child{margin-bottom:0}
#pc-app .settings-card.collapsed{
  max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-bottom:0;
  border-top-width:0;border-bottom-width:0;pointer-events:none;
}
#pc-app .settings-card-title{
  font-size:.95rem;font-weight:500;letter-spacing:2px;color:#fff;margin:0;
}
#pc-app .settings-card-desc{font-size:.72rem;color:rgba(255,255,255,.5);letter-spacing:.5px;line-height:1.4}
#pc-app .settings-card .transparency-slider-row{
  position:relative;display:flex;align-items:center;gap:16px;margin-top:4px;
}
#pc-app .transparency-slider-track, #pc-app .bg-blur-slider-track{
  position:relative;flex:1;height:3px;border-radius:1.5px;
  background:rgba(255,255,255,.28);cursor:pointer;
}
#pc-app .transparency-slider-fill, #pc-app .bg-blur-slider-fill{
  position:absolute;top:0;left:0;height:100%;width:70%;border-radius:1.5px;
  background:linear-gradient(90deg,var(--accent,#66ccff),#88ddff,var(--accent,#66ccff));
  background-size:200% 100%;pointer-events:none;
}

#pc-app .transparency-slider-thumb,
#pc-app .bg-blur-slider-thumb{
  position:absolute;top:50%;left:70%;
  width:12px;height:12px;border-radius:50%;
  background:var(--accent,#66ccff);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.85),
    0 2px 6px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);pointer-events:none;
  transition:left .06s linear,width .18s ease,height .18s ease,box-shadow .2s ease;
  z-index:2;will-change:left;
}
#pc-app .transparency-slider-track:hover .transparency-slider-thumb,
#pc-app .bg-blur-slider-track:hover .bg-blur-slider-thumb{
  width:16px;height:16px;
  box-shadow:
    0 0 0 2.5px rgba(255,255,255,.95),
    0 3px 8px rgba(0,0,0,.30);
}
#pc-app .transparency-slider-track input[type="range"],
#pc-app .bg-blur-slider-track input[type="range"]{
  position:absolute;top:-8px;left:0;width:100%;height:calc(100% + 16px);
  opacity:0;cursor:pointer;margin:0;padding:0;z-index:3;
}
#pc-app .transparency-value,
#pc-app .bg-blur-value{min-width:44px;text-align:right;font-size:1.05rem;font-weight:500;color:#fff}

#pc-app .theme-switch-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;padding:6px 0 2px 0;
}
#pc-app .theme-icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;background:none;border:none;
  cursor:pointer;color:rgba(255,255,255,.7);padding:0;
}
#pc-app .theme-icon-btn svg{width:24px;height:24px;fill:currentColor}
#pc-app[data-theme="dark"] .theme-icon-btn.moon-icon{color:#ffd93d}
#pc-app[data-theme="light"] .theme-icon-btn.sun-icon{color:#ffd93d}
#pc-app .theme-icon-btn.disabled{opacity:.3!important;pointer-events:none!important}
#pc-app .switch-track.disabled{opacity:.3!important;pointer-events:none!important}
#pc-app .switch-track{
  position:relative;width:36px;height:20px;border-radius:10px;
  background:rgba(255,255,255,.25);cursor:pointer;flex-shrink:0;
  border:1px solid rgba(255,255,255,.15);
}
#pc-app .switch-track.active{background:var(--accent);border-color:var(--accent)}
#pc-app .switch-thumb{
  position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
#pc-app .switch-track.active .switch-thumb{transform:translateX(16px)}
#pc-app .auto-switch-track{
  position:relative;width:36px;height:20px;border-radius:10px;
  background:rgba(255,255,255,.25);cursor:pointer;flex-shrink:0;
  border:1px solid rgba(255,255,255,.15);
}
#pc-app .auto-switch-track.active{background:var(--accent);border-color:var(--accent)}
#pc-app .auto-switch-track .auto-switch-thumb{
  position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
#pc-app .auto-switch-track.active .auto-switch-thumb{transform:translateX(16px)}
#pc-app .auto-label{color:var(--text-color);font-size:.85rem;white-space:nowrap}

#pc-app #theme-transition-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;
  pointer-events:none;visibility:hidden;opacity:0;background:transparent;
}
#pc-app #theme-transition-overlay.animating{pointer-events:auto;visibility:visible;opacity:1}
#pc-app #bg-transition-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9997;
  pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
#pc-app #bg-transition-overlay.active{opacity:1}
#pc-app .md3-icon-btn{
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;padding:0;color:#fff!important;
}
#pc-app .md3-icon-btn svg{
  width:20px;height:20px;stroke:currentColor;stroke-width:2;
  fill:none;stroke-linecap:round;stroke-linejoin:round;
}
#pc-app #main-play-btn{
  background:var(--play-btn-bg,#66ccff);
  transition:background .6s ease;
}
#pc-app #main-play-btn svg{fill:currentColor;stroke:none}

/* ============ 响应式 ============ */
@media (max-width:640px){
  #pc-app #top-right-info{top:10px;right:10px;padding:8px 14px;min-width:80px}
  #pc-app #top-right-info .time{font-size:1rem}

  #pc-app .switch-track,#pc-app .auto-switch-track{width:30px;height:17px}

#mobile-app #mobile-search-container .search-icon svg{

#mobile-app #mobile-search-input{

#mobile-app #mobile-search-input::placeholder{color:rgba(255,255,255,.5);font-weight:300}

}
#mobile-app .mobile-search-btn{

}
#mobile-app .mobile-search-btn svg{

}
#mobile-app #mobile-github-island{

/* ============ 果冻动画 ============ */
@keyframes jellySettle{
  0%{scale:1 1;rotate:0deg}
  22%{scale:1.10 .90;rotate:var(--jelly-tilt,0deg)}
  48%{scale:.93 1.08;rotate:calc(var(--jelly-tilt,0deg) * -.55)}
  72%{scale:1.04 .97;rotate:calc(var(--jelly-tilt,0deg) * .25)}
  100%{scale:1 1;rotate:0deg}
}
.jelly-interactive{
  transform-origin:center;
  transition:translate .18s cubic-bezier(.2,.8,.2,1),rotate .18s ease;
  will-change:translate,rotate,scale;
}
.jelly-interactive.jelly-grabbed{
  transition:translate .06s linear,rotate .08s linear;
  filter:drop-shadow(0 7px 12px rgba(0,0,0,.18));
}
.jelly-interactive.jelly-release{animation:jellySettle .62s cubic-bezier(.2,.9,.25,1.25)}
@media (prefers-reduced-motion:reduce){
  .jelly-interactive,.jelly-interactive.jelly-grabbed{transition:none}
  .jelly-interactive.jelly-release{animation:none}
}

}

/* ====================================================================
   MD3E 播放器：AOSP Media Control 标准布局
   ==================================================================== */
#pc-app[data-visual-style="md3e"] #player{
  display: block !important;
  position: relative;
  width: 380px !important;
  height: 220px !important;
  padding: 0 !important;
  border-radius: 28px !important;
  overflow: hidden !important;
  background: var(--md-sys-color-surface-container-high) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important;
  cursor: grab;
  touch-action: none;
}
#pc-app[data-visual-style="md3e"] #player.dragging{
  cursor: grabbing;
}

/* 背景封面 */
#pc-app[data-visual-style="md3e"] #art-box {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  border-radius: 0 !important;
  z-index: 0;
  background: #222;
}
#pc-app[data-visual-style="md3e"] #art-box img {
  width: 100%; height: 100%; object-fit: cover;
}
#pc-app[data-visual-style="md3e"] #art-box::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.80) 100%);
}

/* MD3E 专属装饰 */
#pc-app[data-visual-style="md3e"] .md3e-deco {
  display: flex; position: absolute; z-index: 2; color: #fff; align-items: center; justify-content: center;
}
#pc-app[data-visual-style="md3e"] .md3e-app-icon {
  top: 16px; left: 20px; width: 24px; height: 24px; opacity: 0.9;
}
#pc-app[data-visual-style="md3e"] .md3e-cast-icon {
  top: 16px; right: 20px; width: 24px; height: 24px; opacity: 0.9;
}
#pc-app[data-visual-style="md3e"] .md3e-like-icon {
  bottom: 20px; left: 20px; width: 24px; height: 24px; opacity: 0.9;
}
#pc-app[data-visual-style="md3e"] .md3e-vol-icon {
  bottom: 20px; right: 56px; width: 20px; height: 20px; opacity: 0.9;
}

/* 歌曲信息 */
#pc-app[data-visual-style="md3e"] .control-area {
  position: absolute !important;
  inset: 0 !important;
  z-index: 1;
  display: block !important;
  padding: 0 !important;
  pointer-events: none; /* 让背景拖拽生效 */
}
#pc-app[data-visual-style="md3e"] .song-info {
  position: absolute !important;
  top: 56px; left: 20px; right: 90px;
  font-size: 0 !important;
  color: #fff !important;
  padding: 0 !important; margin: 0 !important;
  text-shadow: none !important;
  pointer-events: none;
}
#pc-app[data-visual-style="md3e"] .song-info::before {
  content: attr(data-name);
  display: block; font-size: 20px; font-weight: 600;
  color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: 0.5px;
}
#pc-app[data-visual-style="md3e"] .song-info::after {
  content: attr(data-artist);
  display: block; font-size: 14px; font-weight: 400;
  color: rgba(255,255,255,0.8);
  margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 播放按钮 */
#pc-app[data-visual-style="md3e"] #main-play-btn {
  position: absolute !important;
  top: 58px; right: 20px;
  width: 56px !important; height: 48px !important;
  border-radius: 16px !important;
  background: rgba(230, 224, 233, 0.85) !important;
  color: #1D1B20 !important;
  display: flex; align-items: center; justify-content: center;
  box-shadow: none !important;
  z-index: 5;
  pointer-events: auto;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
#pc-app[data-visual-style="md3e"] #main-play-btn svg {
  fill: #1D1B20 !important;
  width: 24px !important; height: 24px !important;
}

/* 进度条 */
#pc-app[data-visual-style="md3e"] #progress-container {
  position: absolute !important;
  bottom: 24px; left: 56px; right: 120px;
  height: 16px !important;
  margin: 0 !important;
  pointer-events: auto;
  background: transparent !important;
}
#pc-app[data-visual-style="md3e"] #progress-container::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  height: 2px; background: rgba(255,255,255,0.25); border-radius: 1px;
  pointer-events: none;
}
#pc-app[data-visual-style="md3e"] #progress-fill {
  display: none !important;
}
#pc-app[data-visual-style="md3e"] #progress-container .wave-overlay {
  display: none !important;
}
#pc-app[data-visual-style="md3e"] #wave-canvas {
  display: block !important;
}
#pc-app[data-visual-style="md3e"] #progress {
  position: absolute !important;
  top: 0 !important; left: 0 !important;
  width: 100% !important; height: 100% !important;
  opacity: 0 !important;
  cursor: pointer !important;
  z-index: 10 !important;
}
#pc-app[data-visual-style="md3e"] #time-display {
  display: none !important;
}
#pc-app[data-visual-style="md3e"] .controls {
  display: contents !important;
}
#pc-app[data-visual-style="md3e"] #prev-btn {
  position: absolute !important;
  bottom: 18px; right: 84px;
  width: 24px !important; height: 24px !important;
  color: rgba(255,255,255,0.9) !important;
  pointer-events: auto;
}
#pc-app[data-visual-style="md3e"] #next-btn {
  position: absolute !important;
  bottom: 18px; right: 20px;
  width: 24px !important; height: 24px !important;
  color: rgba(255,255,255,0.9) !important;
  pointer-events: auto;
}
#pc-app[data-visual-style="md3e"] #prev-btn svg, #pc-app[data-visual-style="md3e"] #next-btn svg {
  width: 24px !important; height: 24px !important;
  fill: currentColor !important;
}
#pc-app[data-visual-style="md3e"] #mode-btn,
#pc-app[data-visual-style="md3e"] #list-btn {
  display: none !important;
}

@media (max-width:640px){
  #pc-app[data-visual-style="md3e"] #player{ width: 320px !important; height: 200px !important; }
  #pc-app[data-visual-style="md3e"] .song-info { top: 50px; }
  #pc-app[data-visual-style="md3e"] #main-play-btn { top: 48px; }
}

  #pc-app[data-visual-style="md3e"] #player{ width: 280px !important; height: 180px !important; }
  #pc-app[data-visual-style="md3e"] .song-info { top: 40px; }

  #pc-app[data-visual-style="md3e"] .song-info::after{ font-size: 12px; }
  #pc-app[data-visual-style="md3e"] #main-play-btn { top: 38px; width: 48px !important; height: 40px !important; }

/* ====================================================================
   Mica 云母 (保留代码，UI已隐藏)
   ==================================================================== */
#pc-app[data-visual-style="mica"]{
  --mica-bg:rgba(243,243,243,0.55);
  --mica-layer:rgba(255,255,255,0.50);
  --mica-card:rgba(255,255,255,0.05);
  --mica-stroke:rgba(0,0,0,0.08);
  --mica-stroke-strong:rgba(0,0,0,0.16);
  --mica-text:#1a1a1c;
  --mica-text-secondary:rgba(0,0,0,0.60);
  --mica-radius-control:4px;
  --mica-radius-card:8px;
  --mica-radius-window:8px;
}
#pc-app[data-visual-style="mica"][data-theme="dark"]{
  --mica-bg:rgba(32,32,32,0.65);
  --mica-layer:rgba(58,58,58,0.30);
  --mica-card:rgba(255,255,255,0.05);
  --mica-stroke:rgba(255,255,255,0.08);
  --mica-stroke-strong:rgba(255,255,255,0.16);
  --mica-text:#e6e6ea;
  --mica-text-secondary:rgba(255,255,255,0.60);
}
#pc-app[data-visual-style="mica"]::before{
  background:var(--mica-bg);
  backdrop-filter:blur(var(--bg-blur, 0px)) saturate(.80) brightness(.95);
  -webkit-backdrop-filter:blur(var(--bg-blur, 0px)) saturate(.80) brightness(.95);
}
#pc-app[data-visual-style="mica"][data-theme="dark"]::before{
  background:var(--mica-bg);
  backdrop-filter:blur(var(--bg-blur, 0px)) saturate(.75) brightness(.88);
  -webkit-backdrop-filter:blur(var(--bg-blur, 0px)) saturate(.75) brightness(.88);
}

#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .modal-subtitle{color:var(--mica-text-secondary)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .sidebar-icon{color:var(--mica-text-secondary)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .sidebar-icon.active{color:var(--mica-text)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .settings-card-title{color:var(--mica-text)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .settings-card-desc{color:var(--mica-text-secondary)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .auto-label{color:var(--mica-text)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .transparency-value,
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .bg-blur-value{color:var(--mica-text)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .custom-status{color:var(--mica-text-secondary)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .file-label{color:var(--mica-text)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .pill-btn{color:var(--mica-text)!important;background:var(--mica-card)!important;border-color:var(--mica-stroke)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .pill-btn.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .visual-style-btn{color:var(--mica-text-secondary)!important;background:var(--mica-card)!important;border-color:var(--mica-stroke)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .visual-style-btn.active{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .sidebar-icon[data-tooltip]::after{background:rgba(30,30,34,.94)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .thumb-carousel .thumb-arrow{background:rgba(0,0,0,.08)!important;border-color:var(--mica-stroke)!important;color:var(--mica-text)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .thumb-carousel .thumb-dots span{background:rgba(0,0,0,.16)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .thumb-carousel .thumb-dots span.active{background:var(--accent)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) #pc-footer{color:rgba(0,0,0,.4)!important}
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .transparency-slider-track,
#pc-app[data-visual-style="mica"]:not([data-theme="dark"]) .bg-blur-slider-track{background:rgba(0,0,0,.14)!important}
</style>
</head>
<body>

<div id="pc-app" data-theme="light" data-visual-style="liquid-glass">
  
  <div id="top-right-info" class="liquid-glass">
    <div class="time" id="clock">--:--:--</div>
    <div class="weather" id="weather-info">
      <span class="weather-icon" id="weather-icon"></span>
      <span class="weather-temp" id="weather-temp">--°C</span>
      <span class="weather-desc" id="weather-desc"></span>
    </div>
  </div>

  <div id="lyrics-island" class="liquid-glass">
    <div class="lyrics-line placeholder" id="lyrics-line-1">♪ 等待歌词...</div>
    <div class="lyrics-line current" id="lyrics-line-2">♪ 加载中...</div>
    <div class="lyrics-line placeholder" id="lyrics-line-3">♪ 请播放歌曲</div>
  </div>

  <div id="player" class="liquid-glass">
    <div id="art-box">
      <img src="741383.png" alt="cover" id="cover-img" onerror="this.src='741383.png'"/>
    </div>
    
    <!-- MD3E 专属装饰 -->
    <div class="md3e-deco md3e-app-icon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14.5c-.2.3-.6.4-.9.2-2.4-1.5-5.5-1.8-9.1-1-.4.1-.7-.1-.8-.5-.1-.4.1-.7.5-.8 3.9-.9 7.3-.5 10 1.1.3.2.4.6.3 1zm1.2-2.7c-.3.4-.7.5-1.1.3-2.8-1.7-7-2.2-10.3-1.2-.4.1-.8-.1-.9-.5-.1-.4.1-.8.5-.9 3.8-1.1 8.4-.6 11.6 1.3.4.2.5.7.2 1zm.1-2.8C14.3 9 8.4 8.8 5.2 9.8c-.5.2-1-.1-1.2-.6-.2-.5.1-1 .6-1.2 3.7-1.1 10.2-.9 14.2 1.5.5.3.6.9.3 1.4-.3.4-.9.6-1.3.3z"/></svg>
    </div>
    <div class="md3e-deco md3e-cast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><line x1="2" y1="20" x2="2.01" y2="20"/></svg>
    </div>
    <div class="md3e-deco md3e-like-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <div class="md3e-deco md3e-vol-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </div>

    <div class="control-area">
      <div class="song-info" id="song-info" data-name="加载中..." data-artist="">加载中...</div>
      <div id="progress-container">
        <div id="progress-fill"></div>
        <div class="wave-overlay"></div>
        <canvas id="wave-canvas"></canvas>
        <div class="progress-thumb" id="progress-thumb"></div>
        <input type="range" id="progress" value="0" step="0.001" aria-label="播放进度"/>
      </div>
      <div id="time-display">00:00 / 00:00 / 00:00</div>
      <div class="controls">
        <button id="prev-btn" class="md3-icon-btn" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="main-play-btn" aria-label="播放/暂停" style="border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg id="play-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button id="next-btn" class="md3-icon-btn" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="mode-btn" class="md3-icon-btn" aria-label="切换播放模式">
          <span id="mode-icon" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%"></span>
        </button>
        <button id="list-btn" class="md3-icon-btn" style="font-size:18px;font-weight:300" aria-label="播放列表">☰</button>
      </div>
    </div>
  </div>

  <div id="song-list" class="liquid-glass"></div>

  <div id="pc-search-container">
    <span class="search-icon">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </span>
    <input type="text" id="pc-search-input" placeholder="在Yandex中搜索..." autocomplete="off"/>
    <button class="clear-btn" id="pc-clear-btn" style="display:none">✕</button>
    <button class="pc-search-btn" id="pc-search-btn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      搜索
    </button>
  </div>

  <div class="nav-links liquid-glass" id="navLinks">
    <a href="md.html">世界</a>
    <a href="https://bxfans.github.io/Tube/" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">萌Chat（开发中）</a>
    <a href="https://bxfans.github.io/Gptt/" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">智人TV（开发中）</a>
    <a href="re.html">ACGNリソース</a>
  </div>

  <a id="github-island" href="https://github.com/ainypboiep/world" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" aria-label="GitHub 仓库">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </svg>
  </a>

  <div id="pc-footer">
    <div class="pc-footer-title">✦ 幻想的な星明かり ✦</div>
  </div>

  <div id="gear-island" role="button" aria-label="打开设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </div>

  <div id="bg-transition-overlay"></div>

  <div id="modal-overlay">
    <div id="modal" class="liquid-glass">
      <div class="modal-header" id="modal-header">
        <div id="window-controls">
          <span class="dot red" id="modal-close-btn" role="button" aria-label="关闭"></span>
          <span class="dot yellow" aria-hidden="true"></span>
          <span class="dot green" aria-hidden="true"></span>
        </div>
        <span class="modal-title">パーソナライズ</span>
      </div>

      <div class="modal-body">
        <div class="modal-sidebar">
          <div class="sidebar-indicator" id="sidebar-indicator"></div>
          <button class="sidebar-icon active" data-tab="personalize" data-tooltip="壁纸与颜色" aria-label="壁纸与颜色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <line x1="7.5" y1="10" x2="16.5" y2="10"/>
              <circle cx="10.5" cy="10" r="1.8" fill="currentColor"/>
              <line x1="7.5" y1="15" x2="16.5" y2="15"/>
              <circle cx="14" cy="15" r="1.8" fill="currentColor"/>
            </svg>
          </button>
          <button class="sidebar-icon" data-tab="transparency" data-tooltip="显示效果" aria-label="显示效果">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="4.5"/>
              <path d="M6 15 L14.5 5.5" opacity="0.55" stroke-width="1.3"/>
            </svg>
          </button>
        </div>

        <div class="modal-content">
          <div class="tab-panel" data-panel="personalize">
            <div class="personalize-scroll">
              <div class="thumb-carousel">
                <div class="thumb-row">
                  <div class="thumb-wrapper">
                    <div class="thumb-track" id="thumb-track">
                      <img src="741383.png" alt="默认壁纸" data-key="741383.png" onerror="this.style.display='none'"/>
                      <img src="722264.jpg" alt="海边のミク" data-key="722264.jpg" onerror="this.style.display='none'"/>
                      <img src="miku2.jpg" alt="桜ミク" data-key="miku2.jpg" onerror="this.style.display='none'"/>
                      <img src="蝶云.png" alt="洛天依-蝶变" data-key="蝶云.png" onerror="this.style.display='none'"/>
                      <img src="nacho.png" alt="猫羽雫" data-key="nacho.png" onerror="this.style.display='none'"/>
                      <img src="airi.png" alt="桃井爱莉" data-key="airi.png" onerror="this.style.display='none'"/>
                      <img src="hua.jpg" alt="常磐华乃" data-key="hua.jpg" onerror="this.style.display='none'"/>
                      <img src="zao.jpg" alt="东风谷早苗" data-key="zao.jpg" onerror="this.style.display='none'"/>
                    </div>
                  </div>
                </div>
                <div class="thumb-dots" id="thumb-dots">
                  <span data-index="0" class="active"></span>
                  <span data-index="1"></span>
                  <span data-index="2"></span>
                  <span data-index="3"></span>
                  <span data-index="4"></span>
                  <span data-index="5"></span>
                  <span data-index="6"></span>
                  <span data-index="7"></span>
                </div>
                <button class="apply-btn" id="apply-theme-btn">应用</button>
              </div>

              <div class="settings-card">
                <div class="settings-card-title">自定义壁纸</div>
                <div class="settings-card-desc">粘贴图片链接，或从设备中选择一张本地图片</div>
                <div class="custom-row">
                  <input type="text" class="custom-input" id="custom-bg-url" placeholder="https://example.com/wallpaper.jpg" autocomplete="off" spellcheck="false"/>
                  <button class="pill-btn primary" id="custom-bg-url-apply" type="button">应用</button>
                </div>
                <div class="custom-row">
                  <label class="file-label" for="custom-bg-file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="17 8 12 3 7 8"/>
                      <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    选择本地图片
                  </label>
                  <input type="file" id="custom-bg-file" accept="image/*" style="display:none"/>
                  <button class="pill-btn" id="custom-bg-reset" type="button">恢复预设</button>
                </div>
                <div class="custom-status" id="custom-bg-status"></div>
              </div>

              <div class="settings-card">
                <div class="settings-card-title">自定义主题色</div>
                <div class="settings-card-desc">拖动色盘挑选强调色，或从当前壁纸中自动提取</div>
                <div class="custom-row">
                  <input type="color" class="color-picker" id="custom-color-input" value="#66ccff" aria-label="自定义颜色"/>
                  <div class="color-swatches" id="color-swatches">
                    <button type="button" class="color-swatch" data-color="#66ccff" style="background:#66ccff" aria-label="天依蓝"></button>
                    <button type="button" class="color-swatch" data-color="#f6829d" style="background:#f6829d" aria-label="樱花粉"></button>
                    <button type="button" class="color-swatch" data-color="#a78bfa" style="background:#a78bfa" aria-label="紫罗兰"></button>
                    <button type="button" class="color-swatch" data-color="#4ade80" style="background:#4ade80" aria-label="薄荷绿"></button>
                    <button type="button" class="color-swatch" data-color="#fbbf24" style="background:#fbbf24" aria-label="暖阳黄"></button>
                    <button type="button" class="color-swatch" data-color="#f87171" style="background:#f87171" aria-label="珊瑚红"></button>
                    <button type="button" class="color-swatch" data-color="#22d3ee" style="background:#22d3ee" aria-label="青蓝"></button>
                    <button type="button" class="color-swatch" data-color="#b6d5e9" style="background:#b6d5e9" aria-label="雾霾蓝"></button>
                  </div>
                </div>
                <div class="custom-row">
                  <button class="pill-btn primary" id="custom-color-apply" type="button">应用颜色</button>
                  <button class="pill-btn" id="custom-color-auto" type="button">从壁纸提取</button>
                  <button class="pill-btn" id="custom-color-reset" type="button">恢复默认</button>
                </div>
                <div class="custom-status" id="custom-color-status"></div>
              </div>
            </div>
          </div>

          <div class="tab-panel" data-panel="transparency" hidden>
            <div class="settings-container">
              <div class="settings-card">
                <div class="settings-card-title">视觉样式</div>
                <div class="settings-card-desc">选择界面的整体视觉风格</div>
                <div class="visual-style-options">
                  <button class="visual-style-btn active" data-style="liquid-glass">Liquid Glass</button>
                  <button class="visual-style-btn" data-style="md3e">Google MD3E</button>
                </div>
              </div>

              <div class="settings-card" id="transparency-card">
                <div class="settings-card-title">全局透明效果</div>
                <div class="settings-card-desc">调节毛玻璃的模糊强度</div>
                <div class="transparency-slider-row">
                  <div class="transparency-slider-track">
                    <div class="transparency-slider-fill" id="transparency-fill"></div>
                    <div class="transparency-slider-thumb" id="transparency-thumb"></div>
                    <input type="range" id="transparency-range" min="0" max="100" value="70" step="1" aria-label="透明度"/>
                  </div>
                  <div class="transparency-value" id="transparency-value">70</div>
                </div>
              </div>

              <!-- 背景虚化程度 -->
              <div class="settings-card">
                <div class="settings-card-title">背景虚化程度</div>
                <div class="settings-card-desc">调节页面背景壁纸的模糊强度</div>
                <div class="transparency-slider-row">
                  <div class="bg-blur-slider-track">
                    <div class="bg-blur-slider-fill" id="bg-blur-fill"></div>
                    <div class="bg-blur-slider-thumb" id="bg-blur-thumb"></div>
                    <input type="range" id="bg-blur-range" min="0" max="60" value="0" step="1" aria-label="背景虚化程度"/>
                  </div>
                  <div class="bg-blur-value" id="bg-blur-value">0</div>
                </div>
              </div>

              <div class="settings-card">
                <div class="settings-card-title">深色模式</div>
                <div class="settings-card-desc">切换明亮 / 暗黑外观</div>
                <div class="theme-switch-row">
                  <button class="theme-icon-btn moon-icon" id="moon-btn" aria-label="暗黑模式">
                    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-7.54-7.54A9.01 9.01 0 0 0 12 3z"/></svg>
                  </button>
                  <div class="switch-track active" id="switch-track" role="switch" aria-checked="true">
                    <div class="switch-thumb" id="switch-thumb"></div>
                  </div>
                  <button class="theme-icon-btn sun-icon active" id="sun-btn" aria-label="明亮模式">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="5"/>
                      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                  </button>
                  <span class="auto-label">根据设备设置</span>
                  <div class="auto-switch-track active" id="auto-switch-track" role="switch" aria-checked="true">
                    <div class="auto-switch-thumb" id="auto-switch-thumb"></div>
                    <input type="checkbox" id="auto-theme-checkbox" checked style="opacity:0;width:0;height:0;position:absolute;pointer-events:none"/>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="theme-transition-overlay"></div>
  <audio id="audio" crossorigin="anonymous" preload="none"></audio>
</div>

<div id="mobile-app">
  <div class="mobile-title">
    <div class="line1">来了,</div>
    <div class="line2">バラモン！</div>
  </div>

/* ============ 玻璃透明度 ============ */
const GLASS_KEY='glass_intensity',DEFAULT_GLASS=70;
let glassIntensity=DEFAULT_GLASS;
function applyGlassIntensity(value){
  value=Math.max(0,Math.min(100,parseInt(value,10)||0));
  glassIntensity=value;
  let mult;
  if(value===0){mult=0;}
  else{
    const n=value/70;mult=Math.pow(n,3);
    if(value>70){const e=(value-70)/30;mult*=1+e*1.4;}
  }
  document.documentElement.style.setProperty('--glass-mult',mult.toFixed(4));
  let sm;if(value===0){sm=0;}else{sm=value/70;}
  document.documentElement.style.setProperty('--glass-shadow-mult',sm.toFixed(4));
  let bf;
  if(value===0){bf='none';}
  else{
    const t=value/100;
    bf='blur('+(t*40).toFixed(1)+'px) saturate('+(100+t*100).toFixed(0)+'%) brightness('+(1+t*0.05).toFixed(3)+')';
  }
  document.documentElement.style.setProperty('--glass-backdrop',bf);
  const fill=document.getElementById('transparency-fill');
  const range=document.getElementById('transparency-range');
  const valEl=document.getElementById('transparency-value');
  const thumb=document.getElementById('transparency-thumb');
  if(fill)fill.style.width=value+'%';
  if(range)range.value=value;
  if(valEl)valEl.textContent=value;
  if(thumb)thumb.style.left=value+'%';
  safeStore.set(GLASS_KEY,value);
}
function readSavedGlassIntensity(){
  const v=safeStore.get(GLASS_KEY,null);
  if(v===null)return DEFAULT_GLASS;
  const n=parseInt(v,10);
  if(isNaN(n)||n<0||n>100)return DEFAULT_GLASS;
  return n;
}
function initGlassIntensity(){

}

  });
  let list=json.songs||(json.album&&json.album.songs)||(json.data&&j.data.songs)||(json.data&&j.data.album&&j.data.album.songs)||[];
  if(!Array.isArray(list))list=[];
  return list.filter(song=>!CONFIG.EXCLUDED_IDS.includes(String(song.id))).map(mapSongToLocal);
}
async function fetchSongUrl(songId){
  if(songUrlCache[songId])return songUrlCache[songId];
  const json=await apiFetchJson('/song/url/v1?id='+songId+'&level=exhigh',function(j){
    return (j.data&&j.data[0]&&j.data[0].url)||j.url||(j.data&&j.data.url);
  });
  let playUrl=(json.data&&json.data[0]&&json.data[0].url)||json.url||(json.data&&json.data.url)||'';
  if(!playUrl)throw new Error('未获取到播放地址');
  if(location.protocol==='https:'&&playUrl.indexOf('http://')===0)playUrl='https://'+playUrl.slice(7);
  songUrlCache[songId]=playUrl;return playUrl;
}
async function fetchSongCover(songId){
  try{
    const json=await apiFetchJson('/song/detail?ids='+songId);
    const song=json.songs&&json.songs[0];
    return (song&&song.al&&song.al.picUrl)||(song&&song.album&&song.album.picUrl)||'';
  }catch(e){return '';}
}
async function fetchSongLyric(songId){
  if(lyricCache[songId])return lyricCache[songId];
  const json=await apiFetchJson('/lyric?id='+songId);
  const lyricText=(json.data&&json.data.lyric)||json.lyric||(json.lrc&&json.lrc.lyric)||(json.data&&json.data.lrc&&json.data.lrc.lyric)||'';
  if(!lyricText)return null;
  const parsed=parseLRC(lyricText);lyricCache[songId]=parsed;return parsed;
}
function parseLRC(lrcText){
  const lines=lrcText.split('\n');const parsed=[];const timeRegex=/\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
  for(let line of lines){
    const trimmed=line.trim();if(!trimmed)continue;
    const match=trimmed.match(timeRegex);
    if(match){
      const minutes=parseInt(match[1]);const seconds=parseInt(match[2]);
      const ms=parseInt(match[3].padEnd(3,'0'));
      const totalSeconds=minutes*60+seconds+ms/1000;
      const text=trimmed.replace(timeRegex,'').trim();
      if(text)parsed.push({time:totalSeconds,text:text});
    }
  }
  if(parsed.length===0){
    const textLines=lrcText.split('\n').filter(l=>l.trim().length>0);
    if(textLines.length>0){
      const dur=audio.duration||180;const step=dur/textLines.length;
      return textLines.map((t,i)=>({time:i*step,text:t.trim()}));
    }
    return null;
  }
  parsed.sort((a,b)=>a.time-b.time);return parsed;
}

async function loadAndPlay(index,startTime){
  if(index<0||index>=songList.length)return;

  try{

    audio.src=url;
    if(typeof startTime==='number'&&startTime>0)audio.currentTime=startTime;
    audio.load();
    const p=audio.play();

      p.then(()=>setPlayingState(true)).catch(err=>{

    audio.src='';setPlayingState(false);
    songInfoEl.textContent=song.name+' - 播放失败 (请检查控制台)';
  }
  try{

    if(lyric&&lyric.length>0)lyricLines=lyric;
    else{lyricLines=[];updateLyricsDisplay('♪ 无歌词','♪ 无歌词','♪ 无歌词');}
  }catch(e){

  savePlaybackState();
}

  songListEl.classList.remove('hiding');
  const vw=window.innerWidth;const vh=window.innerHeight;
  const margin=10;const gap=8;
  const preferredWidth=380;const maxListHeight=360;

  songListEl.style.pointerEvents='auto';
  const contentHeight=Math.min(songListEl.scrollHeight,maxListHeight);

  const spaceBelow=vh-playerRect.bottom-gap-margin;
  const spaceAbove=playerRect.top-gap-margin;
  let placeAbove=false;let maxHeight;
  if(spaceBelow>=safeContentHeight){maxHeight=safeContentHeight;}
  else if(spaceAbove>=safeContentHeight){placeAbove=true;maxHeight=safeContentHeight;}
  else if(spaceBelow>=spaceAbove){maxHeight=Math.max(120,spaceBelow);}

  if(top<margin){top=margin;maxHeight=Math.min(maxListHeight,vh-margin*2);}
  if(top+maxHeight>vh-margin){maxHeight=vh-margin-top;}
  let left=playerRect.left;
  if(left+listWidth>vw-margin)left=vw-margin-listWidth;
  if(left<margin)left=margin;
  songListEl.style.width=listWidth+'px';

function compressImage(file,maxDim,quality){
  return new Promise(function(resolve,reject){
    const reader=new FileReader();
    reader.onload=function(){
      const img=new Image();
      img.onload=function(){
        try{
          let w=img.naturalWidth||img.width||1;
          let h=img.naturalHeight||img.height||1;
          const scale=Math.min(1,maxDim/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
          const canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext('2d');if(!ctx)throw new Error('no ctx');
          ctx.drawImage(img,0,0,w,h);
          let out=null;
          try{out=canvas.toDataURL('image/jpeg',quality);}catch(e){out=reader.result;}
          if(out&&out.length>4*1024*1024){try{out=canvas.toDataURL('image/jpeg',0.58);}catch(e){}}
          resolve(out||reader.result);
        }catch(e){resolve(reader.result);}
      };
      img.onerror=function(){reject(new Error('图片解码失败'));};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error('文件读取失败'));};
    reader.readAsDataURL(file);
  });
}

function setCookie(name,value,days){
  const expires=new Date(Date.now()+days*24*60*60*1000).toUTCString();
  document.cookie=name+'='+encodeURIComponent(value)+'; expires='+expires+'; path=/; SameSite=Lax';
}
function getCookie(name){
  const match=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  if(match)return decodeURIComponent(match[2]);
  return null;
}

      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:userTimeZone
    });
    clockEl.textContent=fmt.format(now);
  }catch(e){
    const offset=8*60;
    const local=new Date(now.getTime()+(offset-now.getTimezoneOffset())*60000);
    clockEl.textContent=
      String(local.getHours()).padStart(2,'0')+':'+
      String(local.getMinutes()).padStart(2,'0')+':'+
      String(local.getSeconds()).padStart(2,'0');
  }
}

    idxSpan.textContent=String(index+1).padStart(2,'0');
    const nameSpan=document.createElement('span');
    nameSpan.className='song-name';
    nameSpan.textContent=song.name||'未知歌曲';
    div.appendChild(idxSpan);div.appendChild(nameSpan);
    if(song.artist){
      const artistSpan=document.createElement('span');
      artistSpan.className='song-artist';
      artistSpan.textContent=song.artist;
      div.appendChild(artistSpan);
    }
    div.addEventListener('click',function(){
      const idx=parseInt(this.dataset.index);
      if(idx!==currentIdx)loadAndPlay(idx);
      else togglePlayInternal();
      closeListWithAnimation();
    });
    songListEl.appendChild(div);
  });
  highlightCurrentSong();updateSongInfo();
}

async function initPlayer(){
  try{
    await pickWorkingApiInstance();
    const [artistSongs,albumSongs]=await Promise.all([
      fetchArtistSongs(CONFIG.ARTIST_ID).catch(e=>{return [];}),
      fetchAlbumSongs(CONFIG.ALBUM_ID).catch(e=>{return [];})
    ]);
    const seen=new Set();const merged=[];
    for(const s of artistSongs){if(!seen.has(s.id)){seen.add(s.id);merged.push(s);}}
    for(const s of albumSongs){if(!seen.has(s.id)){seen.add(s.id);merged.push(s);}}
    if(merged.length===0)throw new Error('没有获取到歌曲');
    songList=merged;
    buildSongListUI();
    document.getElementById('mode-icon').innerHTML=iconMap[0];
    const savedState=loadPlaybackState();
    let startIndex=0;let startTime=0;
    if(savedState&&savedState.songId){
      const idx=songList.findIndex(s=>s.id===String(savedState.songId));
      if(idx>=0){
        startIndex=idx;startTime=Math.max(0,savedState.currentTime||0);
        if(typeof savedState.mode==='number'&&savedState.mode>=0&&savedState.mode<3){
          mode=savedState.mode;
          document.getElementById('mode-icon').innerHTML=iconMap[mode];
        }
      }
    }
    await loadAndPlay(startIndex,startTime);
  }catch(err){
    songInfoEl.textContent='⚠️ 加载失败：'+err.message.slice(0,60);
    songList=[{id:'0',name:'加载失败',artist:'请检查控制台',album:'',cover:'741383.png'}];
    buildSongListUI();
  }
}

function loadCustomPrefs(){
  const c=safeStore.get(CUSTOM_COLOR_KEY,'');
  if(c&&/^#[0-9a-fA-F]{6}$/.test(c))customColor=c;
  const bg=safeStore.get(CUSTOM_BG_KEY,'');
  const active=safeStore.get(CUSTOM_BG_ACTIVE_KEY,'0')==='1';
  if(bg&&active)customWallpaper=bg;
}

thumbDots.querySelectorAll('span').forEach((dot,i)=>{
  dot.addEventListener('click',function(e){e.stopPropagation();goToThumb(i);});
});

// 点击堆叠卡片两侧可以切换
document.querySelector('.thumb-wrapper').addEventListener('click', function(e) {
  const rect = this.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width / 3) {
    goToThumb(currentThumbIndex - 1);
  } else if (x > rect.width * 2 / 3) {
    goToThumb(currentThumbIndex + 1);
  }
});

applyBtn.addEventListener('click',function(e){e.stopPropagation();applyCurrentTheme();});
document.addEventListener('keydown',function(e){
  if(isModalOpen){
    if(e.key==='ArrowLeft'){e.preventDefault();goToThumb(currentThumbIndex-1);}
    else if(e.key==='ArrowRight'){e.preventDefault();goToThumb(currentThumbIndex+1);}
    else if(e.key==='Enter'&&!e.target.closest('input,textarea,button,label'))applyCurrentTheme();
  }
});

window.addEventListener('resize',function(){
  if(isMd3eActive()){resizeWaveCanvas();drawWaveFrame();}
});

document.addEventListener('DOMContentLoaded',function(){
  loadCustomPrefs();
  preloadImages();
  initDefaultTheme();
  initModalTabs();
  initGlassIntensity();
  initBgBlur();
  initVisualStyle();
  initPersonalizeExtras();
  setTimeout(adjustLyricsIslandPosition,50);
});

window.addEventListener('load',function(){
  initPlayer();
  initAutoSwitch();
  setTimeout(adjustLyricsIslandPosition,100);
  const _loadAndPlay=loadAndPlay;
  window.loadAndPlay=function(index,startTime){
    _loadAndPlay(index,startTime);
    setTimeout(adjustLyricsIslandPosition,100);
    applyWhiteToHighlights();
  };
  if(currentVisualStyle==='md3e'){
    refreshWaveColorCache();startWaveLoop();updateWaveAmplitudeTarget();
  }
  console.log('========================================');
  console.log('🎵 播放器已启动');
  console.log('🎨 视觉样式: Liquid Glass / Google MD3E');
  console.log('🌫️ 背景虚化: 已启用 (默认 0px)');
  console.log('🎚️ 拖拽按钮: 各自官方规范');
  console.log('========================================');
});

})();
</script>

<script>
/* 果冻动画 */
(function(){
  const selector='#pc-app button,#pc-app a,#pc-app input,#pc-app label.file-label,#pc-app .song-item,#pc-app .sidebar-icon,#pc-app .thumb-dots span,#pc-app .switch-track,#pc-app .auto-switch-track,#mobile-app button,#mobile-app a,#mobile-app input';
  let active=null;
  document.querySelectorAll(selector).forEach(el=>el.classList.add('jelly-interactive'));
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest(selector);
    if(!el||e.button!==0)return;
    if(el.id==='gear-island')return;
    if(el.type==='color')return;
    active={el,x:e.clientX,y:e.clientY};
    el.classList.remove('jelly-release');
    el.classList.add('jelly-grabbed');
    el.style.setProperty('--jelly-tilt','0deg');
    el.setPointerCapture?.(e.pointerId);
  });
  document.addEventListener('pointermove',e=>{
    if(!active)return;
    const dx=e.clientX-active.x;
    const dy=e.clientY-active.y;
    const x=Math.max(-18,Math.min(18,dx*.22));
    const y=Math.max(-14,Math.min(14,dy*.22));
    const tilt=Math.max(-12,Math.min(12,dx*.35));
    active.el.style.translate=x+'px '+y+'px';
    active.el.style.rotate=tilt+'deg';
    active.el.style.setProperty('--jelly-tilt',tilt+'deg');
  });
  function release(){
    if(!active)return;
    const el=active.el;
    el.classList.remove('jelly-grabbed');
    el.style.translate='0px 0px';el.style.rotate='0deg';
    el.classList.remove('jelly-release');
    void el.offsetWidth;el.classList.add('jelly-release');
    active=null;
  }
  document.addEventListener('pointerup',release);
  document.addEventListener('pointercancel',release);
  document.addEventListener('animationend',e=>{
    if(e.animationName==='jellySettle')e.target.classList.remove('jelly-release');
  });
})();
</script>
