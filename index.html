<style>
@font-face{font-family:'悠哉字体 Light';src:url('Yozai-Light.woff2') format('woff2');font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'悠哉字体 Light','Hiragino Kaku Gothic ProN','Hiragino Sans','Microsoft JhengHei',sans-serif;background:#0b0e1a;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent;}

#pc-app,#mobile-app{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;transition:opacity .4s ease;}
#pc-app{z-index:10;opacity:1;display:block;}
#mobile-app{z-index:20;opacity:0;display:none;}
.mode-mobile #pc-app{opacity:0;pointer-events:none;display:none;}
.mode-mobile #mobile-app{opacity:1;display:flex;}
#pc-app{

  --glass-bg1:rgba(255,255,255,calc(0.095 * var(--glass-mult)));
  --glass-bg2:rgba(255,255,255,calc(0.042 * var(--glass-mult)));
  --glass-bg3:rgba(255,255,255,calc(0.063 * var(--glass-mult)));
  --glass-border:rgba(255,255,255,calc(0.45 * var(--glass-mult)));
  --glass-shadow:0 calc(16px * var(--glass-shadow-mult)) calc(48px * var(--glass-shadow-mult)) rgba(0,0,0,calc(0.30 * var(--glass-shadow-mult))),0 calc(4px * var(--glass-shadow-mult)) calc(12px * var(--glass-shadow-mult)) rgba(0,0,0,calc(0.18 * var(--glass-shadow-mult)));
  --text-color:#fff;--theme-transition-bg:rgba(0,0,0,0.75);--nav-link-color:#66ccff;--play-btn-bg:#66ccff;--title-color:#66ccff;

  --glass-shadow:0 calc(16px * var(--glass-shadow-mult)) calc(48px * var(--glass-shadow-mult)) rgba(0,0,0,calc(0.65 * var(--glass-shadow-mult))),0 calc(4px * var(--glass-shadow-mult)) calc(12px * var(--glass-shadow-mult)) rgba(0,0,0,calc(0.40 * var(--glass-shadow-mult)));
  --text-color:#e0e0e0;--theme-transition-bg:rgba(0,0,0,0.85);

#pc-app{background:url('722264.jpg') center/cover no-repeat;transition:filter 1.2s ease;position:relative;}
#pc-app::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:rgba(0,0,0,0.30);backdrop-filter:brightness(0.86) saturate(0.92);-webkit-backdrop-filter:brightness(0.86) saturate(0.92);transition:background 1.2s ease, backdrop-filter 1.2s ease;}

#pc-app #header-overlay{position:absolute;top:0;left:0;width:100%;height:110px;background:#fdeeef;opacity:0.30;pointer-events:none;z-index:1;transition:opacity .8s ease;}

#pc-app #title-text .line1{font-size:1.8em;}
#pc-app #title-text .line2{font-size:2.6em;}
#pc-app .liquid-glass,#pc-app #top-right-info,#pc-app #lyrics-island,#pc-app #pc-search-container,#pc-app #gear-island,#pc-app #modal,#pc-app #github-island,#mobile-app #mobile-search-container,#mobile-app #mobile-github-island{backdrop-filter:var(--glass-backdrop);-webkit-backdrop-filter:var(--glass-backdrop);box-shadow:var(--glass-shadow);}

#pc-app .liquid-glass{background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);border:1px solid var(--glass-border);transition:background .6s ease,border .6s ease,box-shadow .6s ease;}
#pc-app #player{position:fixed;top:130px;left:20px;width:350px;border-radius:24px;padding:14px 16px;z-index:1000;display:flex;align-items:center;gap:14px;user-select:none;will-change:left,top;backface-visibility:hidden;cursor:grab;touch-action:none;transition:box-shadow .3s ease,background .6s ease,border .6s ease;}

#pc-app #progress-fill{position:absolute;top:0;left:0;height:100%;width:0%;border-radius:calc(var(--progress-height)/2);background:var(--accent);background:linear-gradient(90deg,var(--accent),#88ddff,var(--accent));background-size:200% 100%;background-position:0% 0%;transition:none;will-change:width,background-position;box-shadow:0 0 6px rgba(102,204,255,.4);}
#pc-app #progress-fill.playing{animation:flowGradient 1.8s linear infinite,pulseGlow 1.2s ease-in-out infinite;}

@keyframes pulseGlow{0%,100%{box-shadow:0 0 6px rgba(102,204,255,.4);}50%{box-shadow:0 0 16px rgba(102,204,255,.8),0 0 30px rgba(102,204,255,.3);}}
#pc-app #progress{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;margin:0;padding:0;touch-action:none;}
#pc-app #time-display{font-size:10px;text-align:right;font-variant-numeric:tabular-nums;transition:color .6s ease;opacity:.9;padding:0 2px;line-height:1.3;letter-spacing:.2px;color:#fff!important;}
#pc-app .controls{display:flex;justify-content:space-between;align-items:center;padding-top:2px;}
#pc-app #song-list{position:fixed;width:380px;max-height:260px;border-radius:20px;overflow-y:auto;z-index:999;padding:8px 0;visibility:hidden;pointer-events:none;opacity:0;transform:scale(0.92) translateY(-8px);transform-origin:top center;will-change:transform,opacity;transition:background .6s ease,border .6s ease,box-shadow .6s ease;}

#pc-app #github-island svg{width:28px;height:28px;fill:rgba(255,255,255,.92);transition:fill .3s ease;}
#pc-app #github-island:hover svg{fill:#fff;}
#pc-app #icp-footer{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:50;text-align:center;white-space:nowrap;font-size:.75rem;letter-spacing:.5px;color:rgba(255,255,255,.7);pointer-events:auto;transition:color .6s ease;}

#pc-app #icp-footer a:hover{color:#fff;text-decoration:underline;}
#pc-app #pc-search-container{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:49;width:min(720px,90vw);max-width:760px;border-radius:28px;padding:4px 6px 4px 22px;display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);border:1.5px solid var(--glass-border);transition:all .3s cubic-bezier(0.25,0.46,0.45,0.94);will-change:transform,opacity;backface-visibility:hidden;min-height:52px;}
#pc-app #pc-search-container:focus-within{border-color:rgba(102,204,255,.60);box-shadow:var(--glass-shadow),0 0 0 4px rgba(102,204,255,.15);transform:translate(-50%,-50%) scale(1.02);}
#pc-app #pc-search-container .search-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:22px;height:22px;color:rgba(255,255,255,.62);transition:color .3s ease;}

#pc-app #pc-search-container:focus-within .search-icon{color:rgba(255,255,255,.9);}
#pc-app #pc-search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:clamp(15px,2.2vw,20px);font-family:inherit;padding:12px 4px;min-width:0;letter-spacing:.4px;font-weight:400;}

#pc-app .clear-btn{background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;padding:0 6px;transition:color .2s,transform .2s;display:flex;align-items:center;justify-content:center;height:100%;line-height:1;flex-shrink:0;width:32px;}
#pc-app .clear-btn:hover{color:#fff;transform:scale(1.1);}
#pc-app .pc-search-btn{flex-shrink:0;border:none;border-radius:24px;padding:10px 24px;background:rgba(102,204,255,.20);color:#fff;font-size:clamp(14px,1.6vw,17px);font-family:inherit;cursor:pointer;transition:background .25s ease,transform .2s ease,box-shadow .25s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);letter-spacing:.6px;font-weight:400;white-space:nowrap;display:flex;align-items:center;gap:6px;}

#pc-app #gear-island{position:fixed;right:32px;bottom:120px;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1100;transition:transform .25s ease,box-shadow .3s ease,background .6s ease,border .6s ease;background:linear-gradient(135deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);border:1px solid var(--glass-border);}

#pc-app #gear-island svg{width:32px;height:32px;color:rgba(255,255,255,.92);transition:transform .6s ease;}

#pc-app #modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
#pc-app #modal-overlay.visible{pointer-events:auto;opacity:1;visibility:visible;}
#pc-app #modal{position:relative;width:600px;max-width:94vw;min-height:620px;max-height:88vh;border-radius:28px;padding:22px 28px 24px 28px;display:flex;flex-direction:column;background:linear-gradient(145deg,var(--glass-bg1) 0%,var(--glass-bg2) 50%,var(--glass-bg3) 100%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow),inset 0 1px 1px rgba(255,255,255,calc(0.60 * var(--glass-mult))),inset 0 -1px 1px rgba(255,255,255,calc(0.15 * var(--glass-mult)));transform:scale(0.92) translateY(12px);opacity:0;transition:transform .38s cubic-bezier(0.1,0.9,0.2,1),opacity .32s cubic-bezier(0.1,0.9,0.2,1);will-change:transform,opacity;user-select:none;cursor:default;pointer-events:auto;}
#pc-app #modal-overlay.visible #modal{transform:scale(1) translateY(0);opacity:1;}
#pc-app #modal.closing{transform:scale(0.92) translateY(12px)!important;opacity:0!important;transition:transform .32s cubic-bezier(0.1,0.9,0.2,1),opacity .28s cubic-bezier(0.1,0.9,0.2,1);}
#pc-app .modal-header{display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:4px 0 6px 0;min-height:44px;user-select:none;cursor:grab;}
#pc-app .modal-header:active{cursor:grabbing;}
#pc-app #window-controls{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center;z-index:10;pointer-events:auto;}
#pc-app .dot{width:14px;height:14px;border-radius:50%;display:inline-block;transition:filter .2s,transform .15s;cursor:default;box-shadow:inset 0 1px 2px rgba(0,0,0,.1);flex-shrink:0;}
#pc-app .dot.red{background:radial-gradient(circle at 35% 35%,#ff6b6b,#d32f2f);cursor:pointer;}
#pc-app .dot.red:hover{filter:brightness(1.15);transform:scale(1.12);}
#pc-app .dot.yellow{background:radial-gradient(circle at 35% 35%,#ffd93d,#f9a825);}
#pc-app .dot.green{background:radial-gradient(circle at 35% 35%,#6bcf7f,#2e7d32);}
#pc-app .modal-title{font-size:1.1rem;font-weight:500;color:var(--text-color);letter-spacing:2px;transition:color .6s ease;text-align:center;line-height:1.2;pointer-events:none;}

#pc-app .modal-body{display:flex;flex:1;gap:18px;padding:4px 0 0 0;min-height:0;}
#pc-app .modal-sidebar{position:relative;display:flex;flex-direction:column;gap:14px;padding:8px 6px;flex-shrink:0;background:rgba(255,255,255,calc(0.04 * var(--glass-mult)));border-radius:16px;border:1px solid rgba(255,255,255,calc(0.10 * var(--glass-mult)));}
#pc-app .sidebar-icon{position:relative;z-index:1;width:42px;height:42px;border-radius:12px;background:transparent;border:1px solid transparent;color:rgba(255,255,255,.68);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color 0.25s ease, background 0.25s ease;padding:0;outline:none;}

function rgbToHue(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);const d=max-min;if(d===0)return null;let h=0;if(max===r)h=((g-b)/d)%6;else if(max===g)h=((b-r)/d)+2;else h=((r-g)/d)+4;h*=60;if(h<0)h+=360;return h;}

      'shadow':'#000000','scrim':'#000000','surface-tint':hslToHex(h,80,80),

async function extractSeedHct(imageUrl){
  const absUrl=resolveImageUrl(imageUrl);
  console.log('🎨 开始取色：',absUrl);
  return new Promise(function(resolve){
    let resolved=false;
    function done(val){if(resolved)return;resolved=true;resolve(val);}
    function processImage(img){
      try{
        const size=48;
        const canvas=document.createElement('canvas');
        canvas.width=size;canvas.height=size;
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0,size,size);
        let data;
        try{data=ctx.getImageData(0,0,size,size).data;}
        catch(secErr){console.warn('🎨 canvas 被污染（CORS），准备用 CORS 模式重试');return false;}
        const bins=new Float32Array(36);let totalChroma=0;
        for(let i=0;i<data.length;i+=4){
          const a=data[i+3];if(a<128)continue;
          const r=data[i],g=data[i+1],b=data[i+2];
          const max=Math.max(r,g,b),min=Math.min(r,g,b);const chroma=max-min;
          if(chroma<30)continue;
          const hue=rgbToHue(r,g,b);if(hue===null)continue;
          const bin=Math.floor(hue/10)%36;
          bins[bin]+=chroma*chroma;totalChroma+=chroma;
        }
        let maxBin=-1,maxVal=0;
        for(let i=0;i<36;i++){if(bins[i]>maxVal){maxVal=bins[i];maxBin=i;}}
        if(maxBin<0){console.warn('🎨 直方图全为灰阶，取色失败');done(null);return true;}
        const hue=maxBin*10+5;
        console.log('🎨 ✔ 取色成功：主色相 =',hue,'°，累计色度 =',totalChroma.toFixed(0));
        done({hue:hue,chroma:48,tone:50});return true;
      }catch(e){console.warn('🎨 processImage 异常：',e);done(null);return true;}
    }
    const img1=new Image();
    img1.onload=function(){console.log('🎨 图片已加载（普通模式）');if(processImage(img1))return;tryCors();};
    img1.onerror=function(e){console.warn('🎨 普通模式加载失败:',e);tryCors();};
    function tryCors(){
      console.log('🎨 尝试 CORS 模式重新加载...');
      const img2=new Image();img2.crossOrigin='anonymous';
      img2.onload=function(){console.log('🎨 图片已加载（CORS 模式）');if(!processImage(img2)){console.warn('🎨 CORS 模式读 canvas 也失败');done(null);}};
      img2.onerror=function(e){console.warn('🎨 CORS 模式加载失败:',e);done(null);};
      const sep=absUrl.indexOf('?')>=0?'&':'?';
      img2.src=absUrl+sep+'_mcu='+Date.now();
    }
    img1.src=absUrl;
    setTimeout(function(){if(!resolved){console.warn('🎨 取色超时（5s），放弃');done(null);}},5000);
  });
}

async function precomputeMd3Seed(imageUrl){
  if(!imageUrl)return null;
  const absUrl=resolveImageUrl(imageUrl);
  if(__md3SeedHct && __md3SeedHct.__src===absUrl){console.log('🎨 种子色缓存命中：',absUrl);return __md3SeedHct;}
  let seed=await extractSeedHct(absUrl);
  if(!seed){const fh=stringHash(absUrl)%360;console.warn('🎨 取色失败，回退色相 =',fh,'°');seed={hue:fh,chroma:48,tone:50};}
  seed.__src=absUrl;__md3SeedHct=seed;return seed;
}

function generateMd3Scheme(seed,isDark){
  const MCU=window.__MCU__;
  if(!seed || typeof seed.hue!=='number'){console.warn('MD3E: 无效种子色',seed);return;}
  if(MCU && MCU.Hct && MCU.SchemeTonalSpot && MCU.MaterialDynamicColors && MCU.hexFromArgb){
    try{
      const seedHct=MCU.Hct.from(seed.hue,seed.chroma||48,seed.tone||50);
      const scheme=new MCU.SchemeTonalSpot(seedHct,!!isDark,0);
      const app=document.getElementById('pc-app');let count=0;
      MD3_ROLES.forEach(function(pair){
        const mcuName=pair[0],cssName=pair[1];
        const dc=MCU.MaterialDynamicColors[mcuName];if(!dc)return;
        try{const argb=dc.getArgb(scheme);app.style.setProperty('--md-sys-color-'+cssName,MCU.hexFromArgb(argb));count++;}catch(e){}
      });
      console.log('🎨 ✔ MCU 方案已应用，共写入',count,'个变量，isDark =',!!isDark);
      try{
        const primaryHex=MCU.hexFromArgb(MCU.MaterialDynamicColors.primary.getArgb(scheme));
        app.style.setProperty('--accent',primaryHex);app.style.setProperty('--play-btn-bg',primaryHex);
      }catch(e){}
      return;
    }catch(e){console.warn('🎨 MCU 方案生成失败，改用简化方案:',e);}
  }
  generateSimplifiedMd3Scheme(seed.hue,isDark);
}

async function refreshMd3Scheme(){
  if(currentVisualStyle!=='md3e')return;
  const app=document.getElementById('pc-app');
  let url='722264.jpg';
  try{
    const bg=getComputedStyle(app).backgroundImage;
    const m=bg.match(/url\(["']?([^"')]+)["']?\)/);
    if(m&&m[1])url=m[1];
  }catch(e){}
  const seed=await precomputeMd3Seed(url);
  if(seed){generateMd3Scheme(seed,app.getAttribute('data-theme')==='dark');}
}

function updateTransparencyCardVisibility(style,skipTransition){
  const card=document.getElementById('transparency-card');
  if(!card)return;
  const shouldCollapse=(style==='md3e');
  if(skipTransition){
    const prevTransition=card.style.transition;
    card.style.transition='none';
    if(shouldCollapse)card.classList.add('collapsed');else card.classList.remove('collapsed');
    void card.offsetWidth;
    card.style.transition=prevTransition||'';
  }else{
    if(shouldCollapse)card.classList.add('collapsed');else card.classList.remove('collapsed');
  }
}

function applyVisualStyle(style){
  if(style!=='glass'&&style!=='md3e')style='glass';
  currentVisualStyle=style;
  const app=document.getElementById('pc-app');
  app.setAttribute('data-visual-style',style);
  document.querySelectorAll('.visual-style-btn').forEach(function(btn){btn.classList.toggle('active',btn.dataset.style===style);});

    MD3_ROLES.forEach(function(pair){app.style.removeProperty('--md-sys-color-'+pair[1]);});

function initVisualStyle(){
  let saved='glass';
  try{const v=localStorage.getItem(VISUAL_STYLE_KEY);if(v==='md3e'||v==='glass')saved=v;}catch(e){}
  currentVisualStyle=saved;
  document.getElementById('pc-app').setAttribute('data-visual-style',saved);

    btn.classList.toggle('active',btn.dataset.style===saved);
    btn.addEventListener('click',function(e){e.stopPropagation();applyVisualStyle(this.dataset.style);});
  });
  updateTransparencyCardVisibility(saved,true);
  const currentKey=THUMB_IMAGES[appliedThumbIndex]||'722264.jpg';

    if(currentVisualStyle==='md3e' && seed){

    }

async function fetchArtistSongs(artistId){
  const url=CONFIG.API_BASE+'/artist/songs?id='+artistId;
  const resp=await fetch(url);if(!resp.ok)throw new Error('HTTP '+resp.status);
  const json=await resp.json();
  let list=(json.data&&json.data.songs)||json.songs||(json.data&&json.data.list)||json.list||json.data||[];
  if(!Array.isArray(list))list=[];
  const filtered=list.filter(song=>{const id=String(song.id);return !CONFIG.EXCLUDED_IDS.includes(id);});
  return filtered.map(song=>{
    let artistName='未知歌手';
    if(song.ar&&Array.isArray(song.ar)&&song.ar[0]&&song.ar[0].name){artistName=song.ar[0].name;}
    else if(song.artists&&Array.isArray(song.artists)&&song.artists[0]&&song.artists[0].name){artistName=song.artists[0].name;}
    else if(song.artist&&typeof song.artist==='string'){artistName=song.artist;}
    else if(song.artist&&song.artist.name){artistName=song.artist.name;}
    else if(song.singer){artistName=song.singer;}
    let albumName=(song.al&&song.al.name)||song.album||'未知专辑';
    let coverUrl=(song.al&&song.al.picUrl)||song.picUrl||song.cover||'';
    return{id:String(song.id),name:song.name||song.title||'未知歌曲',artist:artistName,album:albumName,cover:coverUrl,url:'',lyric:''};
  });
}
async function fetchSongUrl(songId){

  const resp=await fetch(url);if(!resp.ok)throw new Error('HTTP '+resp.status);

  if(!playUrl)throw new Error('未获取到播放地址');

}
async function fetchSongCover(songId){

async function fetchSongLyric(songId){
  if(lyricCache[songId])return lyricCache[songId];
  const url=CONFIG.API_BASE+'/lyric?id='+songId;
  const resp=await fetch(url);if(!resp.ok)throw new Error('HTTP '+resp.status);
  const json=await resp.json();
  let lyricText=(json.data&&json.data.lyric)||json.lyric||(json.lrc&&json.lrc.lyric)||(json.data&&json.data.lrc&&json.data.lrc.lyric)||'';
  if(!lyricText)return null;
  const parsed=parseLRC(lyricText);lyricCache[songId]=parsed;return parsed;
}
function parseLRC(lrcText){
  const lines=lrcText.split('\n');const parsed=[];const timeRegex=/\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
  for(let line of lines){
    const trimmed=line.trim();if(!trimmed)continue;
    const match=trimmed.match(timeRegex);
    if(match){
      const minutes=parseInt(match[1]),seconds=parseInt(match[2]),ms=parseInt(match[3].padEnd(3,'0'));
      const totalSeconds=minutes*60+seconds+ms/1000;
      const text=trimmed.replace(timeRegex,'').trim();
      if(text)parsed.push({time:totalSeconds,text:text});
    }
  }
  if(parsed.length===0){
    const textLines=lrcText.split('\n').filter(line=>line.trim().length>0);
    if(textLines.length>0){
      const duration=audio.duration||180;const timeStep=duration/textLines.length;
      return textLines.map((text,i)=>({time:i*timeStep,text:text.trim()}));
    }
    return null;
  }
  parsed.sort((a,b)=>a.time-b.time);return parsed;
}

function updateAutoSwitchUI(enabled){if(enabled){autoSwitchTrack.classList.add('active');autoCheckbox.checked=true;}else{autoSwitchTrack.classList.remove('active');autoCheckbox.checked=false;}setManualControlsDisabled(enabled);}

/* ============ 主题轮播 ============ */
const THUMB_IMAGES=['722264.jpg','miku2.jpg','蝶云.png','nacho.png','airi.png','hua.jpg','zao.jpg'];
const THUMB_TITLES={'722264.jpg':'海边のミク','miku2.jpg':'桜ミク','蝶云.png':'洛天依-蝶变','nacho.png':'猫羽雫','airi.png':'桃井爱莉','hua.jpg':'常磐华乃','zao.jpg':'东风谷早苗'};
const THUMB_COLORS={'722264.jpg':'#66ccff','miku2.jpg':'#FFC0CB','蝶云.png':'#32CD32','nacho.png':'#B6D5E9','airi.png':'#f6829d','hua.jpg':'#feb7bb','zao.jpg':'#e2e2a8'};
let currentThumbIndex=0,appliedThumbIndex=0;
const thumbTrack=document.getElementById('thumb-track');
const thumbDots=document.getElementById('thumb-dots');
const thumbPrev=document.getElementById('thumb-prev');
const thumbNext=document.getElementById('thumb-next');
const modalSubtitle=document.getElementById('modal-subtitle');
const applyBtn=document.getElementById('apply-theme-btn');
const bgOverlay=document.getElementById('bg-transition-overlay');
const titleText=document.getElementById('title-text');
const navLinks=document.getElementById('navLinks');
function preloadImages(){THUMB_IMAGES.forEach(src=>{const img=new Image();img.onerror=function(){this.style.display='none';};img.src=src;});}
function updateThumbPosition(){
  const offset=-currentThumbIndex*100;
  thumbTrack.style.transform='translateX('+offset+'%)';
  const dots=thumbDots.querySelectorAll('span');
  dots.forEach((dot,i)=>{dot.classList.toggle('active',i===currentThumbIndex);});

  modalSubtitle.textContent=THUMB_TITLES[key]||'主题';

}
function goToThumb(index){if(index<0)index=THUMB_IMAGES.length-1;if(index>=THUMB_IMAGES.length)index=0;currentThumbIndex=index;updateThumbPosition();}
function hexToRgb(hex){const h=hex.replace('#','');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function applyColorScheme(color){
  if(currentVisualStyle==='md3e'){titleText.style.color=color;return;}
  titleText.style.color=color;
  navLinks.querySelectorAll('a').forEach(a=>{a.style.color=color;});
  mainPlayBtn.style.background=color;
  document.documentElement.style.setProperty('--play-btn-bg',color);
  document.documentElement.style.setProperty('--accent',color);
  document.documentElement.style.setProperty('--nav-link-color',color);
  const pcAppEl=document.getElementById('pc-app');
  if(pcAppEl){pcAppEl.style.setProperty('--play-btn-bg',color);pcAppEl.style.setProperty('--accent',color);pcAppEl.style.setProperty('--nav-link-color',color);}
  document.querySelectorAll('#lyrics-island .lyrics-line:not(.current)').forEach(line=>{line.style.color=color;if(line.classList.contains('prev')||line.classList.contains('next'))line.style.opacity='0.75';else if(line.classList.contains('placeholder'))line.style.opacity='0.65';});
  document.querySelectorAll('#song-list .song-item:not(.active-song) .song-name').forEach(el=>{el.style.color=color;});
  progressFill.style.background='linear-gradient(90deg, '+color+', #88ddff, '+color+')';
  applyBtn.style.background=color;
  var s=document.querySelector('.switch-track.active');if(s){s.style.background=color;s.style.borderColor=color;}
  var a=document.querySelector('.auto-switch-track.active');if(a){a.style.background=color;a.style.borderColor=color;}
  const indicator=document.getElementById('sidebar-indicator');
  if(indicator){const rgb=hexToRgb(color);indicator.style.borderColor=color;indicator.style.background='rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.24)';indicator.style.boxShadow='0 4px 16px rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.35), inset 0 1px 1px rgba(255,255,255,0.35)';}
  applyWhiteToHighlights();
}
function applyThemeByKey(key){
  var index=THUMB_IMAGES.indexOf(key);if(index===-1)key='722264.jpg';
  var color=THUMB_COLORS[key];var title=THUMB_TITLES[key];
  var imgTest=new Image();
  imgTest.onload=function(){
    document.getElementById('pc-app').style.backgroundImage="url('"+key+"')";
    document.getElementById('pc-app').style.backgroundSize='cover';
    document.getElementById('pc-app').style.backgroundPosition='center';
    document.getElementById('pc-app').style.backgroundRepeat='no-repeat';
    precomputeMd3Seed(key).then(function(seed){if(currentVisualStyle==='md3e' && seed){generateMd3Scheme(seed,document.getElementById('pc-app').getAttribute('data-theme')==='dark');}});
  };
  imgTest.onerror=function(){console.warn('背景图片加载失败:',key);};
  imgTest.src=key;
  applyColorScheme(color);
  currentThumbIndex=THUMB_IMAGES.indexOf(key);
  appliedThumbIndex=currentThumbIndex;
  updateThumbPosition();
  setCookie('theme_key',key,30);
  modalSubtitle.textContent=title;
}
function applyCurrentTheme(){
  var key=THUMB_IMAGES[currentThumbIndex];var color=THUMB_COLORS[key];var title=THUMB_TITLES[key];
  if(appliedThumbIndex===currentThumbIndex)return;
  bgOverlay.style.backgroundImage="url('"+key+"')";
  bgOverlay.style.opacity='0';bgOverlay.classList.add('active');
  void bgOverlay.offsetWidth;bgOverlay.style.opacity='1';
  applyColorScheme(color);
  var dots=thumbDots.querySelectorAll('span');
  dots.forEach((dot,i)=>{if(i===currentThumbIndex)dot.style.background=color;else dot.style.background='rgba(255,255,255,0.25)';});
  setTimeout(function(){
    var imgTest=new Image();
    imgTest.onload=function(){
      document.getElementById('pc-app').style.backgroundImage="url('"+key+"')";
      document.getElementById('pc-app').style.backgroundSize='cover';
      document.getElementById('pc-app').style.backgroundPosition='center';
      document.getElementById('pc-app').style.backgroundRepeat='no-repeat';
      precomputeMd3Seed(key).then(function(seed){if(currentVisualStyle==='md3e' && seed){generateMd3Scheme(seed,document.getElementById('pc-app').getAttribute('data-theme')==='dark');}});
    };
    imgTest.onerror=function(){console.warn('背景图片加载失败:',key);};
    imgTest.src=key;
    bgOverlay.style.opacity='0';
    setTimeout(function(){bgOverlay.classList.remove('active');bgOverlay.style.backgroundImage='';},1200);
    appliedThumbIndex=currentThumbIndex;
    modalSubtitle.textContent='✓ '+title;
    setTimeout(function(){if(currentThumbIndex===appliedThumbIndex)modalSubtitle.textContent=title;},1500);
    setCookie('theme_key',key,30);
  },300);
}
function initDefaultTheme(){var savedKey=getCookie('theme_key');if(savedKey&&THUMB_IMAGES.includes(savedKey))applyThemeByKey(savedKey);else applyThemeByKey('722264.jpg');}
function setCookie(name,value,days){const expires=new Date(Date.now()+days*24*60*60*1000).toUTCString();document.cookie=name+'='+encodeURIComponent(value)+'; expires='+expires+'; path=/';}
function getCookie(name){const match=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));if(match)return decodeURIComponent(match[2]);return null;}

/* ============ 时间 / 天气 ============ */
const clockEl=document.getElementById('clock');
const weatherIconEl=document.getElementById('weather-icon');
const weatherTempEl=document.getElementById('weather-temp');
const weatherDescEl=document.getElementById('weather-desc');
let userTimeZone='Asia/Shanghai';
let __lastWeatherData=null;

function updateClock(){
  const now=new Date();
  try{const formatter=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:userTimeZone});clockEl.textContent=formatter.format(now);}
  catch(e){const offset=8*60;const local=new Date(now.getTime()+(offset-now.getTimezoneOffset())*60000);clockEl.textContent=String(local.getHours()).padStart(2,'0')+':'+String(local.getMinutes()).padStart(2,'0')+':'+String(local.getSeconds()).padStart(2,'0');}
}
updateClock();setInterval(updateClock,1000);
fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{if(d.timezone){userTimeZone=d.timezone;updateClock();}}).catch(()=>{});

const WEATHER_CACHE_KEY='weather_cache',CACHE_DURATION=10*60*1000;

/* =================================================================
   ★★★ Pixel 官方天气图标（直接引用 Google CDN）★★★
   URL 格式：https://maps.gstatic.com/weather/v1/{icon_name}.svg
   暗黑模式：https://maps.gstatic.com/weather/v1/{icon_name}_dark.svg
   ================================================================= */
const GOOGLE_WEATHER_ICON_BASE='https://maps.gstatic.com/weather/v1/';

/* wttr.in 天气代码 → Google Weather API 图标名称 */
const GOOGLE_ICON_MAP={
  // 晴天
  113:'sunny',
  // 多云
  116:'partly_cloudy',
  119:'cloudy',
  122:'cloudy',
  // 雨
  176:'light_rain',293:'light_rain',296:'light_rain',
  299:'moderate_rain',302:'moderate_rain',
  305:'heavy_rain',308:'heavy_rain',
  311:'light_rain',314:'moderate_rain',
  353:'light_rain',356:'heavy_rain',359:'heavy_rain',
  // 雪
  179:'light_snow',182:'light_snow',185:'light_snow',
  227:'heavy_snow',230:'heavy_snow',
  320:'light_snow',323:'light_snow',326:'light_snow',
  329:'moderate_snow',332:'moderate_snow',
  335:'heavy_snow',338:'heavy_snow',
  368:'light_snow',371:'moderate_snow',374:'light_snow',377:'moderate_snow',
  // 雷暴
  200:'thunderstorm',386:'thunderstorm',389:'thunderstorm',392:'thunderstorm',395:'thunderstorm',
  // 雾
  143:'mist',248:'fog',260:'fog',
};

/* 回退 SVG（当 Google CDN 加载失败时使用） */
const FALLBACK_SVG={
  sunny:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><line x1="12" y1="2.5" x2="12" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="2.5" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="12" x2="21.5" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5.3" y1="5.3" x2="7.05" y2="7.05" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16.95" y1="16.95" x2="18.7" y2="18.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5.3" y1="18.7" x2="7.05" y2="16.95" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16.95" y1="7.05" x2="18.7" y2="5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  cloudy:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 18.5A4.5 4.5 0 0 1 6.2 9.55 5.5 5.5 0 0 1 17 8.4 4.5 4.5 0 0 1 17.5 18.5z" fill="currentColor"/></svg>`,
  rainy:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 15.5A4.2 4.2 0 0 1 6.2 7.15 5.2 5.2 0 0 1 16.3 6.05 4.2 4.2 0 0 1 16.8 15.5z" fill="currentColor"/><line x1="8.5" y1="17.8" x2="7.9" y2="20.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17.8" x2="11.4" y2="20.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="15.5" y1="17.8" x2="14.9" y2="20.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  snowy:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 15.5A4.2 4.2 0 0 1 6.2 7.15 5.2 5.2 0 0 1 16.3 6.05 4.2 4.2 0 0 1 16.8 15.5z" fill="currentColor"/><circle cx="8" cy="19" r="1.2" fill="currentColor"/><circle cx="12" cy="20.5" r="1.2" fill="currentColor"/><circle cx="16" cy="19" r="1.2" fill="currentColor"/></svg>`,
  thunderstorm:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 15.5A4.2 4.2 0 0 1 6.2 7.15 5.2 5.2 0 0 1 16.3 6.05 4.2 4.2 0 0 1 16.8 15.5z" fill="currentColor"/><path d="M13 16.2l-2.6 4.2h2.6l-1 2.6 4-5h-2.6l1.2-1.8z" fill="currentColor"/></svg>`,
  fog:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="13" x2="19" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="17" x2="21" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
};

/* 根据 wttr.in 代码获取回退 SVG 类型 */
function getFallbackKey(code){
  if(code===113)return 'sunny';
  if([200,386,389,392,395].includes(code))return 'thunderstorm';
  if([176,179,182,185,293,296,299,302,305,308,311,314,353,356,359].includes(code))return 'rainy';
  if([227,230,320,323,326,329,332,335,338,368,371,374,377].includes(code))return 'snowy';
  if([143,248,260].includes(code))return 'fog';
  return 'cloudy';
}

/* ★ 刷新天气图标（根据当前主题选择明亮/暗黑版本） */
function refreshWeatherIcon(){
  if(!__lastWeatherData)return;
  const data=__lastWeatherData;

  // 1. 判断当前主题
  const isDark=document.getElementById('pc-app').getAttribute('data-theme')==='dark';
  const suffix=isDark?'_dark.svg':'.svg';

  // 2. 获取图标名称
  const iconName=GOOGLE_ICON_MAP[data.code]||'cloudy';
  const iconUrl=GOOGLE_WEATHER_ICON_BASE+iconName+suffix;

  // 3. 用 <img> 引用，加载失败回退到内联 SVG
  const fallbackKey=getFallbackKey(data.code);
  const fallbackSVG=FALLBACK_SVG[fallbackKey]||FALLBACK_SVG.cloudy;

  const img=document.createElement('img');
  img.alt=data.desc||'';
  img.style.width='100%';
  img.style.height='100%';
  img.style.display='block';
  img.style.objectFit='contain';
  img.onerror=function(){
    console.warn('🌤️ Google 天气图标加载失败，回退到内置 SVG:',iconUrl);
    weatherIconEl.innerHTML=fallbackSVG;
  };
  img.src=iconUrl;

  weatherIconEl.innerHTML='';
  weatherIconEl.appendChild(img);
  console.log('🌤️ 天气图标已更新:',iconUrl);
}

function updateWeatherUI(data){
  __lastWeatherData=data;
  weatherTempEl.textContent=data.temp+'°C';
  weatherDescEl.textContent=data.desc||'';
  refreshWeatherIcon();
}

function fetchWeather(){
  const cached=localStorage.getItem(WEATHER_CACHE_KEY);
  if(cached){try{const data=JSON.parse(cached);if(Date.now()-data.timestamp<CACHE_DURATION){updateWeatherUI(data);return;}}catch(e){}}
  fetch('https://wttr.in/?format=j1&lang=zh').then(r=>r.json()).then(json=>{const current=json.current_condition[0];const data={temp:current.temp_C,desc:current.weatherDesc[0].value,code:parseInt(current.weatherCode),timestamp:Date.now()};localStorage.setItem(WEATHER_CACHE_KEY,JSON.stringify(data));updateWeatherUI(data);}).catch(()=>{const fallback={temp:'22',desc:'多云',code:119,timestamp:Date.now()};updateWeatherUI(fallback);});
}
fetchWeather();setInterval(fetchWeather,CACHE_DURATION);

function buildSongListUI(){
  songListEl.innerHTML='';
  if(!songList||!Array.isArray(songList)||songList.length===0){songListEl.innerHTML='<div class="song-item" style="color:#aaa;padding:12px;">暂无歌曲数据</div>';return;}
  songList.forEach((song,index)=>{
    if(!song||typeof song!=='object'){console.warn('跳过无效歌曲项:',song);return;}
    const div=document.createElement('div');div.className='song-item';div.dataset.index=index;
    const idxSpan=document.createElement('span');idxSpan.className='song-index';idxSpan.textContent=String(index+1).padStart(2,'0');
    const nameSpan=document.createElement('span');nameSpan.className='song-name';nameSpan.textContent=song.name||'未知歌曲';
    const artistSpan=document.createElement('span');artistSpan.className='song-artist';artistSpan.textContent=song.artist||'未知歌手';
    div.appendChild(idxSpan);div.appendChild(nameSpan);if(song.artist)div.appendChild(artistSpan);
    div.onclick=function(){const idx=parseInt(this.dataset.index);if(idx!==currentIdx)loadAndPlay(idx);else window.togglePlay();closeListWithAnimation();};
    songListEl.appendChild(div);
  });
  highlightCurrentSong();updateSongInfo();
}

<script>
(function(){
  const selector = '#pc-app button, #pc-app a, #pc-app input, #pc-app .song-item, #pc-app .sidebar-icon, #pc-app .thumb-dots span, #pc-app .switch-track, #pc-app .auto-switch-track, #mobile-app button, #mobile-app a, #mobile-app input';
  let active = null;
  document.querySelectorAll(selector).forEach(el => el.classList.add('jelly-interactive'));
  document.addEventListener('pointerdown', e => {
    const el=e.target.closest(selector);
    if(!el || e.button!==0) return;
    active={el,x:e.clientX,y:e.clientY};
    el.classList.remove('jelly-release');el.classList.add('jelly-grabbed');
    el.style.setProperty('--jelly-tilt','0deg');
    el.setPointerCapture?.(e.pointerId);
  });
  document.addEventListener('pointermove', e => {
    if(!active) return;
    const dx=e.clientX-active.x, dy=e.clientY-active.y;
    const x=Math.max(-18,Math.min(18,dx*.22)), y=Math.max(-14,Math.min(14,dy*.22)), tilt=Math.max(-12,Math.min(12,dx*.35));
    active.el.style.translate=x+'px '+y+'px';active.el.style.rotate=tilt+'deg';
    active.el.style.setProperty('--jelly-tilt',tilt+'deg');
  });
  function release(){
    if(!active) return;
    const el=active.el;
    el.classList.remove('jelly-grabbed');
    el.style.translate='0px 0px';el.style.rotate='0deg';
    el.classList.remove('jelly-release');
    void el.offsetWidth;el.classList.add('jelly-release');
    active=null;
  }
  document.addEventListener('pointerup',release);
  document.addEventListener('pointercancel',release);
  document.addEventListener('animationend',e=>{if(e.animationName==='jellySettle') e.target.classList.remove('jelly-release');});
})();
</script>
